rt pharmacy patients"},"follow":[{"q":"Which text did best?","a":"Two texts saying a flu shot was waiting for the patient: +2.9 percentage points, a 9.9% lift. Lay raters tracked results better than scientists (r = 0.60) but still placed it 16th."},{"q":"Is the top effect inflated?","a":"Somewhat. After a shrinkage correction for the winner's curse, the authors still estimate +2.7 percentage points, a 9.3% lift."},{"q":"How large was the average effect?","a":"The texts raised pharmacy vaccination by 2.0 percentage points on average, or 6.8%, over the three-month follow-up."}],"theme":"choice","forecast":{"claim":"Scientists’ average predictions missed which texts raised vaccination most.","truth":true},"chart":{"labels":["Scientists","Online lay raters"],"values":[0.03,0.6],"unit":"","highlight":0,"note":"Correlation of predictions with actual vaccination rates."}},{"id":"axf04","track":"AI × Business","format":"delegate","concept":"AI as messenger","title":"Who should break the news?","scene":"Your firm can present offers to customers through an AI agent or a human employee. A series of consumer experiments tested reactions to offers better or worse than customers expected.","question":"For each message, which messenger drew the better customer response?","delegate":{"choices":["AI agent","Human employee"],"tasks":[{"text":"A discount larger than the customer expected","answer":1,"why":"For offers better than expected, consumers responded more positively to a human agent."},{"text":"A renewal price higher than the customer expected","answer":0,"why":"For offers worse than expected, consumers showed higher purchase likelihood and satisfaction when dealing with an AI agent."}]},"answerTitle":"AI for worse offers, humans for better ones","explain":"Across consumer experiments, Garvey, Kim and Duhachek found worse-than-expected offers drew higher purchase likelihood and satisfaction from an AI agent, and better-than-expected offers drew more positive responses from a human, because AI seems to have weaker intentions.","implication":"If bots deliver price increases, review that choice for fairness and disclosure; deliver generous offers through people, where they earn more credit.","boundary":"Consumer experiments on purchase likelihood and satisfaction after single offers presented by AI or human agents.","sources":["garvey23"],"study":{"design":"Series of consumer experiments","n":"Multiple studies"},"follow":[{"q":"Why does the AI get a pass?","a":"Consumers see AI agents as having weaker intentions: no selfish motive when the offer favors the firm, no benevolent one when it favors the customer. That dampens reactions both ways."},{"q":"Can a firm get credit through a bot?","a":"Yes, partly. Making the AI agent more humanlike strengthened perceived intentions, giving the firm an avenue to receive due credit for a better offer."},{"q":"Do the authors see an ethics problem?","a":"Yes. They discuss ethical concerns about using AI to bypass consumer resistance to negative offers."}],"theme":"ai-trust"},{"id":"axf05","track":"AI × Business","format":"rank","concept":"Explainable AI","title":"Do explanations catch a bad model?","scene":"457 hospital clinicians diagnosed acute respiratory failure from case vignettes, first without AI, then with AI predictions, half also seeing image explanations. Some predictions came from a deliberately biased model.","question":"Rank the conditions by clinician diagnostic accuracy.","options":["Standard AI, no explanations","Biased AI, no explanations","Standard AI with explanations","No AI","Biased AI with explanations"],"rankAnswer":[2,0,3,4,1],"rankTies":[[0,2],[1,4]],"rankLabel":"Clinician diagnostic accuracy","rankValues":["+2.9 pp","-11.3 pp","+4.4 pp","73.0%","-9.1 pp"],"answerTitle":"Explanations did not rescue the biased model","explain":"From a 73.0% baseline, standard AI added 2.9 points, or 4.4 with explanations. Biased AI cut accuracy by 11.3 points; explanations recovered a non-significant 2.3, so pairs within each model type are not scored.","implication":"Audit models for systematic errors before deployment; do not count on explanation overlays to help staff catch bad predictions.","boundary":"Vignettes of acute respiratory failure with three candidate diagnoses, in one survey session, with bias built in by the researchers.","sources":["jabbour23"],"study":{"design":"Randomized clinical vignette survey","n":"457 clinicians in 13 US states"},"follow":[{"q":"What was the bias?","a":"The researchers built models that made systematic errors linked to patient characteristics, then showed their predictions to clinicians."},{"q":"What did the authors conclude?","a":"Standard AI raised accuracy, systematically biased AI lowered it, and image explanations did not mitigate the harm from the biased model."},{"q":"Who took part?","a":"Hospitalist physicians, nurse practitioners and physician assistants (median age 34), surveyed between April 2022 and January 2023."}],"theme":"ai-trust","permuted":true},{"id":"axf06","track":"AI × Business","format":"estimate","concept":"AI assistance gap","title":"Does the chatbot help the doctor?","scene":"Fifty physicians had 60 minutes for up to six hard clinical vignettes, randomized to GPT-4 plus usual resources or usual resources only. Researchers also had GPT-4 answer the cases alone. Physicians with usual resources only scored a median 74%.","question":"What median score did physicians with GPT-4 reach?","answerTitle":"76% versus 74%: no clear gain for physicians","explain":"Physicians scored a median 76% with GPT-4 and 74% with usual resources only, a difference that was not statistically significant (P = .60).","implication":"Before judging an AI tool by staff results, train staff to use it or build structured prompts into the workflow.","boundary":"Fifty US physicians working six challenging clinical vignettes, graded on a structured reasoning rubric.","sources":["goh24"],"study":{"design":"Randomized clinical trial","n":"50 physicians"},"follow":[{"q":"Did GPT-4 save time?","a":"Not significantly. Median time per case was 519 seconds with GPT-4 and 565 without (difference -82 seconds, P = .20)."},{"q":"Were physicians trained to prompt?","a":"No explicit prompt-engineering training was given, matching current integrations. The authors suggest training or predefined prompts in the workflow could help."},{"q":"How was GPT-4 alone tested?","a":"Researchers ran one fixed zero-shot prompt three times per case and graded the outputs blind, alongside the physicians' answers. Its median score was 92%."}],"theme":"ai-work","permuted":true,"estimate":{"target":76,"min":40,"max":100,"tolerance":3,"label":"Median diagnostic reasoning score with GPT-4","unit":"%"}}],"editorialRules":["Peer-reviewed journal research only for scored conclusions.","A scenario is a pedagogical illustration, not a replication.","Do not generalize task-specific effects to all populations.","Do not use working papers as evidence.","Published research may be contested or context-dependent."],"retired":[{"id":"biz09","title":"Same outcome, different decision","sources":["frame81"],"reason":"Duplicate of judg05 framing item; concept label only."},{"id":"biz10","title":"A decision memo rewrite","sources":["frame81"],"reason":"Advice the paper did not test as a remedy."},{"id":"biz12","title":"The vivid case","sources":["anchor74"],"reason":"Concept-label question with a non-serious distractor."},{"id":"biz13","title":"The cost of not deciding","sources":["avoid03"],"reason":"Concept-label question; no measured outcome."},{"id":"biz14","title":"Keep the incumbent","sources":["avoid03"],"reason":"Concept-label question; no measured outcome."},{"id":"judg01","title":"The risky offer","sources":["loss79"],"reason":"Concept-label question."},{"id":"judg03","title":"A convincing story","sources":["anchor74"],"reason":"Concept-label question."},{"id":"judg04","title":"The first estimate","sources":["anchor74"],"reason" ce heavily when they cannot see it fail. Control, task type and expertise move the balance."},{"id":"fairness","title":"Fairness and bias","principle":"Bias enters through the target a model predicts, the market that delivers it and the signals evaluators see. Measured outcomes, not intentions, show whether a process is fair."},{"id":"persuasion","title":"Persuasion and misinformation","principle":"Falsehood travels on human attention. AI can personalize arguments at scale, labels change trust in ways designers do not intend, and small prompts to think about accuracy help a little."},{"id":"choice","title":"Choice architecture","principle":"Defaults, frames and anchors decide many choices before preferences do, while menu effects are contested in real plans. The design of the decision is a management decision."},{"id":"incentives","title":"Pay, incentives and work design","principle":"Money changes the meaning of behavior as well as its price. Pay comparisons, fines and flexibility have effects that the incentive alone does not predict."},{"id":"evidence","title":"Measuring what works","principle":"Observational lift, expert forecasts and famous single studies often overstate effects. Randomized tests, replications and honest uncertainty protect budgets."},{"id":"honesty","title":"Honesty and compliance","principle":"Most people lie less than they could, many lie a little, and what they believe peers do shapes both. Enforcement works through norms as much as through penalties."},{"id":"norms","title":"Norms and polarization","principle":"The average opinion hides the distribution behind it. Misread norms, polarized expectations and visible bad examples drive behavior in teams and societies, and correcting beliefs can move it."},{"id":"forecasting","title":"Forecasting and teams","principle":"Forecasts improve with training, teaming and scoring, and fail through overconfidence and planning optimism. Whether turn-taking or members’ ability drives group performance is function rerender() { const key = focusKey(document.activeElement), pos = qs('#pick-list')?.scrollTop, sel = document.activeElement?.selectionStart; render(); const pl = qs('#pick-list'); if (pos && pl) pl.scrollTop = pos; const el = key && qs(key); if (el) { el.focus({ preventScroll: true }); if (sel !== undefined && el.setSelectionRange) try { el.setSelectionRange(sel, sel) } catch { } } }
async function poll() {
  if (!S) return;
  try {
    const d = await api('/api/rooms/' + S.code + (etag ? '?v=' + encodeURIComponent(etag) : ''));
    if (!d.same) { state = d; etag = d.etag || ''; if (d.evidence && BY[d.evidence.id]) Object.assign(BY[d.evidence.id], d.evidence); if (!fullLoaded) loadFull(); rerender() }
  }
  catch (e) { if (/No session/.test(e.message)) { sessionStorage.removeItem('thv:session'); S = null; state = null; render(); toast('That session no longer exists.'); return } }
  clearTimeout(timer); timer = setTimeout(poll, state && state.phase === 'open' ? 1500 : 3000);
}
async function control(action, challenge) { try { state = await api(`/api/rooms/${S.code}/control`, { action, challenge }); etag = ''; rerender(); const h = qs('.stage-h'); if (action === 'open' && h) h.focus() } catch (e) { toast(e.message) } }

document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'create') return; e.preventDefault();
  try { const d = await api('/api/rooms', { title: qs('#title').value, passcode: qs('#pass').value }); S = d; sessionStorage.setItem('thv:session', JSON.stringify(d)); render(); poll() } catch (err) { toast(err.message) }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) { showPicker = false; await control('open', b.dataset.open); return }
  const a = b.dataset.act;
  if (a === 'close' || a === 'reveal' || a === 'lobby') { showPicker = false; await control(a); return }
  if (a === 'projector') { document.body.classList.toggle('projector'); const on = document.body.classList.contains('projector'); document.querySelectorAll('[data-act=projector]').forEach(x => x.textContent = on ? 'Exit projector view' : 'Projector view'); if (on) { scrollTo(0, 0); qs('.stage-h')?.focus({ preventScroll: true }) } return }
  if (a === 'picker') { showPicker = true; rerender(); qs('#f-q')?.focus(); return }
  if (a === 'joining') { await control(state && state.joining === false ? 'unlockjoin' : 'lockjoin'); toast(state && state.joining === false ? 'Joining closed. Students already in can keep answering.' : 'Joining is open again.'); return }
  if (a === 'copy') { try { await navigator.clipboard.writeText(joinURL()); toast('Join link copied.') } catch { toast(joinURL()) } return }
  if (a === 'csv') { try { const r = await fetch(`/api/rooms/${S.code}/export.csv`, { headers: { 'X-Instructor-Key': S.secret, 'X-Client-Id': cid } }); if (!r.ok) throw Error('Export failed'); const blob = await r.blob(); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = `human-variable-${S.code}.csv`; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000) } catch (err) { toast(err.message) } return }
  if (a === 'end') { if (!confirm('End the session for everyone and delete all answers? Download the CSV first if you need it.')) return; await control('end'); sessionStorage.removeItem('thv:session'); S = null; state = null; clearTimeout(timer); render(); toast('Session ended. All answers deleted.'); return }
});
document.addEventListener('input', e => { if (e.target.id === 'f-q') { filter.q = e.target.value; const tmp = document.createElement('div'); tmp.innerHTML = picker(); qs('#pick-list')?.replaceWith(tmp.querySelector('#pick-list')) } });
document.addEventListener('change', e => { if (e.target.id === 'f-track') { filter.track = e.target.value; render() } if (e.target.id === 'f-format') { filter.format = e.target.value; render() } });
if (!location.protocol.startsWith('http')) { qs('#view').innerHTML = '<section class="wrap" style="padding:48px 0"><h1 class="q">The live classroom needs the server.</h1><p class="scene">Run <code>python start_classroom.py</code> in the project folder and open http://localhost:8502/classroom, or use your hosted address.</p></section>' }
else { render(); if (S) poll() }
})();
