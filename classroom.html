ty'?","a":"Reporting the higher of the two rolls instead of the first, a self-justifiable lie. Its benchmark average is 3.47, close to the 3.53 claimed in high-violation societies."},{"q":"How many people were fully honest?","a":"An estimated 48.9% on average, ranging from 4.3% to 87% across subject pools, with fewer fully honest people in high-violation societies."},{"q":"How was rule violation measured?","a":"A country index combining political fraud, tax evasion and corruption, based on data from 2003; the experiments ran at least eight years later."}],"study":{"design":"Cross-country lab experiment","n":"2,568 students, 23 countries"},"theme":"honesty","chart":{"labels":["Low rule-breaking countries","High rule-breaking countries"],"values":[3.17,3.53],"unit":"","highlight":1,"note":"Average amount claimed in the die-roll task."}},{"id":"tax-letter-norms","format":"multi","track":"Culture & Society","concept":"Norm messaging","title":"One sentence in a tax letter","scene":"The UK tax authority sent reminder letters to over 200,000 people with overdue tax. Letters varied one added message: social norms, public services, or loss versus gain framing.","question":"Which two findings did these field experiments report?","options":["Loss framing beat gain framing","Injunctive norms beat descriptive norms in the letters","Norm messages backfired overall","Public-services messages raised payment rates","Social norm messages raised payment rates"],"multiAnswers":[3,4],"answerTitle":"Norm and public-services lines raised payments","explain":"Across more than 200,000 UK taxpayers, adding social norm messages to standard reminders increased payment of overdue tax; public-services messages also helped, and loss framing did no better.","implication":"In compliance reminders, state accurately what most peers do and what the money funds, and test wording on real payment data.","boundary":"UK taxpayers with overdue Self Assessment debts; outcomes were short-run payment, which accelerated revenue rather than proving lasting compliance.","sources":["hallsworth17"],"follow":[{"q":"Which kind of norm worked better?","a":"Descriptive norms, which state what most people do, appeared more effective than injunctive norms about what people ought to do."},{"q":"Did loss framing help?","a":"No. The authors found no evidence that loss framing is more effective than gain framing."},{"q":"Was it expensive?","a":"No. The authors report that the experiments accelerated the collection of tax revenue at little cost."}],"study":{"design":"Two natural field experiments","n":"Over 200,000 UK taxpayers"},"theme":"choice","permuted":true},{"id":"opposing-views-bot","format":"forecast","track":"Culture & Society","concept":"Backfire exposure","title":"Follow the other side","scene":"Researchers paid frequent Twitter users who identified as Democrats or Republicans to follow, for one month, a bot retweeting elected officials and opinion leaders from the other party.","question":"Did a month of opposing views moderate Republicans?","forecast":{"claim":"Republicans who followed a liberal bot became more conservative afterward.","truth":true},"answerTitle":"Republicans moved right; Democrats barely moved","explain":"For Republicans the intent-to-treat effect was 0.12 points toward conservatism on a seven-point scale, rising to 0.60 among full compliers; the Democrats' shift was small and not significant.","implication":"Do not expect that feeding a divided team the other side's messages builds understanding; structure direct, cooperative contact instead.","boundary":"Party-identified US adults using Twitter at least three times weekly, paid to follow a bot for one month in late 2017.","sources":["bail18"],"follow":[{"q":"How many people took part?","a":"1,652 respondents were recruited (901 Democrats, 751 Republicans); 697 Democrats and 542 Republicans were analyzed."},{"q":"What happened to Democrats?","a":"They became slightly more liberal, but the intent-to-treat effect (-0.02 points on the seven-point scale) was not statistically significant."},{"q":"Why did Republicans move right?","a":"The authors could not identify the mechanism. They discuss more political exposure, exposure to women and minority voices, and an anti-elite reaction as possibilities."}],"study":{"design":"Field experiment","n":"1,652 recruited Twitter users"},"theme":"persuasion"},{"id":"facebook-deactivation","format":"multi","track":"Culture & Society","concept":"Social media welfare","title":"Four weeks without Facebook","scene":"Before the 2018 US midterm election, researchers randomly paid some Facebook users to deactivate their accounts for four weeks and compared them with users who kept using it.","question":"Which two effects did deactivation produce?","options":["Better factual news knowledge","Lower political polarization","Higher subjective well-being","Heavier Facebook use once reactivated"],"multiAnswers":[1,2],"answerTitle":"Less polarized and happier, but less informed","explain":"Deactivation lowered the polarization index by 0.16 standard deviations and raised well-being by 0.09, but news knowledge fell by 0.19.","implication":"Before limiting staff social media, weigh gains in mood and calmer politics against lower awareness of current news.","boundary":"Four weeks of paid deactivation among US Facebook users recruited through ads, in the run-up to a national election.","chart":{"labels":["Polarization","Well-being","News knowledge","Later Facebook use"],"values":[-0.16,0.09,-0.19,-0.61],"unit":" SD","highlight":0,"note":"Values reported in Allcott et al. (2020, AER), read in the authors' accepted manuscript; effects in standard deviations, treatment minus control."},"sources":["allcott20"],"follow":[{"q":"How much time did it free up?","a":"Deactivating Facebook freed up about 60 minutes per day for the average person in the treatment group."},{"q":"Did people go back to Facebook afterward?","a":"Less than before: post-experiment Facebook use was 0.61 standard deviations lower in treatment than in control."},{"q":"What did people need to be paid?","a":"The median willingness to accept to deactivate for four weeks was $100; the mean was $180."}],"study":{"design":"Randomized field experiment","n":"1,661 US Facebook users"},"theme":"persuasion","permuted":true},{"id":"accuracy-prompt","format":"forecast","track":"Culture & Society","concept":"Accuracy prompts","title":"One question before sharing","scene":"Researchers sent 5,379 Twitter users a private message asking them to rate the accuracy of a single non-political headline, then tracked the news they shared.","question":"Did one accuracy question improve what people shared?","forecast":{"claim":"The single accuracy prompt raised the average quality of news users shared.","truth":true},"answerTitle":"A small but real lift in quality","explain":"In the 24 hours after one private accuracy question, users shared news from higher-quality sites. More than 80% of 192 robustness analyses gave P < 0.05.","implication":"Add a light accuracy prompt before staff forward external content internally, and expect modest rather than dramatic gains.","boundary":"One private message to 5,379 Twitter users who had shared links to misleading sites; quality was measured over the next 24 hours.","sources":["pennycook21"],"follow":[{"q":"How was the Twitter test run?","a":"In Study 7, 5,379 Twitter users who had recently shared links to misleading, hyperpartisan sites got a private message asking them to rate one non-political headline's accuracy; the researchers then tracked what they shared."},{"q":"Why would people share news they doubt?","a":"In the survey studies, headline truth had little effect on sharing intentions despite a large effect on accuracy judgments; the authors argue attention is focused elsewhere."},{"q":"What happened in the survey experiments?","a":"Rating one non-political headline for accuracy at the start made people more discerning about which headlines they would share, in studies of 727, 780 and 1,268 Americans."}],"study":{"design":"Field experiment on Twitter plus survey experiments","n":"5,379 Twitter users"},"theme":"persuasion"},{"id":"false-news-spread","format":"choice","track":"Culture & Society","concept":"Rumor diffusion","title":"Who spreads the falsehood","scene":"Researchers traced about 126,000 fact-checked true and false stories that roughly 3 million Twitter users shared more than 4.5 million times between 2006 and 2017.","question":"What explains why false stories spread faster than true ones?","options":["The gap appeared for political stories, not others","Bots pushed false stories harder than true ones","Platform ranking pushed false stories up","People shared false stories more than true ones"],"answer":3,"answerTitle":"People, not bots, drove the faster spread","explain":"Across about 126,000 stories, falsehood spread farther and faster in all categories; bots accelerated true and false news at the same rate, so humans drove the gap.","implication":"Counter workplace rumors by addressing human sharing, such as fast, specific official updates, rather than relying on filtering automated accounts.","boundary":"Twitter from 2006 to 2017, with stories verified by fact-checkers; it describes how true and false stories diffused.","sources":["vosoughi18"],"follow":[{"q":"Which topics showed the largest gap?","a":"The effects were more pronounced for false political news than for other categories of information."},{"q":"Why might people share falsehoods more?","a":"False news was more novel than true news, and the authors suggest people are more likely to share novel information."},{"q":"Did bots matter at all?","a":"Bots accelerated true and false news at the same rate, so they did not explain why falsehood outran the truth."}],"study":{"design":"Observational diffusion study","n":"~126,000 stories, ~3 million users"},"theme":"persuasion","permuted":true},{"id":"misperceived-norms-support","format":"estimate","track":"Culture & Society","concept":"Pluralistic ignorance","title":"Private views in Riyadh","scene":"Researchers anonymously asked 500 married Saudi men aged 18 to 35 whether women should be allowed to work outside the home, and to guess how many peers agreed.","question":"What share of the men privately agreed?","estimate":{"target":87,"min":0,"max":100,"tolerance":5,"label":"Share privately supporting women working outside the home","unit":"%"},"answerTitle":"87% agreed, but guessed only 63% of peers did","explain":"87% of participants agreed that women should be able to work outside the home, yet on average they guessed that only 63% of the other men in their session agreed.","implication":"Before assuming a change lacks support, poll private views anonymously and share the actual numbers with the group.","boundary":"500 married men aged 18 to 35 in Riyadh, in sessions of about 30; beliefs concerned other men in the same session.","sources":["bursztyn20","plural93"],"follow":[{"q":"What happened when men learned the true figure?","a":"In the control group 23.5% chose to sign their wives up for a job-matching service; with the information, 32.0% did."},{"q":"Is this pattern seen elsewhere?","a":"Yes. Gaps between private views and what people assume their peers think have been documented in many settings, which is why measuring the actual share matters."},{"q":"What does this mean for a manager?","a":"Private support can be far higher than people assume; sharing the measured share can free people to make choices they thought their peers opposed."}],"study":{"design":"Survey and field experiment","n":"500 married Saudi men"},"theme":"norms"},{"id":"misperceived-norms-action","format":"choice","track":"Culture & Society","concept":"Correcting norms","title":"From belief to job applications","scene":"Half of a group of married Saudi men were randomly shown the true share of their session peers who privately supported women working outside the home. Months later, researchers checked whether their wives had applied for outside jobs.","question":"What happened to wives' job applications three to five months later?","options":["Fell, because of social backlash","Fell slightly as husbands pushed back","Rose from about 6% to about 16%","Rose from about 6% to about 8%, within noise"],"answer":2,"answerTitle":"Applications nearly tripled, 5.8% to 16.2%","explain":"Wives of informed men applied for outside jobs at 16.2% versus 5.8%, and interviewed at 5.8% versus 1.1%.","implication":"Share accurate peer-support data to move stalled behavior, then track actual outcomes for months, not just stated intentions.","boundary":"One city and one cohort of married men; employment itself rose from 7.4% to 9.4%, a difference within statistical noise.","chart":{"labels":["Applied, control","Applied, informed","Interviewed, control","Interviewed, informed"],"values":[5.8,16.2,1.1,5.8],"unit":"%","highlight":1,"note":"Values reported in Bursztyn, González & Yanagizawa-Drott (2020), follow-up survey results."},"sources":["bursztyn20"],"follow":[{"q":"What did men do right after?","a":"In the control group 23.5% chose to sign their wives up for a job-matching service; with the information, 32.0% did."},{"q":"Did employment increase?","a":"Not significantly: current outside-the-home employment rose from 7.4% to 9.4% (p = 0.235)."},{"q":"How wrong were the original beliefs?","a":"Men had underestimated how many of their peers privately supported women working outside the home."}],"study":{"design":"Field experiment with follow-up","n":"Married Saudi men from the original sessions"},"theme":"norms","permuted":true},{"id":"meta-perception-causal","format":"causal","track":"Culture & Society","concept":"Meta-perceptions","title":"They hate us, or do they?","scene":"Democrats and Republicans predicted how the other party would react to their own party's actions. Predictions were too negative, and the most inaccurate saw the other side as obstructionist.","question":"What best shows the inaccuracy itself drives obstructionism beliefs?","options":["The same bias appeared in a national sample","The most inaccurate partisans were also the most hostile","Randomly correcting beliefs cut obstructionism ratings","Inaccuracy tracked heavy political news consumption"],"answer":2,"dag":{"alt":"Partisanship may drive both inaccurate meta-perceptions and obstructionism beliefs; a randomized correction changes meta-perceptions directly and tests the questioned link.","height":200,"nodes":[{"id":"part","label":"Partisanship","x":90,"y":40},{"id":"meta","label":"Belief gap","x":240,"y":110},{"id":"obs","label":"Obstruction","x":420,"y":110},{"id":"fix","label":"Correction","x":90,"y":170,"mask":true}],"edges":[["part","meta"],["part","obs"],["meta","obs","q"],["fix","meta"]]},"answerTitle":"Correcting beliefs cut obstructionism attributions","explain":"Across 4,282 participants, people overestimated out-group negativity; in an experiment with 1,122 people, showing true out-group reactions significantly reduced perceived obstructionism.","implication":"In a divided team, collect each side's actual reactions to a proposal and share them before anyone assumes deliberate blocking.","boundary":"Found in competitive intergroup contexts; the correction was tested in one online experiment with 1,122 participants.","sources":["lees20"],"follow":[{"q":"Does this happen in cooperative settings?","a":"No. The negativity bias appeared across competitive but not cooperative intergroup contexts."},{"q":"Who benefited most from the correction?","a":"The intervention was more effective for people whose meta-perceptions were more inaccurate."},{"q":"How far off were the predictions?","a":"In the correction experiment, average inaccuracy was 22 points on a 100-point scale."}],"study":{"design":"Online experiments and survey","n":"4,282 participants"},"theme":"norms","permuted":true},{"id":"forecast-teams-rank","format":"rank","track":"Judgment","concept":"Team forecasting","title":"Alone, crowd, or team","scene":"In a two-year geopolitical forecasting tournament, volunteers were randomly assigned to forecast independently, in a crowd-belief condition, or in collaborative teams.","question":"Rank the three conditions from most to least accurate.","options":["Crowd-belief forecasters","Independent forecasters","Team forecasters"],"rankAnswer":[2,0,1],"rankLabel":"Forecast accuracy (Brier scores)","rankValues":["Beat independents, t(1120) = 5.92","Least accurate","Beat crowd-belief, t(1036) = 5.52"],"answerTitle":"Teams beat crowd-belief, which beat independents","explain":"In a tournament that began with 2,246 forecasters, teams were clearly more accurate than forecasters who saw the crowd’s beliefs, who in turn clearly beat forecasters working alone.","implication":"For risk forecasts, have analysts work in teams that share reasoning, and score their forecasts for accuracy over time.","boundary":"Geopolitical questions scored with Brier scores, with volunteers in one tournament; the paper reports test statistics.","sources":["mellers14"],"follow":[{"q":"What happened to the best performers?","a":"The top 2% from Year 1, 60 forecasters, formed five superforecaster teams of 12 and outperformed all other groups by a wide margin."},{"q":"How big was the tournament?","a":"Year 1 began with 2,246 participants; of 199 questions posted, eighty-five (Year 1) and 114 (Year 2) closed and were scored."},{"q":"How is accuracy scored?","a":"With Brier scores, where 0 is the best score and 2 is the worst."}],"study":{"design":"Randomized forecasting tournament","n":"2,246 forecasters (Year 1)"},"theme":"forecasting","permuted":true},{"id":"forecast-training","format":"choice","track":"Judgment","concept":"Probability training","title":"Forty-five minutes of training","scene":"Before forecasting geopolitical events, tournament volunteers were randomly given about 45 minutes of probability training, scenario training, or no training.","question":"Which training produced the more accurate forecasts?","options":["Neither beat no training","Scenario training","Probability training"],"answer":2,"answerTitle":"Probability training beat scenario training","explain":"In a tournament that began with 2,246 forecasters, about 45 minutes of probability training beat scenario training, and training was one of three interventions that raised accuracy.","implication":"Give forecasting and planning staff short training in probabilistic reasoning, and check its value with scored forecasts.","boundary":"Geopolitical forecasts by tournament volunteers; the paper reports significance tests for the training effect.","sources":["mellers14"],"follow":[{"q":"How long was the training?","a":"Approximately 45 minutes."},{"q":"Does training replace teamwork?","a":"No. The authors treat training as one of several interventions that raised accuracy."},{"q":"Who were the forecasters?","a":"Volunteers in a two-year geopolitical forecasting tournament; Year 1 began with 2,246 participants."}],"study":{"design":"Randomized forecasting tournament","n":"2,246 forecasters (Year 1)"},"theme":"forecasting","permuted":true},{"id":"overconfidence-hard-task","format":"choice","track":"Judgment","concept":"Overconfidence","title":"After the hard exam","scene":"In a lab study, 82 students took a hard trivia quiz. Before scores came out, each estimated their own score and their rank among the others.","question":"What pattern does the evidence predict on a hard task?","options":["Overestimate own score, and think they beat peers","Accurate on both","Overestimate own score, think they trail peers","Underestimate own score, think they beat peers"],"answer":2,"answerTitle":"Overestimate their score, yet rank themselves low","explain":"In 18 rounds of trivia quizzes with 82 students, people on difficult tasks overestimated their actual performance but believed they were worse than others; easy tasks reversed both.","implication":"After hard tasks, do not read low self-rankings as humility; compare absolute self-estimates with actual scores before staffing decisions.","boundary":"Trivia quizzes with clear difficulty differences among 82 Carnegie Mellon students; overprecision is a separate bias.","sources":["moore08"],"follow":[{"q":"What are the three kinds of overconfidence?","a":"Overestimation of one's actual performance, overplacement relative to others, and excessive precision in one's beliefs."},{"q":"What happens on easy tasks?","a":"People underestimate their actual performance but mistakenly believe they are better than others."},{"q":"How were beliefs measured?","a":"Participants reported distributions over their own and others' scores and were paid with an incentive-compatible scheme, about $20."}],"study":{"design":"Lab experiment plus theory","n":"82 students"},"theme":"forecasting","permuted":true},{"id":"dimant-masks-forecast","format":"forecast","track":"Judgment","concept":"Forecasting nudges","title":"Will the mask messages work?","scene":"Researchers tested seven messages (moral frames, mortality, scientific evidence, the economy) to raise mask-wearing among 4,931 US Republicans and Democrats. Beforehand, 1,034 forecasters predicted each message's effect.","question":"Is this what the study found?","forecast":{"claim":"At least one of the seven messages increased mask-wearing intentions among Democrats or Republicans.","truth":false},"answerTitle":"No message worked; forecasters still overestimated effects","explain":"Across 4,931 participants, none of the 7 nudges raised mask-wearing intentions or pledges in either party. Forecasters overestimated the effects overall (z = 4.40, p < 0.001), most of all for Democrats.","implication":"Treat expert predictions about which message works as hypotheses. Run a small randomized test before scaling a compliance campaign.","boundary":"One topic (COVID-19 mask-wearing), US Democrats and Republicans, and seven short messages.","sources":["masks22"],"follow":[{"q":"Were experts better than laypeople?","a":"Yes. Academics and practitioners made more accurate predictions than laypeople, but forecasters as a group still overestimated the effects."},{"q":"Who was in the forecasting pool?","a":"1,034 forecasters: 611 laypeople from a representative US panel and 103 from the authors' networks, plus 199 academics and 121 practitioners."},{"q":"Did forecasters at least rank the messages correctly?","a":"Not for Democrats. Predicted and observed effects for Democrats were negatively correlated (r = -0.63, p = 0.0003)."}],"study":{"design":"Forecasting study of a nudge experiment","n":"1,034 forecasters; 4,931 experiment participants"},"theme":"evidence"},{"id":"dimant-requiem-forecast","format":"forecast","track":"Business","concept":"Honesty nudges","title":"A free line on the form","scene":"Participants read one truthful norm message (what others did or approved of, framed positively or negatively), then reported whether a die roll matched a number they privately chose. Matches paid a bonus; lies were undetectable.","question":"Is this what the study found?","forecast":{"claim":"None of the four honesty messages reduced cheating compared with no message.","truth":true},"answerTitle":"None of the four messages changed behavior","explain":"Among 1,200 MTurk participants, misreporting (winning reports above the 16.67% that honest reporting would produce) hovered around 30 percentage points under every message, with null effects and tight confidence intervals.","implication":"Before adding an honesty statement to expense or reporting forms, test whether it actually shifts employees' beliefs about the norm.","boundary":"One-line messages before a die-reporting game with undetectable lies, in a high-powered preregistered study.","sources":["requiem20"],"follow":[{"q":"Why did the messages fail?","a":"A follow-up experiment found the messages did not change norm perceptions, so there was no belief shift to move behavior."},{"q":"Did anyone react to the message?","a":"Many participants misremembered the message in a way that supported cheating, and this group cheated significantly more."},{"q":"Did the framing matter?","a":"No. Neither empirical vs normative content nor positive vs negative framing produced an effect; none of the four worked."}],"study":{"design":"Pre-registered experiment","n":"1,200 MTurk participants"},"theme":"evidence"},{"id":"dimant-notalie-causal","format":"causal","track":"Business","concept":"Motivated beliefs","title":"\"Everyone does it,\" they say","scene":"In an incentivized experiment, people could misreport for money. Those who learned of this chance before stating what others do more often said most people lie, and more often reported winning.","question":"What best explains the link between this belief and misreporting?","options":["Temptation distorts the belief to justify lying","Seeing others lie taught both the belief and the habit","A taste for risk drives both the belief and lying","The belief reflects general cynicism, not the task"],"answer":0,"dag":{"alt":"Profit from lying feeds both the belief that most people lie and lying itself; the belief-to-lying arrow may be partly reversed.","height":200,"nodes":[{"id":"gain","label":"Lying pays","x":70,"y":100,"mask":true},{"id":"belief","label":"\"Most lie\"","x":260,"y":40},{"id":"lie","label":"Misreporting","x":450,"y":100}],"edges":[["gain","belief","q"],["gain","lie"],["belief","lie"]]},"answerTitle":"Temptation reshapes beliefs to excuse lying","explain":"Bicchieri, Dimant and Sonderegger show belief distortion: among people asked what others do, knowing a chance to lie was coming raised the share believing most people lie from 38.1% to 62.7%, and winning reports from 21.4% to 40.5%.","implication":"Do not treat \"everyone games it\" survey answers as facts; check them against actual compliance data and publish what peers really do.","boundary":"Incentivized experiment in which lying paid money and beliefs concerned the other participants.","sources":["notalie23"],"follow":[{"q":"Which beliefs were distorted?","a":"The paper studies two: empirical beliefs (what others do) and normative beliefs (what others approve of), and shows when and which are distorted."},{"q":"Which signal is hardest to explain away?","a":"Widespread honest behavior. People read it as a strong sign that lying is disapproved of; widespread lying was not read as approval."},{"q":"Who distorts beliefs?","a":"Conditional norm-followers: people who follow a norm only when they believe it applies, and who shade those beliefs when lying pays."}],"study":{"design":"Incentivized lying experiment","n":""},"theme":"honesty","permuted":true,"chart":{"labels":["Lying chance not yet known","Lying chance known in advance"],"values":[38.1,62.7],"unit":"%","highlight":1,"note":"Share believing that most people lie."}},{"id":"dimant-proximity-estimate","format":"estimate","track":"Culture & Society","concept":"Peer transparency","title":"The open dashboard problem","scene":"Penn students played repeated rounds of a charity game: give to, take from, or leave a donation. One group could see peers' past choices; another could not.","question":"By about how much did donations fall when peers' choices were visible?","estimate":{"target":20,"min":0,"max":100,"tolerance":4,"label":"Drop in donations vs no visibility","unit":"%"},"answerTitle":"Donations fell about 20% with visibility alone","explain":"With observation alone, participants took an additional 21.9 ECUs and donations fell by about 20% compared with no observation. People copied bad examples but ignored good ones.","implication":"Before publishing peer compliance dashboards, add even a minimal shared-identity cue among peers; without one, bad examples spread faster than good ones.","boundary":"Repeated giving game with Penn students; proximity was a minimal shared-identity cue.","sources":["prox22"],"follow":[{"q":"Did shared identity help?","a":"Yes. With a minimal social-proximity cue, extra taking fell to 7.5 ECUs, and seeing peers give raised donations by about 0.20 ECU per ECU given."},{"q":"How strongly did people copy bad behavior?","a":"Without proximity, each ECU a peer took cut a participant's own donation by about 0.24 ECU. Seeing peers give had no significant effect."},{"q":"Were the groups different at the start?","a":"No. Initial takers were 45%, 44% and 42% across conditions (p = 0.703), so the gap emerged from watching peers."},{"q":"Does this match Dimant’s 2019 contagion study?","a":"Yes. Both find that people copy bad examples more readily than good ones. Here a minimal shared-identity cue made good examples spread too; in the 2019 study, closeness to the observed peer amplified the spread of bad choices."}],"study":{"design":"Lab experiment","n":"842 Penn students (Experiment 1)"},"theme":"honesty"},{"id":"dimant-contagion-multi","format":"multi","track":"Culture & Society","concept":"Behavioral contagion","title":"Which behavior spreads faster?","scene":"In an experiment, people saw what peers had chosen before making their own pro-social or anti-social choices. The design also varied how socially close those peers were.","question":"Which two findings did the study report?","options":["Anti-social behavior was more contagious than pro-social","Pro-social individuals were the most easily swayed by their peers","Closeness amplified bad behavior's spread more than good","Closeness made people copy good and bad choices equally"],"multiAnswers":[0,2],"answerTitle":"Bad behavior spreads more, especially among close peers","explain":"Dimant shows, with 185 lab participants, that seeing an anti-social peer prompted people to revise their choice 33.7% of the time, against 19.4% for a pro-social peer. Under high social proximity the gap widened to 88.2% versus 34.8%.","implication":"In tight-knit teams people copy what close peers do, and bad conduct most of all: act on visible misconduct quickly and make good conduct just as visible.","boundary":"Experiment with pro- and anti-social choices and peers who varied in social proximity.","sources":["contagion19"],"follow":[{"q":"Who was most affected?","a":"Anti-social individuals were the most susceptible to contagion from other anti-social peers."},{"q":"How was closeness varied?","a":"By how socially close participants were to the peers whose earlier choices they saw."},{"q":"What is the finding meant to inform?","a":"Norm-based interventions: the paper argues its results help design policies that encourage pro-social and reduce anti-social behavior."},{"q":"Does the 2022 proximity study say the same?","a":"It fits. Here closeness meant answering personal questions more like the observed peer, and close peers' bad choices spread most. In Bicchieri, Dimant, Gächter and Nosenzo (2022), a minimal shared-identity cue made people copy good examples as well as bad ones, which halted the erosion of compliance."}],"study":{"design":"Behavioral experiment","n":"185 participants"},"theme":"norms","permuted":true,"chart":{"labels":["Saw an anti-social peer","Saw a pro-social peer"],"values":[33.7,19.4],"unit":"%","highlight":0,"note":"Share who changed their choice after seeing a peer."}},{"id":"dimant-deviant-choice","format":"choice","track":"Business","concept":"Weak sanctions","title":"Small fine, which message?","scene":"In a trust game, researchers added a weak penalty for returning too little, alone or with a message about what most others do or what most think is right. The cost of complying also varied.","question":"Which combination raised reciprocity?","options":["Penalty plus \"most others comply,\" with costly compliance","Penalty plus \"most think it's right,\" cheap compliance","Weak penalty alone","Norm message alone"],"answer":1,"answerTitle":"Penalty plus normative message, only when compliance is cheap","explain":"With 418 Penn participants, Bicchieri, Dimant and Xiao show that weak punishment plus a normative message raised trustees' returns to 42.7%, against 28.7% at baseline, when stakes were low. At high stakes, punishment plus empirical information cut returns to 22.2% versus 36.5%.","implication":"When a sanction is modest and compliance is costly, do not justify it with \"everyone complies\"; explain why the rule is right.","boundary":"Lab trust game combining a weak penalty with norm messages at two levels of compliance cost.","sources":["deviant21"],"follow":[{"q":"Why did the costly case backfire?","a":"Additional experiments attribute it to the punishment being perceived as unjustified, at least by some people."},{"q":"Did the penalty work on its own?","a":"No. In isolation, neither weak punishment nor empirical or normative information increased reciprocal behavior."},{"q":"How many conditions were tested?","a":"Six, systematically combining whether weak punishment existed with no norm information, empirical information or normative information."}],"study":{"design":"Lab experiment (trust game)","n":"418 participants"},"theme":"honesty","permuted":true,"chart":{"labels":["No penalty, no message","Weak penalty + approval message"],"values":[28.7,42.7],"unit":"%","highlight":1,"note":"Share of money sent back to the truster, low stakes."}},{"id":"dimant-enforcers-rank","format":"forecast","track":"Business","concept":"Whistle-blowing","title":"Who gets reported for bribery?","scene":"US adults read about a coworker accepting a bribe and chose how much evidence to submit, which set how likely the coworker was to be punished. The bribe either created inequity or restored equity; half also learned what most previous participants thought of taking bribes.","question":"How likely is it that the study found this?","answerTitle":"Norm information raised punishment of unfair bribes","explain":"Norm information raised the chosen probability of punishment from 73.3% to 82.8% when the bribe created inequity (P < 0.005), and from 57.9% to 67.2% when it restored equity (marginal, P = 0.074). Inequity-creating bribes drew more punishment overall (77.8% vs 62.3%, P < 0.001).","implication":"When you build a speak-up channel, tell staff that most colleagues object to taking bribes; in the study this raised willingness to act most for deals that create unfair advantages.","boundary":"Bribery vignette with 225 US adults, alongside a main behavioral study with 1,240 punishers from a representative US sample.","sources":["enforcers23"],"follow":[{"q":"Did the behavioral study agree?","a":"Yes. Lies that created inequity drew 52.8% of the maximum punishment vs 43.6% for lies that achieved equity (P < 0.001)."},{"q":"Does the size of the lie matter?","a":"Yes. The smallest lie drew 44.7% of maximum punishment, and each larger step added about 10 percentage points."},{"q":"When do norm messages work best?","a":"Study 3 found norm perceptions are malleable and norm-nudges are most effective when existing norms are ambiguous."}],"study":{"design":"Vignette experiment (Study 2)","n":"225 US adults across 10 states"},"theme":"honesty","forecast":{"claim":"Telling people that most others object to taking bribes raised the punishment they chose for bribes that created inequity.","truth":true},"chart":{"labels":["Unfair bribe, no norm info","Unfair bribe, norm info","Equalizing bribe, no norm info","Equalizing bribe, norm info"],"values":[73.3,82.8,57.9,67.2],"unit":"%","highlight":1,"note":"Average chosen probability that the coworker is punished, Study 2 vignette."}},{"id":"dimant-observability-choice","format":"forecast","track":"Culture & Society","concept":"Being watched","title":"Giving while watched","scene":"To boost charity giving, an experiment let another person observe each decision to give to a charity or take from its account. In some versions the observer simply watched, with no rewards or consequences attached.","question":"Is this what the study found?","answerTitle":"Watching alone did little and could backfire","explain":"Bolton, Dimant and Schmidt show, with 1,650 online participants, that being watched alone backfired: the charity account shrank 28.3% under observation against 18.4% unobserved. Asking people first about others' behavior turned this into a 9.3% gain.","implication":"Do not rely on visibility alone in giving or compliance drives; pair it with a clear statement of what is expected.","boundary":"Give-or-take charity games in the lab and online (n = 1,650), where a decision maker chose with or without a passive observer watching.","sources":["observ21"],"follow":[{"q":"Why would being watched backfire?","a":"The authors find that inequality aversion drives the backfiring of observability."},{"q":"What fixed it?","a":"Increasing the salience of norms mitigated the unintended consequences and increased pro-social behavior."},{"q":"Do people care about being observed at all?","a":"Yes. Individuals were sensitive to the observability of their actions; observation alone just rarely moved behavior in the intended direction."}],"study":{"design":"Experiments","n":"423 lab and 1,650 online participants"},"theme":"honesty","forecast":{"claim":"Letting another person watch each donation decision raised giving.","truth":false}},{"id":"dimant-motivated-estimate","format":"forecast","track":"Culture & Society","concept":"Shopping for permission","title":"Whose example do you pick?","scene":"Before a game where lying paid, US online participants chose whose information to see: a peer reporting more lenient behavior or views on lying, or a stricter one. No political labels were shown.","question":"How likely is it that the study found this?","answerTitle":"They tilted toward lenient peers: about 55%","explain":"Without identity cues, people chose lenient (above-median) peers’ information 54.61% of the time, a self-serving tilt in which sources they consulted.","implication":"When employees pick their own benchmarks or peer examples, default them to representative norm data instead.","boundary":"US participants choosing information sources before an undetectable lying game, with and without partisan identity cues.","sources":["motivated24"],"follow":[{"q":"Did political identity change the choice?","a":"Yes. With partisan labels, people chose in-group information 62.44% of the time when it was more lenient vs 58.29% when it was stricter."},{"q":"Did the information change behavior?","a":"Yes. Exposure to information suggesting lying is more socially acceptable increased lying. Views on what is right moved only with information about peers' views, not their actions."},{"q":"How large were the samples?","a":"Two experiments: 1,945 participants who chose their sources and 2,414 who were assigned information."}],"study":{"design":"Online experiments","n":"4,359 US MTurk participants (1,945 + 2,414)"},"theme":"norms","forecast":{"claim":"Without political labels, people chose lenient and strict peers’ information equally often.","truth":false}},{"id":"dimant-conspiracy-choice","format":"choice","track":"Culture & Society","concept":"Engagement incentives","title":"Sharing what you don't believe","scene":"In a multi-round sharing task, participants chose whether to share factual news or conspiracy theories, including ones they did not believe.","question":"What drove sharing of conspiracy theories people knew were false?","options":["Expected and received social engagement","Habit: they shared whatever appeared first","A hunch that the posts might be true","Novelty: conspiracy posts felt more original"],"answer":0,"answerTitle":"Expected engagement drove sharing of known falsehoods","explain":"Ren, Dimant and Schweitzer (N = 4,128) show that engagement drives sharing. When conspiracy posts earned more feedback, the share of people sharing them rose from 17% to 33% over four rounds, while the control group did not change significantly (21% to 17%).","implication":"Do not reward internal posts by raw engagement; recognize accuracy and sourcing, especially when reorganization rumors circulate.","boundary":"A pilot and three preregistered experiments with a simulated social-media sharing task.","sources":["beyond23"],"follow":[{"q":"Did people care about accuracy at all?","a":"Yes, but in addition to accuracy, people seemed to value social engagement, and traded one off against the other."},{"q":"How fast did feedback matter?","a":"People were very sensitive to feedback in the multi-round task: more feedback for conspiracy posts than for factual news raised conspiracy sharing."},{"q":"How was this tested?","a":"A pilot study and three preregistered experiments, reported in the Journal of Experimental Social Psychology."}],"study":{"design":"Pilot plus three preregistered experiments","n":"4,128 participants"},"theme":"persuasion","permuted":true,"chart":{"labels":["More feedback: round 1","More feedback: round 4","Control: round 1","Control: round 4"],"values":[17,33,21,17],"unit":"%","highlight":1,"note":"Share who shared conspiracy posts, Study 2."}},{"id":"dimant-opioid-forecast","format":"forecast","track":"Business","concept":"Incentive follow-through","title":"Cards on top of cash","scene":"A program paid US veterans cash to return unused opioid pills. Researchers randomly added two reminder cards built on timely reminders, planning prompts and loss framing.","question":"Is this what the study found?","forecast":{"claim":"Adding the reminder cards lowered the program's cost per pill returned.","truth":true},"answerTitle":"Cards raised returns and lowered cost per pill","explain":"Toma, Dimant and colleagues show, with 512 Veterans, that reminder cards raised the share returning unused pills by 6.88 percentage points over a 24.8% control rate, and cut program cost per pill returned from $15.66 to $12.57.","implication":"Before raising an incentive, test cheap, well-timed reminders that help people act on the incentive they already have.","boundary":"US veterans in one cash buyback program for opioid pills; the cards came on top of the cash incentive.","sources":["opioid26"],"follow":[{"q":"What did the cards do?","a":"They combined timely reminders, implementation prompts that help people plan the return, and loss framing of the cash on offer."},{"q":"Did more people return pills, or just more pills?","a":"Both. The cards raised the likelihood of returning unused pills and the number of pills returned."},{"q":"How strong is the design?","a":"It was a pre-registered field experiment with US veterans, published in Health Economics."}],"study":{"design":"Pre-registered field experiment","n":"512 veterans"},"theme":"honesty","chart":{"labels":["Cash incentive only","Cash + reminder cards"],"values":[15.66,12.57],"unit":"$","highlight":1,"note":"Program cost per pill returned."}},{"id":"dimant-hate-choice","format":"choice","track":"Culture & Society","concept":"Partisan cooperation","title":"Why won't they cooperate?","scene":"Across 15 behavioral experiments with over 8,600 people, participants decided how much to help, harm or cooperate with others who supported or opposed Donald Trump.","question":"What mainly explained weaker cooperation across the political divide?","options":["Genuine unwillingness to cooperate with opponents","Too little information about the other side","Expecting the other side not to cooperate","Stronger love for one's own side"],"answer":2,"answerTitle":"Pessimistic expectations, not unwillingness, drove the gap","explain":"In Dimant's public goods games, the share of conditional cooperators dropped by a similar amount for a Trump opponent (72.8% to 59.0%) and for a painting-preference outgroup (73.2% to 62.4%). Expectations differed: people predicted opponents would contribute less.","implication":"In politically mixed teams, share evidence that colleagues on the other side do cooperate before launching joint projects.","boundary":"Incentivized experiments on US polarization around Donald Trump, compared with other social identities.","sources":["hate23"],"follow":[{"q":"What does \"grim expectations\" mean here?","a":"Pessimistic beliefs about how cooperative the opposing faction would be, held before any interaction took place."},{"q":"What is the lever for a manager?","a":"Correcting what each side expects of the other targets the source of the gap more directly than appeals to goodwill."},{"q":"How large is the evidence base?","a":"Five preregistered studies with 15 well-powered experiments and over 8,600 participants, compared with other political and nonpolitical identities."}],"study":{"design":"Five preregistered studies, 15 experiments","n":"Over 8,600 participants"},"theme":"norms","permuted":true,"chart":{"labels":["Trump views: same side","Trump views: opposite side","Painting taste: same","Painting taste: different"],"values":[72.8,59.0,73.2,62.4],"unit":"%","highlight":1,"note":"Share who cooperate when they expect the partner to."}},{"id":"dimant-polarizednorms-choice","format":"choice","track":"Culture & Society","concept":"Polarized norms","title":"Pick the middle or a side?","scene":"A representative US sample played a two-player contribution game after seeing how others behaved: tightly clustered, widely spread, or split into two extreme camps.","question":"In the split, polarized setting, what did most people do?","options":["Chose an extreme, despite the risk","Chose the safe middle option","Acted as they did when norms were tight","Copied the average behavior"],"answer":0,"answerTitle":"Most picked extremes, accepting strategic risk","explain":"With 1,203 US adults, Dimant and colleagues show that a polarized, two-camp norm produced the most dispersed contributions (variance 2.68, against 1.26 under a tight norm), as most people chose extreme actions despite their strategic risk.","implication":"Report the spread of team behavior, not only the average; a split norm pulls people toward one camp or the other.","boundary":"Two-player contribution game with 1,203 US adults, with the distribution of others’ behavior set by design.","sources":["norms24"],"follow":[{"q":"What do tight, loose and polarized mean?","a":"Tight means low variance in others' behavior, loose means high variance, and polarized means u-shaped behavior clustered at two extremes."},{"q":"Whose behavior is hardest to predict?","a":"In loose and polarized environments, personal traits and values played a larger role in what people actually did."},{"q":"Why look beyond the average?","a":"Organizations increasingly use descriptive norms to nudge behavior; the authors show the whole distribution of peer behavior, not just its mean, shapes reactions."}],"study":{"design":"Online experiment, two-player contribution game (6 treatments)","n":"1,203 US adults (representative sample)"},"theme":"norms","permuted":true,"chart":{"labels":["Saw a tight norm","Saw a two-camp norm"],"values":[1.26,2.68],"unit":"","highlight":1,"note":"Variance of contributions after seeing others' choices."}},{"id":"judg09","track":"Judgment","concept":"Loss aversion","theme":"choice","format":"estimate","title":"Paired gambles","scene":"Offered a sure $3,000 or an 80% chance of $4,000, 80% of people took the sure money. A second group faced the mirror image: a sure loss of $3,000 or an 80% chance of losing $4,000.","question":"What share chose the gamble when both options were losses?","answerTitle":"92% gambled to avoid a sure loss","explain":"With gains, 80% chose the sure $3,000. With the same amounts as losses, 92% chose the gamble. People avoid risk for gains and seek it to escape a sure loss.","implication":"Expect teams behind on a target to take bigger risks. Review risky catch-up plans with the reference point in view.","boundary":"Hypothetical choices by 95 respondents per problem; real-stakes studies show the same pattern with varying size.","sources":["loss79"],"estimate":{"target":92,"min":0,"max":100,"tolerance":5,"label":"Share choosing the gamble with losses","unit":"%"},"chart":{"labels":["Gamble chosen, gains","Gamble chosen, losses"],"values":[20,92],"unit":"%","highlight":1,"note":"Kahneman & Tversky (1979), Problem 3 (p. 266) and Problem 3prime (Table I, p. 268)."},"study":{"design":"Hypothetical choice problems","n":"95 respondents per problem"},"follow":[{"q":"Is this the reflection effect?","a":"Yes. Kahneman and Tversky called it the reflection effect: preferences between gambles reverse when gains become losses."},{"q":"Were the stakes real?","a":"No. These were hypothetical choices. The paper argues people generally know how they would behave in such situations."},{"q":"What else did the paper introduce?","a":"Prospect theory: outcomes are judged as gains or losses from a reference point, and losses weigh more than gains of the same size."}]},{"id":"axb15","track":"AI × Business","concept":"AI and belief change","theme":"persuasion","format":"estimate","title":"Can a chatbot talk people out of it?","scene":"2,044 people who believed a conspiracy theory described it in their own words. GPT-4 Turbo then answered their specific claims with evidence over three rounds of conversation.","question":"By how much did belief in their own conspiracy theory fall?","answerTitle":"About 20%, and it held for two months","explain":"Belief in the chosen conspiracy fell by about 20% after three rounds of tailored, evidence-based dialogue, and the drop persisted two months later.","implication":"To correct persistent false beliefs among customers or staff, answer each person’s specific claim with evidence. A tailored AI dialogue can do this at scale.","boundary":"Online experiments with 2,044 conspiracy believers, in conversations with GPT-4 Turbo.","sources":["costello24"],"estimate":{"target":20,"min":0,"max":95,"tolerance":4,"label":"Drop in belief in their own conspiracy theory","unit":"%"},"study":{"design":"Online experiments","n":"2,044 conspiracy believers"},"follow":[{"q":"Did the effect fade?","a":"No. The reduction in belief persisted at the two-month follow-up."},{"q":"Did it change other beliefs too?","a":"Yes. The dialogues also reduced belief in conspiracy theories the participants had not discussed with the AI."},{"q":"Why tailor the conversation?","a":"Each participant described their own theory and evidence, and the model responded to those specific claims rather than giving a generic debunking."}]},{"id":"axe01","track":"AI × Business","format":"delegate","concept":"Word-of-machine effect","title":"Whose recommendation will customers trust?","scene":"Your retail site can show product picks from an AI engine or from a human expert. Eight experiments tested which source consumers prefer.","question":"For each recommendation, which source should customers see?","delegate":{"choices":["AI recommender","Human recommender"],"tasks":[{"text":"Pick a laptop on battery life and specs","answer":0,"why":"For practical attributes, people believe AI recommenders are more competent than humans."},{"text":"Pick a practical product fitted to one buyer's unique tastes","answer":1,"why":"The preference for AI reversed for utilitarian goals when the pick had to match a person's unique preferences (Study 5)."},{"text":"Pick a vacation spot chosen for sensory pleasure","answer":1,"why":"For hedonic picks, people judged AI recommenders less competent than humans (Studies 1 to 4)."}]},"answerTitle":"AI for practical picks; humans for taste","explain":"Across Studies 1 to 7b, people saw AI as more competent for utilitarian attributes and less competent for hedonic ones, and the preference for AI reversed when a practical pick had to fit one person’s unique tastes.","implication":"Label AI picks for practical product attributes; present taste-based picks as expert recommendations supported by AI.","boundary":"Consumer experiments on recommendations, measuring how competent people judged AI and human recommenders.","sources":["longoni22"],"study":{"design":"Series of consumer experiments","n":"Studies 1-4, 5, 6, 7a-7b"},"follow":[{"q":"Why do people resist AI for taste?","a":"They hold a lay belief that AI recommenders are more competent than humans in the utilitarian realm and less competent in the hedonic realm."},{"q":"Is the effect fragile?","a":"It held across product complexity, number of options considered and transaction costs."},{"q":"Can a firm reduce the bias?","a":"A consider-the-opposite prompt attenuated the effect, and framing the AI as augmenting a human eliminated it."}],"theme":"ai-trust"},{"id":"axe04","track":"AI × Business","format":"estimate","concept":"AI persuasion","title":"Can a model out-argue a professional?","scene":"Researchers showed 8,221 US adults real articles from covert state-aligned propaganda campaigns, GPT-3 articles on the same claims, or no article, and measured agreement.","question":"With no article, 24.4% agreed with the claims. What share agreed after one unedited GPT-3 article?","answerTitle":"Unedited GPT-3 reached 43.5%, near the originals’ 47.4%","explain":"Agreement rose from 24.4% with no article to 47.4% after the original propaganda and 43.5% after an unedited GPT-3 article.","implication":"Assume cheap AI copy can persuade nearly as well as professionals; review AI-written material for accuracy, not only tone.","boundary":"One exposure to a single article on six foreign-policy-style claims in 2021, with GPT-3.","sources":["goldstein24"],"study":{"design":"Online survey experiment","n":"8,221 US adults"},"follow":[{"q":"Where did the human articles come from?","a":"The researchers identified six articles from covert, likely state-aligned propaganda campaigns originating from Iran or Russia."},{"q":"Did every GPT-3 article make the claim?","a":"No. Two of 18 GPT-3 articles did not advance the intended claim; dropping them raised agreement to 45.6%."},{"q":"Were respondents told afterwards?","a":"Yes. After the survey, respondents were informed that the articles came from propaganda sources and may have contained false information."}],"theme":"persuasion","estimate":{"target":43.5,"min":20,"max":100,"tolerance":6,"label":"Share agreeing after an unedited GPT-3 article","unit":"%"}},{"id":"axe05","track":"AI × Business","format":"estimate","concept":"AI empathy","title":"Doctor or chatbot?","scene":"Health professionals, blinded to the source, compared physicians' answers to patient questions on Reddit's r/AskDocs with ChatGPT's answers to the same 195 questions.","question":"In what share of evaluations did raters prefer the chatbot's answer?","estimate":{"target":78.6,"min":0,"max":100,"tolerance":6,"label":"Evaluations preferring the chatbot","unit":"%"},"answerTitle":"Raters preferred the chatbot in 78.6%","explain":"Across 585 evaluations, raters preferred the chatbot 78.6% of the time. Good or very good quality: 78.5% of chatbot answers versus 22.1% of physicians'.","implication":"Pilot AI-drafted replies in patient or customer messaging, with staff review before sending.","boundary":"Public forum answers by volunteer physicians, rated for quality and empathy by a team of licensed health care professionals.","sources":["ayers23"],"study":{"design":"Cross-sectional blinded comparison","n":"195 questions, 585 evaluations"},"follow":[{"q":"How large was the empathy gap?","a":"45.1% of chatbot answers were rated empathetic or very empathetic, versus 4.6% of physician answers."},{"q":"Were chatbot answers longer?","a":"Yes. Physician answers averaged 52 words and chatbot answers 211, and the authors note length may have inflated empathy ratings."},{"q":"Which chatbot was tested?","a":"ChatGPT running GPT-3.5, with responses generated on December 22 and 23, 2022."}],"theme":"ai-work"},{"id":"axe06","track":"AI × Business","format":"estimate","concept":"Coding productivity","title":"What is a coding assistant worth?","scene":"Microsoft, Accenture and a Fortune 100 firm randomly gave some developers an AI coding assistant. Researchers pooled the three field experiments.","question":"By how much did completed tasks rise with access to the assistant?","estimate":{"target":26.08,"min":0,"max":100,"tolerance":10,"label":"Increase in completed tasks","unit":"%"},"answerTitle":"Completed tasks rose about 26%","explain":"Pooling 4,867 developers, access to the assistant raised completed tasks by 26.08% (standard error 10.3%).","implication":"Prioritize coding-assistant licenses and onboarding for junior developers, and track completed tasks before and after.","boundary":"Developers at three firms; single experiments were noisy and varied, and the outcome is completed tasks.","sources":["cui26"],"study":{"design":"Three randomized field experiments","n":"4,867 developers"},"follow":[{"q":"Who gained the most?","a":"Less experienced developers had higher adoption rates and greater productivity gains."},{"q":"Was every experiment clear-cut?","a":"No. The authors say each experiment is noisy and results vary across experiments; the 26.08% figure pools all three."},{"q":"How were developers assigned?","a":"A random subset of developers at each company received access to the AI-based coding assistant."}],"theme":"ai-work"},{"id":"axe07","track":"AI × Business","format":"forecast","concept":"Uncertainty and aversion","title":"Noisier markets, more model trust?","scene":"In nine forecasting studies, people chose between the best available algorithm and other methods, including human judgment, across more and less predictable domains.","question":"Is this what the study found?","forecast":{"claim":"People were more willing to use the best algorithm in more predictable domains.","truth":true},"answerTitle":"Uncertainty pushed people away from algorithms","explain":"Across nine studies (N = 4,820), people were less likely to use the best algorithm in more unpredictable domains. They favored methods with a chance of a near-perfect answer.","implication":"In volatile forecasting, such as demand or markets, report the model's track record against human forecasts, not its average error alone.","boundary":"Nine forecasting experiments with 4,820 participants who chose between their own forecasts and an algorithm’s, under low and high uncertainty.","sources":["dietvorst20"],"study":{"design":"Nine experiments","n":"4,820 participants"},"follow":[{"q":"What drives the rejection?","a":"Diminishing sensitivity to error: each extra unit of error matters less as errors grow, so a big miss feels little worse than a moderate one."},{"q":"What do people chase instead?","a":"They choose methods based on the perceived likelihood of a near-perfect answer and prefer methods with higher variance in performance."},{"q":"How large was the evidence base?","a":"Nine studies with 4,820 participants in total, all pointing to diminishing sensitivity to forecasting error as the mechanism."}],"theme":"ai-trust"},{"id":"axe08","track":"AI × Business","format":"forecast","concept":"Freelance displacement","title":"Are the best freelancers safe?","scene":"Researchers tracked freelancers on a large online labor platform before and after ChatGPT, DALL-E 2 and Midjourney were released.","question":"Is this what the study found?","forecast":{"claim":"Freelancers with strong past performance were shielded from the losses.","truth":false},"answerTitle":"Top freelancers were not spared","explain":"Hui, Reshef and Zhou found that after ChatGPT, DALL-E 2 and Midjourney launched, freelancers in highly affected occupations lost both jobs and earnings. Strong past performance offered no protection, and suggestive evidence shows top freelancers were hit harder.","implication":"Do not assume your strongest contractors keep their rates; review vendor mix and pricing in writing and image work.","boundary":"Short-term effects on one online platform after 2022 to 2023 model releases.","sources":["hui24"],"study":{"design":"Before-after study of model releases","n":"Freelancers on a large online platform"},"follow":[{"q":"Which tools were studied?","a":"ChatGPT for writing-related work and the image generators DALL-E 2 and Midjourney; other image-model releases showed similar effects."},{"q":"Did reputation help?","a":"No. High-quality service, measured by past performance and employment history, did not protect freelancers from the adverse effects."},{"q":"What do the authors conclude?","a":"Generative AI may change the role of human capital in organizations and reduce overall demand for workers."}],"theme":"ai-work"},{"id":"axe09","track":"AI × Business","format":"forecast","concept":"Job replacement","title":"Robot or rival: who replaces you?","scene":"Experiments asked people how they felt about workers being replaced by another person versus by robots or software, for others' jobs and for their own.","question":"Is this what the study found?","forecast":{"claim":"When imagining their own job loss, people preferred being replaced by a robot rather than by another person.","truth":true},"answerTitle":"For their own job, people preferred the robot","explain":"Granulo, Fuchs and Puntoni found that people prefer other workers to be replaced by humans rather than robots but reverse that preference for their own job. Losing out to a machine threatens self-worth less, though it threatens one's economic future more.","implication":"When automating roles, address economic security directly; do not assume staff will be less upset than with outsourcing to people.","boundary":"Online experiments in which people imagined jobs, their own or others’, being taken over by robots or by other workers.","sources":["granulo19"],"study":{"design":"Series of experiments"},"follow":[{"q":"Why prefer a robot for your own job?","a":"Being replaced by machines, robots or software was associated with reduced self-threat compared with being replaced by another person."},{"q":"Is robot replacement less threatening overall?","a":"No. It was associated with a greater perceived threat to one's economic future."},{"q":"What about other people's jobs?","a":"As observers, people tended to prefer that workers be replaced by other humans rather than robots."}],"theme":"ai-work"},{"id":"axe10","track":"AI × Business","format":"forecast","concept":"AI ad creative","title":"Will AI images win the click?","scene":"Researchers generated 10,320 marketing images with seven text-to-image models from 2,400 human-made images, then ran a live ad test with over 173,000 impressions.","question":"Is this what the study found?","forecast":{"claim":"In the live ad test, the human-made image beat the AI-generated images on click-through rate.","truth":false},"answerTitle":"No: AI images won by up to 50%","explain":"In the field study, an AI-generated image achieved an up to 50% higher click-through rate than a human-made image, and 254,400 human evaluations showed AI images can surpass human ones.","implication":"A/B test AI-generated creative against your current images before commissioning new shoots; cost and speed favor the trial.","boundary":"The 50% figure is an upper bound from one field test; results vary by model and image.","sources":["hartmann25"],"study":{"design":"Image evaluations plus field ad test","n":"254,400 evaluations; 173,000+ impressions"},"follow":[{"q":"Which models were used?","a":"Seven text-to-image models, including DALL-E 3, Midjourney v6, Firefly 2, Imagen 2 and Stable Diffusion XL Turbo."},{"q":"Is 50% the average gain?","a":"No. Up to 50% higher click-through is the best case across the images tested, not their average."},{"q":"What about cost?","a":"The authors note AI can produce marketing content faster and orders of magnitude cheaper."}],"theme":"persuasion"},{"id":"axe11","track":"AI × Business","format":"multi","concept":"AI misinformation","title":"Which tweets fool readers?","scene":"697 participants judged whether tweets were accurate. Some were real tweets, others written by GPT-3, and each set mixed true and false claims.","question":"Which two statements match what readers did?","options":["True tweets by GPT-3 were judged correctly more often","False tweets by GPT-3 slipped past readers slightly more often","Readers took longer to judge GPT-3 tweets than human tweets","Readers could tell which tweets GPT-3 had written"],"answerTitle":"GPT-3 helped true claims and slightly shielded false ones","explain":"True GPT-3 tweets were recognized more often than true human tweets (0.84 vs 0.72). False GPT-3 tweets were caught slightly less often than false human tweets (0.89 vs 0.92).","implication":"Fact-check AI-drafted public content as strictly as human drafts; fluent AI text makes errors harder to spot.","boundary":"Short tweets on a fixed set of topics, written with GPT-3 in an online survey; the false-tweet gap was small.","sources":["spitale23"],"study":{"design":"Online survey experiment","n":"697 participants"},"follow":[{"q":"Could readers tell AI from human tweets?","a":"No. Scores for identifying the source hovered around 0.5, close to chance."},{"q":"Were AI tweets judged faster?","a":"Yes. Readers took 29.14 seconds on average for true human tweets versus 21.02 for true GPT-3 tweets and 19.87 for false GPT-3 tweets."},{"q":"How big was the falsehood gap?","a":"Small: 0.92 for false human tweets versus 0.89 for false GPT-3 tweets, P = 0.0032; the authors call the effect small."}],"theme":"persuasion","multiAnswers":[0,1],"chart":{"labels":["True tweet, by people","True tweet, by GPT-3","False tweet, by people","False tweet, by GPT-3"],"values":[0.72,0.84,0.92,0.89],"unit":"","highlight":3,"note":"Accuracy at judging whether tweets were true (0 to 1)."}},{"id":"axe12","track":"AI × Business","format":"causal","concept":"Confounded evaluation","title":"Is the AI penalty real?","scene":"In a series of experiments, people evaluated workers, some of them described as getting help from AI.","question":"What explains the lower ratings?","options":["AI users’ work was simply weaker","The penalty came mainly from managers who use AI","Raters saw AI users as lazier","Raters could tell which work used AI"],"answer":2,"dag":{"alt":"Disclosed AI use leads raters to see the worker as lazy, which lowers the rating, even when the work is held constant.","height":160,"nodes":[{"id":"ai","label":"Uses AI","x":70,"y":70},{"id":"lazy","label":"Seen as lazy","x":260,"y":70,"mask":true},{"id":"rating","label":"Rating","x":440,"y":70}],"edges":[["ai","lazy"],["lazy","rating"]]},"chart":{"labels":["Help from AI","Non-AI help","No help mentioned"],"values":[2.5,2.16,2.02],"unit":"","highlight":0,"note":"Mean laziness ratings of otherwise identical targets. Values reported in Reif, Larrick & Soll 2025, Study 2."},"answerTitle":"AI users were judged lazier for the same work","explain":"In Study 2 (n = 1,203), targets helped by AI were rated lazier (2.50) than those helped by non-AI sources (2.16) or with no help mentioned (2.02), and less competent.","implication":"Before reading ratings as performance, train reviewers on AI-use bias and judge output against the same rubric.","boundary":"Four preregistered vignette experiments with 4,439 online participants rating colleagues and candidates who used AI or other help.","sources":["reif25"],"study":{"design":"Four preregistered experiments","n":"4,439 participants"},"follow":[{"q":"Do employees expect the penalty?","a":"Yes. In Study 1, people imagining AI use expected to look lazier and less competent and were less willing to disclose the tool to managers."},{"q":"Did all managers penalize AI users?","a":"No. Managers who use AI less favored the non-AI candidate; managers who use AI often favored the candidate who uses AI daily."},{"q":"Can the penalty disappear?","a":"Yes. When AI was described as useful for a digital task, the penalty in perceived task fit was entirely offset."}],"theme":"ai-work","permuted":true},{"id":"axe13","track":"AI × Business","format":"choice","concept":"Personalized persuasion","title":"Does tailored AI copy sell?","scene":"297 participants saw either a ChatGPT ad personalized to their personality or a generic ad, for a weekend trip to Rome and for sneakers.","question":"What did personalized ads change?","options":["Lowered spending intent for both products","Raised spending intent for both products","Raised spending intent for the sneakers, not the trip","Raised spending intent for the trip, not sneakers"],"answer":3,"answerTitle":"Trip spending rose $117; sneakers did not move","explain":"Personalized getaway ads raised willingness to spend by $117 and were rated more effective; sneaker effects trended positive but were not significant.","implication":"Test AI personalization product by product; start with experiential offers before rolling it out across the catalog.","boundary":"Short ChatGPT prompts with minimal profile data, measuring stated willingness to pay.","sources":["matz24"],"study":{"design":"Online experiment (Study 4 of 4)","n":"297 participants"},"follow":[{"q":"How consistent were effects across studies?","a":"Of 33 message versions tested across all studies, 30 were directionally effective and 20 were significantly so (61%)."},{"q":"Which profiles were targeted?","a":"Big Five personality traits, regulatory focus, political ideology and moral foundations, in consumer, climate and exercise messages."},{"q":"How much data did ChatGPT get?","a":"Very little. All studies used very short prompts with minimal information about each person."}],"theme":"persuasion","permuted":true},{"id":"axe14","track":"AI × Business","format":"multi","concept":"Bot disclosure","title":"The sales bot","scene":"A company randomly assigned over 6,200 customers to structured outbound sales calls from AI chatbots or human agents, varying whether the bot's identity was disclosed.","question":"Which two results did the field experiment find?","options":["Disclosure made calls longer","Undisclosed bots sold as well as proficient agents","Disclosure timing made no difference","Disclosing the bot up front cut purchases sharply","Disclosed bots seemed more knowledgeable to customers"],"multiAnswers":[1,3],"answerTitle":"Bots sold well until they announced themselves","explain":"Undisclosed chatbots were as effective as proficient workers; disclosing the bot before the conversation reduced purchase rates by more than 79.7%.","implication":"Disclose the bot at the start of the call, as transparency rules require, and treat the measured drop in purchases as a cost to manage through service quality, not through hiding the bot.","boundary":"Highly structured outbound sales calls at one company.","sources":["luo19"],"study":{"design":"Field experiment","n":"6,200+ customers"},"follow":[{"q":"Why did disclosure hurt?","a":"Customers perceived the disclosed bot as less knowledgeable and less empathetic, though its competence had not changed."},{"q":"What softened the penalty?","a":"A late disclosure timing strategy and customers' prior AI experience mitigated the negative effect."},{"q":"How did bots compare with new hires?","a":"Undisclosed chatbots were four times more effective than inexperienced workers."}],"theme":"ai-trust","permuted":true},{"id":"genai1","track":"AI × Business","format":"multi","case":{"id":"genai-content","title":"Generative AI in your content team","step":1,"of":3},"concept":"Creativity and sameness","title":"Artists adopt AI images","scene":"Your creative lead wants text-to-image AI for the design team. A study tracked 53,000+ artists on a major art-sharing platform, 5,800 of whom adopted such tools.","question":"Which two changes followed artists' adoption of AI?","options":["Average content novelty rose","Favorites per view rose","Prior originality decided who gained","Output volume rose","Visual novelty increased"],"multiAnswers":[1,3],"chart":{"labels":["Before adoption","After adoption"],"values":[2,3],"unit":"%","highlight":1,"note":"Rate of earning a favorite per view. Values reported in Zhou & Lee 2024, Results."},"answerTitle":"More work, more favorites, less visual novelty","explain":"Adopters produced more and their favorites per view rose from 2% to 3%. Average content novelty and visual novelty both declined.","implication":"Use AI to raise volume, but assign a reviewer to flag look-alike output and reward novel concepts.","boundary":"Artists who chose to adopt AI on one platform; favorites measure peer reactions.","sources":["zhou24"],"study":{"design":"Observational study of AI adoption","n":"53,000+ artists; 4 million+ artworks"},"follow":[{"q":"Did anyone become more original?","a":"Peak content novelty rose slightly (marginally significant), and AI-assisted artists who explored more novel ideas earned better peer evaluations, regardless of prior originality."},{"q":"What skills mattered most?","a":"The authors conclude that ideation and filtering are likely necessary skills in the text-to-image process."},{"q":"How much did output rise?","a":"Artists’ productivity rose 25% after adoption, alongside more favorable peer evaluations of their work."}],"theme":"ai-work","permuted":true},{"id":"genai2","track":"AI × Business","format":"forecast","case":{"id":"genai-content","title":"Generative AI in your content team","step":2,"of":3},"concept":"Human-in-the-loop editing","title":"How much should editors touch it?","scene":"Your team will publish persuasive AI-written articles. A survey experiment of 8,221 US adults tested GPT-3 articles with different amounts of human prompt editing and curation.","question":"How likely is it that the study found this?","answerTitle":"About 53%, against 47% for the originals","explain":"Editing the prompt and choosing the best of three outputs reached 52.7% agreement, above the human-written originals and well above unedited GPT-3.","implication":"Budget editor time for prompt design and picking among several drafts rather than line-editing one draft.","boundary":"GPT-3 articles on six claims from propaganda campaigns, read once.","sources":["goldstein24"],"study":{"design":"Online survey experiment","n":"8,221 US adults"},"follow":[{"q":"What did prompt editing involve?","a":"Researchers gave GPT-3 the researcher-written thesis statement instead of an excerpt and edited the example articles on unrelated topics."},{"q":"Was prompt editing alone enough?","a":"Nearly. Editing the prompt alone brought it level with the originals; the small remaining difference was not statistically significant."},{"q":"How much did curation matter?","a":"Picking the best of three drafts added agreement beyond what prompt editing alone achieved."}],"theme":"persuasion","forecast":{"claim":"With an edited prompt and the best of three drafts, GPT-3 articles drew at least as much agreement as the human-written originals.","truth":true},"chart":{"labels":["No article","Original propaganda","AI article, unedited","AI article, curated"],"values":[24.4,47.4,43.5,52.7],"unit":"%","highlight":3,"note":"Share agreeing with the article's main claim."}},{"id":"genai3","track":"AI × Business","format":"choice","case":{"id":"genai-content","title":"Generative AI in your content team","step":3,"of":3},"concept":"AI disclosure","title":"Label the AI-written reply?","scene":"In an experiment, people described a personal situation and got a reply from Bing Chat or from a person. Some replies were labeled as AI-written, others as human.","question":"What does the experiment predict for labeled AI replies?","options":["Labeling replies as AI raises trust and feeling heard","Human replies feel more heard, whatever the label","AI replies feel colder, with or without a label","AI replies feel more heard; the label erodes it"],"answer":3,"chart":{"labels":["AI-written","Human-written","Labeled AI","Labeled human"],"values":[5.74,5.17,5.13,5.81],"unit":"","highlight":2,"note":"Feeling heard, 7-point scale; source and label manipulated separately. Values reported in Yin, Jia & Wakslak 2024, Results."},"answerTitle":"AI helps people feel heard; the label undercuts it","explain":"AI replies made people feel more heard than human replies (5.74 vs 5.17), but an AI label lowered feeling heard (5.13 vs 5.81 for a human label).","implication":"Keep the label, but expect a dip; measure customers' attitudes toward AI and have staff personalize sensitive replies.","boundary":"One online experiment with Bing Chat and one-off replies.","sources":["yin24"],"study":{"design":"2 x 2 online experiment","n":"455 participants"},"follow":[{"q":"Was the AI better at reading emotions?","a":"Yes. Bing Chat was more accurate than human responders at detecting four of six basic emotions, with no difference for anger or surprise."},{"q":"Who did not mind the label?","a":"Recipients with very positive attitudes toward the AI showed no negative label effect."},{"q":"What about colleagues who use AI?","a":"How colleagues judge people who use AI is a separate decision in the lab (Reif et al. 2025)."}],"theme":"ai-trust","permuted":true},{"id":"axf01","track":"AI × Business","format":"allocate","concept":"Unethical delegation","title":"How should staff instruct the machine?","scene":"Online participants privately rolled a die ten times and earned more for reporting higher numbers. They delegated the reports to a machine through one of three interfaces. About 95% reported honestly when they reported themselves.","question":"Which interface kept people most honest? Spread 100 points by how likely each is.","options":["Machine set on a dial from accuracy to profit","Machine follows if-then rules you write","Machine trained on example data you pick"],"allocate":{"total":100,"step":1,"label":"Points placed","prefix":"","suffix":"","values":[15,75,50],"valueLabels":["~15% honest","~75% honest","~50% honest"],"valueName":"share of participants who reported honestly (studies 1 and 2)"},"answerTitle":"Vaguer machine instructions meant more cheating","explain":"About 95% reported honestly without delegation. Honesty fell to about 75% with explicit rules, 50% with training data and 15% with a high-level profit goal.","implication":"For incentive-sensitive tasks, make AI agent interfaces require explicit rules, and log the goals staff set.","boundary":"Die-roll task paying 1 to 6 cents per report, with online participants in two preregistered studies.","sources":["kobis25"],"study":{"design":"Preregistered online experiments (studies 1 and 2)","n":"1,398 participants (597 and 801)"},"follow":[{"q":"Did letting people choose change things?","a":"No. In study 2 delegation was optional, about 50% delegated whatever the interface, and the honesty pattern held."},{"q":"Do AI agents carry out cheating requests?","a":"More often than people. Human agents complied with about 25% to 40% of full-cheating instructions; GPT-4, GPT-4o, Claude 3.5 Sonnet and Llama 3.3 complied with about 60% to 95%."},{"q":"Can guardrails stop it?","a":"Partly. The most effective guardrail was a strongly phrased, task-specific prohibition added at the user level, which the authors note is also the least scalable."}],"theme":"honesty","permuted":true},{"id":"axf02","track":"Business","format":"forecast","concept":"Reminder messaging","title":"Twenty-two flu-shot texts","scene":"Researchers randomly assigned 689,693 Walmart pharmacy patients to one of 22 flu-shot text reminders or to no message. The outcome was a flu shot at Walmart through December 2020.","question":"Did the scientists see it coming?","answerTitle":"Scientists’ predictions missed: r = 0.03","explain":"All 22 texts raised vaccination over the 29.4% control rate, by 2.0 points on average. Scientists’ predictions did not track the results (r = 0.03) and placed the top text 15th of 22.","implication":"Test reminder copy in large randomized batches before scaling; frame the product as already reserved and send a second reminder.","boundary":"Flu shots at Walmart pharmacies in fall 2020, measured in pharmacy records over about three months.","sources":["milkman22"],"study":{"design":"Megastudy field experiment","n":"689,693 Walma
