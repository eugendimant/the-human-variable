:root{
  --paper:#eceff3;--surface:#ffffff;--sunk:#e2e7ed;--ink:#14203a;--ink-2:#36425e;--muted:#56617a;--rule:#cbd3dd;--rule-strong:#9aa6b6;
  --you:#2f54eb;--you-soft:#dfe6ff;--you-ink:#1f3cc2;
  --ev:#e0a01c;--ev-soft:#fbefd2;--ev-ink:#7d5200;
  --good:#1d7a52;--bad:#b4362a;
  --sans:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --r-panel:14px;--r-ctl:10px;--gut:clamp(16px,4vw,56px);--max:1280px;
  --t1:clamp(40px,6.2vw,88px);--t2:clamp(30px,3.6vw,48px);--t3:clamp(22px,2.2vw,30px);--t4:19px;--t5:16px;--t6:14px;--t7:12.5px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body.in-play{scroll-padding-bottom:128px}
html:has(body.in-play){scroll-padding-bottom:128px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t5)/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--you-ink);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--you);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:12px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:var(--max);margin:auto;padding:0 var(--gut);height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand-glyph{width:26px;height:26px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{padding:8px 12px;border-radius:999px;font-weight:600;font-size:var(--t6);color:var(--ink-2)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.menu-btn{display:none;margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule)}

/* Shared */
.wrap{max-width:var(--max);margin:auto;padding:0 var(--gut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:var(--t6);letter-spacing:.005em;transition:background .15s,transform .15s}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover:not(:disabled){background:#22325a}
.btn-you{background:var(--you);color:#fff}
.btn-you:hover:not(:disabled){background:var(--you-ink)}
.btn-line{border:1.5px solid var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-quiet{min-height:40px;padding:0 14px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface)}
.btn-quiet:hover{border-color:var(--rule-strong)}
.link-btn{color:var(--you-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.kicker{font-size:var(--t6);font-weight:600;color:var(--muted)}
.serif{font-family:var(--serif)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-panel)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--sunk);font-size:var(--t7);font-weight:650;color:var(--ink-2)}
.tag-ev{background:var(--ev-soft);color:var(--ev-ink)}
.tag-you{background:var(--you-soft);color:var(--you-ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot-you{background:var(--you)}.dot-ev{background:var(--ev)}

/* Home */
.hero{padding-top:clamp(36px,6vw,84px);padding-bottom:clamp(40px,6vw,72px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.hero h1{font-size:var(--t1);line-height:.96;letter-spacing:-.045em;font-weight:800;margin:0 0 22px;max-width:11ch}
.hero-lede{font-family:var(--serif);font-size:clamp(19px,1.7vw,23px);line-height:1.45;color:var(--ink-2);max-width:34em;margin:0 0 30px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{margin-top:26px;font-size:var(--t7);color:var(--muted)}
.try{padding:clamp(20px,2.4vw,30px)}
.try h2{font-size:var(--t4);line-height:1.3;margin:6px 0 4px;letter-spacing:-.01em}
.try p{margin:0;color:var(--muted);font-size:var(--t6)}
.try-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.try-read{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px}.try-read b{font-size:48px;letter-spacing:-.04em;line-height:1;color:var(--you-ink);font-variant-numeric:tabular-nums}.try-read b.empty{color:var(--rule-strong)}
.try-result{font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--ink);margin-top:14px;min-height:52px}

.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact{padding:22px 16px 22px 0}
.fact+.fact{padding-left:24px;border-left:1px solid var(--rule)}
.fact b{display:block;font-size:var(--t2);letter-spacing:-.04em;line-height:1;font-weight:750}
.fact span{font-size:var(--t6);color:var(--muted)}

.section{padding-top:clamp(48px,7vw,96px);padding-bottom:clamp(48px,7vw,96px)}
.section-head{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;margin-bottom:32px}
.section-head h2{font-size:var(--t2);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:780}
.section-head p{margin:0;color:var(--ink-2);font-family:var(--serif);font-size:19px;max-width:32em}

.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pick{text-align:left;padding:18px;min-height:132px;border-radius:var(--r-panel);border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:border-color .15s}
.pick:hover{border-color:var(--rule-strong)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick strong{font-size:19px;letter-spacing:-.02em;line-height:1.15}
.pick small{color:var(--muted);font-size:var(--t7)}
.lengths{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 22px;align-items:center}
.lengths .label{margin-right:8px}
.seg{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:var(--t6)}
.seg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.formats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-panel);overflow:hidden}
.format{background:var(--surface);padding:22px}
.format h3{font-size:17px;margin:12px 0 6px;letter-spacing:-.01em}
.format p{margin:0;color:var(--muted);font-size:var(--t6);line-height:1.5}
.format svg{display:block;height:34px;width:auto}

.dimant{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,5vw,72px);align-items:start}
.dimant h2{font-size:var(--t2);letter-spacing:-.035em;line-height:1.02;margin:0 0 14px}
.dimant p{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin:0 0 14px}
.paper-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.paper-list li{border-bottom:1px solid var(--rule)}
.paper-list button{width:100%;text-align:left;padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline}
.paper-list strong{font-weight:650;letter-spacing:-.01em}
.paper-list small{color:var(--muted);font-size:var(--t7);white-space:nowrap}

/* Play */
.play{padding-top:28px;padding-bottom:64px}
.play-top{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.steps{display:flex;gap:4px;flex:1;min-width:160px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.steps i.done{background:var(--ink)}
.steps i.now{background:var(--you)}
.play-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:clamp(20px,3vw,40px);align-items:start}
.card{padding:clamp(22px,3vw,40px)}
.case-strip{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.scene{font-family:var(--serif);font-size:clamp(19px,1.6vw,22px);line-height:1.5;color:var(--ink-2);margin:14px 0 22px;max-width:40em}
.q{font-size:var(--t3);line-height:1.15;letter-spacing:-.025em;margin:0 0 22px;font-weight:760;max-width:26ch}
.hint{font-size:var(--t6);color:var(--muted);margin:-10px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r-ctl);border:1.5px solid var(--rule);background:var(--surface);min-height:58px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--rule-strong)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--you);background:var(--you-soft)}
.opt[aria-pressed="true"] .k{background:var(--you);color:#fff}
.opt.is-ev{border-color:var(--ev);background:var(--ev-soft)}
.opt.is-ev .k{background:var(--ev);color:var(--ink)}
.opt .mark{font-size:var(--t7);font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.opt:disabled{cursor:default;opacity:1}

/* Instruments */
.meter{padding:6px 0 4px}
.meter-read{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.meter-read b{font-size:clamp(36px,4vw,54px);letter-spacing:-.04em;line-height:1;color:var(--you-ink);font-variant-numeric:tabular-nums}
.meter-read b.empty{color:var(--rule-strong)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--you) var(--fill,50%),var(--rule) var(--fill,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--you)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--you);margin-top:-10px;box-shadow:0 1px 4px rgba(20,32,58,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--you)}
input[type=range].untouched::-webkit-slider-thumb{border-color:var(--rule-strong)}
input[type=range].untouched::-webkit-slider-runnable-track{background:var(--rule)}
.axis{display:flex;justify-content:space-between;font-size:var(--t7);color:var(--muted)}
.claim{font-family:var(--serif);font-size:20px;line-height:1.45;padding:16px 18px;border-left:3px solid var(--ink);background:var(--sunk);border-radius:0 var(--r-ctl) var(--r-ctl) 0;margin:0 0 20px}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank-item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 10px 10px 14px;border:1.5px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface)}
.rank-item .pos{font-weight:800;color:var(--you-ink);font-variant-numeric:tabular-nums}
.rank-move{display:flex;gap:4px}
.rank-move button{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);font-size:18px;line-height:1}
.rank-move button:hover:not(:disabled){border-color:var(--rule-strong);background:var(--sunk)}
.alloc{display:grid;gap:14px}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 56px;gap:14px;align-items:center}
.alloc-row label{font-weight:600;font-size:15px;line-height:1.3}
.alloc-row output{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.alloc-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:var(--r-ctl);background:var(--sunk);font-weight:650;font-size:var(--t6)}
.alloc-total.ok{background:var(--you-soft);color:var(--you-ink)}
.deleg{display:grid;gap:10px}
.deleg-row{border:1.5px solid var(--rule);border-radius:var(--r-ctl);padding:14px;background:var(--surface)}
.deleg-row p{margin:0 0 10px;font-weight:600;line-height:1.35}
.deleg-opts{display:flex;flex-wrap:wrap;gap:6px}
.deleg-opts button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--rule);font-size:13.5px;font-weight:600}
.deleg-opts button[aria-pressed="true"]{background:var(--you);border-color:var(--you);color:#fff}
.deleg-opts button.is-ev{box-shadow:0 0 0 2px var(--ev)}
.deleg-why{margin:10px 0 0;font-size:var(--t6);color:var(--ink-2);font-family:var(--serif);font-size:16px}
.dag{width:100%;height:auto;display:block;margin:0 0 18px;background:var(--sunk);border-radius:var(--r-ctl)}

/* Side panel */
.side{position:sticky;top:84px;display:grid;gap:14px}
.bet{padding:22px}
.bet h2{font-size:var(--t5);margin:0 0 2px}
.bet p{margin:0 0 12px;color:var(--muted);font-size:var(--t6)}
.bet .btn{width:100%;margin-top:14px}
.bet-note{font-size:var(--t7);color:var(--muted);margin-top:10px;text-align:center}
.stakes{padding:20px}
.stakes dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:var(--t6)}
.stakes dt{color:var(--muted)}
.stakes dd{margin:0;font-weight:600}

/* Reveal */
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.verdict-score{font-size:var(--t6);font-weight:700}
.reveal-title{font-size:var(--t2);line-height:1.02;letter-spacing:-.035em;margin:4px 0 16px;font-weight:800;max-width:18ch}
.reveal-body{font-family:var(--serif);font-size:clamp(19px,1.5vw,21px);line-height:1.55;color:var(--ink);margin:0 0 22px;max-width:38em}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
.lesson{padding:16px 18px;border-radius:var(--r-ctl);background:var(--sunk)}
.lesson h3{font-size:var(--t6);margin:0 0 6px}
.lesson p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2)}
.follow{border-top:1px solid var(--rule)}
.follow details{border-bottom:1px solid var(--rule)}
.follow summary{cursor:pointer;padding:14px 0;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:12px}
.follow summary::-webkit-details-marker{display:none}
.follow summary::after{content:'+';font-weight:400;font-size:20px;line-height:1;color:var(--muted)}
.follow details[open] summary::after{content:'–'}
.follow details p{margin:0 0 16px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink-2)}
.next-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.note-box textarea{width:100%;min-height:84px;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:12px;resize:vertical;background:var(--surface);font-family:var(--serif);font-size:17px}

.gap{padding:22px}
.gap h2{font-size:var(--t5);margin:0 0 4px}
.gap-legend{display:flex;gap:16px;font-size:var(--t7);color:var(--ink-2);margin:6px 0 4px;flex-wrap:wrap}
.gap-legend span{display:inline-flex;gap:6px;align-items:center}
.gap svg{width:100%;height:auto;display:block;overflow:visible}
.gap-caption{font-size:var(--t7);color:var(--muted);margin:8px 0 0;line-height:1.5}
.ev-mark{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .4s}
.source-card{padding:20px}
.source-card h3{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.35;margin:8px 0 6px}
.source-card p{margin:0;font-size:var(--t6);color:var(--ink-2)}
.source-card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.status{display:inline-flex;gap:6px;align-items:center;font-size:var(--t7);font-weight:650}
.status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.abstract::before{background:var(--ev)}
.tutor{padding:20px}
.tutor h2{font-size:var(--t5);margin:0 0 4px}
.tutor p.small{font-size:var(--t7);color:var(--muted);margin:8px 0 0}
.tutor-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tutor-chips button{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--rule);text-align:left}
.tutor-line{display:flex;gap:8px;margin-top:6px}
.tutor-line input{flex:1;min-width:0;height:44px;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface)}
.tutor-answer{margin-top:12px;padding:14px;border-radius:var(--r-ctl);background:var(--sunk);font-family:var(--serif);font-size:16.5px;line-height:1.55;white-space:pre-wrap}
.tutor-answer cite{font-style:normal;font-family:var(--sans);font-size:var(--t7);font-weight:650;color:var(--ev-ink)}

/* Atlas */
.atlas-head{padding-top:clamp(36px,5vw,64px);padding-bottom:24px}
.atlas-head h1{font-size:var(--t2);letter-spacing:-.04em;line-height:1;margin:0 0 12px}
.atlas-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;height:48px;border:1px solid var(--rule);border-radius:999px;padding:0 16px;background:var(--surface)}
.search input{flex:1;border:0;background:transparent;height:100%;outline:none;min-width:0}
.search:focus-within{outline:3px solid var(--you);outline-offset:2px}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding-bottom:64px}
.entry{text-align:left;padding:18px;border-radius:var(--r-panel);border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;gap:10px;min-height:190px}
.entry:hover{border-color:var(--rule-strong)}
.entry .entry-title{display:block;margin:0;font-weight:750;font-size:18px;line-height:1.2;letter-spacing:-.015em}
.entry p{margin:0;color:var(--ink-2);font-size:var(--t6);line-height:1.45;flex:1}
.entry .meta{display:flex;gap:6px;flex-wrap:wrap}
.entry .cite{font-size:var(--t7);color:var(--muted)}

/* Record */
.rec-head{padding-top:clamp(36px,5vw,64px);padding-bottom:8px}
.rec-head h1{font-size:var(--t2);letter-spacing:-.04em;line-height:1;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}
.kpi{padding:18px}
.kpi b{display:block;font-size:var(--t2);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:var(--t6);color:var(--muted)}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.rec-col{display:grid;gap:12px;align-content:start}
.rec-grid{align-items:start}
@media (max-width:820px){.rec-grid>.rec-panel:first-child{grid-row:auto}}
.rec-panel{padding:22px}
.rec-panel h2{font-size:var(--t4);margin:0 0 4px}
.rec-panel>p{margin:0 0 12px;color:var(--muted);font-size:var(--t6)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:var(--t6)}
.hist small{color:var(--muted)}
.bar-score{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--rule);position:relative;vertical-align:middle;margin-left:8px}
.bar-score i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 64px}

/* Modal, toast */
.modal-back{position:fixed;inset:0;background:rgba(14,22,40,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:min(86vh,800px);overflow:auto;padding:clamp(22px,4vw,36px);position:relative}
.modal h2{font-size:var(--t3);letter-spacing:-.025em;line-height:1.12;margin:6px 40px 12px 0}
.modal p,.modal li{font-family:var(--serif);font-size:17.5px;line-height:1.55;color:var(--ink-2)}
.modal .close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);font-size:20px}
.modal table{border-collapse:collapse;width:100%;font-size:var(--t6)}
.modal td,.modal th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:var(--t6);font-weight:600;transition:.25s;z-index:70;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}

.foot{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:var(--t6);color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot nav{display:flex;gap:16px;flex-wrap:wrap}
.foot button{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.empty-state{padding:40px;text-align:center;color:var(--muted)}

/* Responsive */
@media (max-width:1080px){
  .picker{grid-template-columns:repeat(3,1fr)}
  .formats{grid-template-columns:repeat(2,1fr)}
  .play-grid{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:820px){
  .hero-grid,.section-head,.dimant,.rec-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--rule)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .lessons{grid-template-columns:1fr}
  .nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--rule);flex-direction:column;padding:10px var(--gut) 16px}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:12px}
  .menu-btn{display:grid;place-items:center}
}
@media (max-width:560px){
  .paper-list button{grid-template-columns:1fr;gap:4px}
  .picker{grid-template-columns:1fr 1fr}
  .pick{min-height:104px}
  .formats{grid-template-columns:1fr}
  .alloc-row{grid-template-columns:1fr 64px;grid-template-areas:"l o" "s s"}
  .alloc-row label{grid-area:l}.alloc-row output{grid-area:o}.alloc-row input{grid-area:s}
  .opt{grid-template-columns:30px 1fr;}
  .opt .mark{grid-column:2}
  .hero h1{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{.bar,.foot,.side .tutor,.next-row{display:none}body{background:#fff}}

.room-wait{max-width:760px;margin:0 auto}
.room-wait .q{max-width:none}

/* Paths, summary, playbook */
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:980px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}.paths .path:last-child:nth-child(even){grid-column:span 2}}
@media (max-width:560px){.paths{grid-template-columns:1fr}.paths .path:last-child:nth-child(even){grid-column:auto}}
.path{text-align:left;padding:20px;border-radius:var(--r-panel);background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:8px;min-height:170px;transition:transform .15s}
.path:hover{transform:translateY(-2px)}
.path strong{font-size:20px;letter-spacing:-.02em;line-height:1.15}
.path span{font-family:var(--serif);font-size:16px;line-height:1.45;color:rgba(255,255,255,.9);flex:1}
.path small{color:rgba(255,255,255,.86);font-size:var(--t7)}
/* colour encodes the path's emphasis: blue for AI-first paths, ink for behavior and business */
.path[data-kind=ai]{background:#1f3cc2}.path[data-kind=ai]:first-child{background:var(--ink)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 26px}
.lesson-card{padding:18px}
.lesson-card h3,.lesson-card .card-h{margin:6px 0;font-size:18px;letter-spacing:-.015em}
.lesson-card p{margin:0 0 8px;font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.theme-index{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.theme-index a{padding:8px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;font-size:var(--t6)}
.theme{padding:clamp(20px,3vw,32px);margin-bottom:14px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:24px;row-gap:14px;align-items:start}

.hbars{display:grid;gap:14px;margin:6px 0 4px}

.deleg-cmp li.ok>span:first-child::before{content:"✓";color:var(--good);font-weight:800;margin-right:8px}
.gap:has(.deleg-cmp) .gap-legend{display:flex}
.score-row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}.spark{width:220px;height:56px;margin-bottom:14px}
/* causal diagrams sit on a faint lab grid, so the factors read as a board waiting for its links */
.dag{background-color:#f4f6f9;background-image:radial-gradient(circle,rgba(20,32,58,.16) 1px,transparent 1.4px);background-size:18px 18px;border:1px solid var(--rule)}
.plate-more{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.plate-more .small{font-size:var(--t7);color:var(--muted);margin:8px 0 0}
/* library: each principle shows how much of it the player has opened */
.theme-head p.locked{font-size:17px;color:var(--muted);font-style:italic}
.theme-meter{display:block;height:6px;border-radius:3px;background:var(--sunk);margin:14px 0 6px;overflow:hidden;max-width:320px}
.theme-meter i{display:block;height:100%;background:var(--ev);border-radius:3px}
.theme-count{display:block;font-family:var(--sans);font-style:normal;font-size:var(--t7);color:var(--muted)}
.theme{padding:clamp(18px,2.4vw,26px)}
.gap .hb-row:nth-child(2) .grow{animation-delay:.12s}.gap .hb-row:nth-child(3) .grow{animation-delay:.24s}.gap .hb-row:nth-child(4) .grow{animation-delay:.36s}
/* verdict: the first thing read after the call, set as a statement rather than a pill */
.verdict .tag{font-size:15px;font-weight:800;padding:6px 14px;border-radius:999px;background:var(--ink);color:#fff;letter-spacing:-.005em}
.verdict .tag.tag-ev{background:var(--ev);color:var(--ink)}
.verdict .num{font-size:15px;font-weight:750}
.hb-track i.ev.ns{background:repeating-linear-gradient(135deg,var(--ev-soft) 0 6px,#efd59a 6px 12px)}   /* not significant: drawn, but not as a result */
.axis-svg .ax-track{stroke:#cbd3dd}.axis-svg .ax-band{fill:#fbefd2;stroke:#e0a01c}.axis-svg .ax-gap{stroke:#14203a}
.axis-svg .ax-you{fill:#1f3cc2}.axis-svg .ax-ev{fill:#7d5200}.axis-svg .ax-tick{fill:#56617a}

/* ===== the evidence plate: the reveal's signature, a dark panel carrying the paper's numbers ===== */
.gap.has-plate{padding:0;overflow:hidden;background:var(--surface)}
.plate{background:#14203a;color:#fff;padding:24px 24px 18px;--sunk:rgba(255,255,255,.12)}
.gap.has-plate>.opts-recap{padding:18px 22px 22px}
.plate .plate-h{color:#f0b43c}.plate .plate-h::before{background:#f0b43c}
.plate .gap-legend{color:#c9d2e6}
.plate .gap-caption,.plate .small,.plate .plate-more .small{color:#b9c4dd}
.plate .hb-label{color:#fff}
.plate .hb-track{background:rgba(255,255,255,.12)}
.plate .hb-track i{background:rgba(255,255,255,.45)}
.plate .hb-track i.ev{background:#f0b43c}.plate .hb-track i.you{background:#8ea4ff}
.plate .hb-track i.ev.ns{background:repeating-linear-gradient(135deg,rgba(240,180,60,.35) 0 6px,rgba(240,180,60,.15) 6px 12px)}
.plate .hb-row>b{color:#fff}.plate .hb-row.two>b.you{color:#b8c6ff}.plate .hb-row.two>b.ev{color:#f0b43c}
.plate .gap-head{border-bottom-color:rgba(255,255,255,.16)}
.plate .gh-cell span{color:#c9d2e6}.plate .gh-you{color:#a9b9ff}.plate .gh-ev{color:#f0b43c}.plate .gh-gap{color:#fff}
.plate .gap-claim{color:#e8ecf5}
.plate .axis-svg .ax-track{stroke:rgba(255,255,255,.2)}.plate .axis-svg .ax-band{fill:rgba(240,180,60,.22);stroke:#f0b43c}.plate .axis-svg .ax-gap{stroke:#fff}
.plate .axis-svg .ax-you{fill:#a9b9ff}.plate .axis-svg .ax-ev{fill:#f0b43c}.plate .axis-svg .ax-tick{fill:#b9c4dd}
.plate .plate-more{border-top-color:rgba(255,255,255,.16)}
.plate .dag{background-color:#1b2a4b;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.4px);border-color:rgba(255,255,255,.12)}
.plate .tag-ev{background:#f0b43c;color:#14203a}
.plate .rank-cmp li,.plate .deleg-cmp li{background:rgba(255,255,255,.07);color:#fff}
.plate .rank-cmp small,.plate .alloc-val{color:#f0b43c}
.plate .big-stat{color:#fff}
.plate .chip.you{background:#2f54eb;color:#fff}.plate .chip.ev{background:#f0b43c;color:#14203a}
.plate .gap-legend .tag{background:#f0b43c;color:#14203a}
.study-card{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:0;padding:18px 22px 20px;border-top:1px solid var(--rule)}
.study-card dt{font-size:var(--t7);color:var(--muted);font-weight:650;margin-bottom:2px}.study-card dd{margin:0;font-size:var(--t6);line-height:1.4;color:var(--ink)}
.gap:not(.has-plate) .study-card{padding:16px 0 0;margin-top:16px}
@media (max-width:520px){.study-card{grid-template-columns:1fr}}
.reveal{position:relative}
.rev-art{--art-line:#b9c3d0;--art-you:var(--you);--art-ev:var(--ev);position:absolute;top:-6px;width:150px;height:94px;opacity:.9;pointer-events:none}
@media (min-width:1200px){.rev-art{left:calc(50% - 190px)}}
@media (max-width:1199px){.rev-art{right:0}}
@media (max-width:640px){.rev-art{width:96px;height:60px;top:-2px}}
/* Instructor console additions */
.field{height:46px;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface)}
.join-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 24px}
.join-text{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.join-url{font-size:clamp(20px,2.4vw,32px);letter-spacing:-.02em}
.join-code{font-size:clamp(40px,6vw,76px);letter-spacing:.12em;line-height:1;color:var(--you-ink);font-variant-numeric:tabular-nums}
.qr{width:132px;height:132px;flex:none}
.pick-list{max-height:52vh;overflow:auto;padding-right:6px}
.pick-list li{align-items:center}
.present-opts{font-size:19px;line-height:1.45;padding-left:22px;margin:0 0 18px}
.present-opts li{margin:4px 0}
.count-row{display:flex;align-items:center;gap:12px;margin:18px 0 4px;flex-wrap:wrap}
.count-row b{font-size:46px;letter-spacing:-.04em;line-height:1}
.meter-bar{flex:1 1 160px;height:8px;border-radius:4px;background:var(--rule);position:relative;overflow:hidden}
.meter-bar i{position:absolute;inset:0 auto 0 0;background:var(--you);transition:width .4s}
.rv{margin-top:24px;border-top:1px solid var(--rule);padding-top:20px}
.rv-head{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:18px}
.rv-head div{display:grid}
.rv-head b{font-size:38px;letter-spacing:-.03em;line-height:1.05}
.rv-bars{display:grid;gap:10px}
.rv-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 4.6em;gap:12px;align-items:center;font-size:15px}
.rv-track{height:14px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden}
.rv-track i{position:absolute;inset:0 auto 0 0;background:var(--you);border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rv-track i.ev{background:var(--ev)}
@media (max-width:700px){.join-banner{flex-direction:column;align-items:flex-start}.rv-row{grid-template-columns:1fr 4.6em}.rv-track{grid-column:1/-1;grid-row:2}}
.console-h{font-size:var(--t2);letter-spacing:-.035em;line-height:1.02;margin:0}

/* projector view: the stage fills the screen, controls stay one click away */
.proj-exit{display:none}
body.projector .side,body.projector header.bar{display:none}
body.projector .play-grid{grid-template-columns:1fr!important}
body.projector .wrap{max-width:1500px}
body.projector .play-grid>.card{font-size:clamp(18px,1.6vw,26px)}
body.projector .stage-h{font-size:clamp(32px,3.4vw,56px)}
body.projector .play-grid>.card .scene{font-size:clamp(18px,1.5vw,24px)}
body.projector .rv-row,body.projector .present-opts li,body.projector .rv-row b{font-size:clamp(18px,1.6vw,26px)}
body.projector .proj-exit{display:inline-flex}.join-end{display:flex;align-items:center;gap:16px}body.projector .proj-exit:hover,body.projector .proj-exit:focus{opacity:1}
body.projector .play-grid>.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:48px;align-items:start}
body.projector .play-grid>.card>*{grid-column:1}
body.projector .play-grid>.card>.rv{grid-column:2;grid-row:1/span 30}

.rv-row b{white-space:nowrap}

/* rank reveal: the study's order as large numbered badges, the room's average beside each */
.rank-proj{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:10px}
.rank-proj li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--rule,#cbd3dd);border-radius:14px;background:#fff}
.rp-badge{width:40px;height:40px;border-radius:50%;background:#e0a01c;color:#14203a;font-weight:800;display:grid;place-items:center;font-size:20px}
.rp-name{font-weight:650}.rp-room{color:#56617a;font-size:.9em;white-space:nowrap}.rp-room b{color:#1f3cc2;font-size:1.15em}
body.projector .rp-badge{width:56px;height:56px;font-size:28px}

/* projector, before the reveal: the room's answer count fills the right half */
body.projector .play-grid>.card:not(:has(.rv)) .count-row{grid-column:2;grid-row:1/span 30;align-self:center;display:grid;justify-items:center;text-align:center;gap:12px;padding:40px;border:1px solid #cbd3dd;border-radius:24px;background:#f4f6f9}
body.projector .play-grid>.card:not(:has(.rv)) .count-row b{font-size:clamp(96px,10vw,168px);line-height:.9;letter-spacing:-.04em;color:#1f3cc2}
body.projector .play-grid>.card:not(:has(.rv)) .count-row span{font-size:clamp(18px,1.6vw,26px)}
body.projector .play-grid>.card:not(:has(.rv)) .count-row .meter-bar{width:70%}
.rv-head>div>span{white-space:nowrap}
</style></head>

social-norms effect on towel reuse was weaker than earlier estimates but consistent, producing modest increases in reuse.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"abstract (Crossref or publisher)"}},"riedl21":{"id":"riedl21","authors":"Riedl et al.","year":2021,"title":"Quantifying collective intelligence in human groups","venue":"Proceedings of the National Academy of Sciences","volume":"118(21)","pages":"e2005737118","doi":"10.1073/pnas.2005737118","url":"https://doi.org/10.1073/pnas.2005737118","kind":"peer-reviewed","takeaway":"A meta-analysis of 22 studies found strong support for a general collective intelligence factor, with the share of women predicting performance through social perceptiveness.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"abstract (Crossref or publisher)"}},"kobis25":{"id":"kobis25","authors":"Köbis et al.","authors_full":"Nils Köbis, Zoe Rahwan, Raluca Rilla, Bramantyo Ibrahim Supriyatno, Clara Bersch, Tamer Ajaj, Jean-François Bonnefon, Iyad Rahwan","year":2025,"title":"Delegation to artificial intelligence can increase dishonest behaviour","venue":"Nature","volume":"646(8083)","pages":"126-134","doi":"10.1038/s41586-025-09505-x","url":"https://doi.org/10.1038/s41586-025-09505-x","kind":"peer-reviewed","takeaway":"People cheated more when they could delegate to machines through vague interfaces, and LLM agents complied with full-cheating instructions far more often than human agents.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"full text (PMC12488497, CC BY)","text_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12488497/"},"flags":["No retraction or expression of concern found (Crossref update-to empty; OpenAlex is_retracted false). Crossref lists an OSF preprint; numbers here come from the Nature version only."]},"milkman22":{"id":"milkman22","authors":"Milkman et al.","authors_full":"Katherine L. Milkman, Linnea Gandhi, Mitesh S. Patel, Heather N. Graci, Dena M. Gromet, Hung Ho, Joseph S. Kay, Timothy W. Lee, Jake Rothschild, Jonathan E. Bogard, et al. (Angela L. Duckworth senior author)","year":2022,"title":"A 680,000-person megastudy of nudges to encourage vaccination in pharmacies","venue":"Proceedings of the National Academy of Sciences","volume":"119(6)","pages":"e2115126119","doi":"10.1073/pnas.2115126119","url":"https://doi.org/10.1073/pnas.2115126119","kind":"peer-reviewed","takeaway":"All 22 text reminders raised flu vaccination at Walmart pharmacies, by 2.0 percentage points on average; the best said a shot was 'waiting for you' and neither scientists nor lay forecasters picked it.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"full text incl. Table 1 (PMC8833156)","text_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8833156/"},"flags":["No retraction or expression of concern found. Pairwise differences between individual messages are not each tested; the paper rejects equality of all 22 effects (chi2 = 92.486, P < 0.001)."]},"garvey23":{"id":"garvey23","authors":"Garvey, Kim & Duhachek","authors_full":"Aaron M. Garvey, TaeWoo Kim, Adam Duhachek","year":2023,"title":"Bad News? Send an AI. Good News? Send a Human","venue":"Journal of Marketing","volume":"87(1)","pages":"10-25","doi":"10.1177/00222429211066972","url":"https://doi.org/10.1177/00222429211066972","kind":"peer-reviewed","takeaway":"Consumers respond better to worse-than-expected offers from an AI agent and to better-than-expected offers from a human, because AI agents are seen as having weaker intentions.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"abstract (OpenAlex/publisher)","text_url":"https://doi.org/10.1177/00222429211066972"},"flags":["Full text not read (paywalled; repository copy unreachable). Item is qualitative and uses no study numbers. Online first 2022-02-18; issue 2023.","No retraction, correction or failed replication found in a web search."]},"jabbour23":{"id":"jabbour23","authors":"Jabbour et al.","authors_full":"Sarah Jabbour, David Fouhey, Stephanie Shepard, Thomas S. Valley, Ella A. Kazerooni, Nikola Banovic, Jenna Wiens, Michael W. Sjoding","year":2023,"title":"Measuring the Impact of AI in the Diagnosis of Hospitalized Patients","venue":"JAMA","volume":"330(23)","pages":"2275-2284","doi":"10.1001/jama.2023.22295","url":"https://doi.org/10.1001/jama.2023.22295","kind":"peer-reviewed","takeaway":"Standard AI raised clinician diagnostic accuracy a little; a systematically biased model cut it by 11.3 points, and image-based explanations did not significantly mitigate the harm.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"JAMA article, publisher full text (excerpts)","text_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10731487/"},"flags":["Full-text quotes (81.1% consult, age-80 pneumonia bias) were read via a fetch of jamanetwork.com that returns excerpts; recheck against the PDF before release. No retraction found."]},"goh24":{"id":"goh24","authors":"Goh et al.","authors_full":"Ethan Goh, Robert Gallo, Jason Hom, Eric Strong, Yingjie Weng, Hannah Kerman, Joséphine A. Cool, Zahir Kanjee, Andrew S. Parsons, Neera Ahuja, Eric Horvitz, Daniel Yang, Arnold Milstein, Andrew P. J. Olson, Adam Rodman, Jonathan H. Chen","year":2024,"title":"Large Language Model Influence on Diagnostic Reasoning","venue":"JAMA Network Open","volume":"7(10)","pages":"e2440969","doi":"10.1001/jamanetworkopen.2024.40969","url":"https://doi.org/10.1001/jamanetworkopen.2024.40969","kind":"peer-reviewed","takeaway":"Giving physicians GPT-4 did not significantly improve diagnostic reasoning (76% vs 74%), while GPT-4 alone scored 16 points higher than physicians with usual resources.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"full text (PMC11519755)","text_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11519755/"},"flags":["The GPT-4-alone comparison is a secondary exploratory analysis. No retraction found."]},"cribb20":{"id":"cribb20","authors":"Cribb & Emmerson","authors_full":"Jonathan Cribb, Carl Emmerson","year":2020,"title":"What happens to workplace pension saving when employers are obliged to enrol employees automatically?","venue":"International Tax and Public Finance","volume":"27(3)","pages":"664-693","doi":"10.1007/s10797-019-09565-6","url":"https://doi.org/10.1007/s10797-019-09565-6","kind":"peer-reviewed","takeaway":"Reports Madrian and Shea’s cohort comparison: 86% enrolled after 3 to 15 months under automatic enrollment against 37% without it; finds large rises in UK workplace pension saving after mandated automatic enrollment.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"full text, introduction (Springer)","text_url":"https://link.springer.com/article/10.1007/s10797-019-09565-6"}},"isoni11":{"id":"isoni11","authors":"Isoni, Loomes & Sugden","authors_full":"Andrea Isoni, Graham Loomes, Robert Sugden","year":2011,"title":"The Willingness to Pay—Willingness to Accept Gap, the “Endowment Effect,” Subject Misconceptions, and Experimental Procedures for Eliciting Valuations: Comment","venue":"American Economic Review","volume":"101(2)","pages":"991-1011","doi":"10.1257/aer.101.2.991","url":"https://doi.org/10.1257/aer.101.2.991","kind":"peer-reviewed","takeaway":"Under the Plott and Zeiler procedures, the willingness-to-pay/willingness-to-accept gap is absent for mugs but significant and persistent for lotteries.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"abstract (Crossref)"}},"huberman06":{"id":"huberman06","authors":"Huberman & Jiang","authors_full":"Gur Huberman, Wei Jiang","year":2006,"title":"Offering versus Choice in 401(k) Plans: Equity Exposure and Number of Funds","venue":"Journal of Finance","volume":"61(2)","pages":"763-801","doi":"10.1111/j.1540-6261.2006.00854.x","url":"https://doi.org/10.1111/j.1540-6261.2006.00854.x","kind":"peer-reviewed","takeaway":"In real 401(k) records, participants split contributions evenly across the few funds they use, but their equity share moves little with the share of equity funds offered.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched RePEc record of the published article","text_read":"Published abstract (IDEAS/RePEc)"}}},"challenges":[{"id":"ai01","track":"AI × Business","concept":"Productivity","tag":"01 / WORK","title":"Writing with ChatGPT","scene":"In an online experiment, 453 professionals complete short occupation-specific writing tasks; half are randomly given access to ChatGPT.","question":"How much less time did the ChatGPT group take?","answerTitle":"40% less time","explain":"Across 453 professionals, average completion time fell 40%.","implication":"Pilot AI on measurable tasks. Track quality as well as speed.","boundary":"Short, incentivized, occupation-specific writing tasks done online by 453 college-educated professionals.","sources":["noy23"],"visual":"bars","values":[100,60],"labels":["Without AI","With AI"],"unit":"relative time","follow":[{"q":"Who took part?","a":"453 college-educated professionals, each given occupation-specific, incentivized writing tasks typical of their job."},{"q":"Who gained the most?","a":"Participants with weaker writing skills benefited most, so the gap between stronger and weaker workers narrowed."},{"q":"Did people keep using it?","a":"Yes. Two weeks and two months later, people who had ChatGPT access were more likely to report using it in their real jobs."}],"format":"estimate","weight":1,"estimate":{"target":40,"min":0,"max":60,"tolerance":5,"label":"Decrease in completion time (%)"},"theme":"ai-work","study":{"design":"Preregistered online experiment","n":"453 college-educated professionals"}},{"id":"ai02","track":"AI × Business","concept":"Productivity","tag":"02 / QUALITY","title":"Faster, but worse?","scene":"In an online experiment, 453 professionals did short writing tasks for their occupation, half with ChatGPT. Independent professionals graded the finished work blind.","question":"By how much did graded quality change with ChatGPT?","answerTitle":"Quality improved 18%","explain":"Noy and Zhang gave half of 453 college-educated professionals access to ChatGPT for occupation-specific writing tasks. Graded output quality rose 18%, and inequality between workers decreased.","implication":"Set up double-outcome tests, with blind quality evaluation.","boundary":"Occupation-specific, incentivized writing tasks for 453 college-educated professionals.","sources":["noy23"],"visual":"bars","values":[100,118],"labels":["Without AI","With AI"],"unit":"quality index","follow":[{"q":"Did quality really improve?","a":"Yes. Average output quality rose 18%."},{"q":"Which tasks?","a":"Midlevel professional writing tasks matched to each participant’s occupation."},{"q":"Who took part?","a":"453 college-educated professionals in a preregistered online experiment, randomly given access to ChatGPT or not."}],"format":"estimate","weight":1,"estimate":{"target":18,"min":0,"max":100,"tolerance":4,"label":"Increase in quality (%)"},"theme":"ai-work","study":{"design":"Preregistered online experiment","n":"453 college-educated professionals"}},{"id":"ai07","track":"AI × Business","concept":"Creativity","tag":"07 / IDEAS","title":"Stories written with AI","scene":"Writers receive ideas from a generative AI system before producing stories.","question":"Which two results did the study find?","options":["AI-assisted stories were more similar to each other","AI-assisted stories were rated more creative","AI help made stories less enjoyable to read","Gains were largest for the most creative writers"],"answerTitle":"A creativity trade-off","explain":"Doshi and Hauser's 293 writers produced stories rated 8.1% more novel and 9.0% more useful when given five AI ideas. Those stories were also more similar to each other, a shift worth 8.9% of the similarity range.","implication":"Evaluate distinctiveness across your full campaign, not only each asset.","boundary":"Online writers produced eight-sentence stories with no AI ideas, one AI idea, or up to five AI ideas.","sources":["doshi24"],"visual":"scatter","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was in the study?","a":"293 writers recruited on Prolific each wrote an eight-sentence story. A separate group of 600 participants rated the stories."},{"q":"How large was the creativity gain?","a":"With access to up to five AI ideas, rated novelty rose 8.1% and usefulness 9.0% compared with writers who had no AI help."},{"q":"Who benefited most?","a":"Writers who scored lowest on a creativity test: with up to five AI ideas, their stories' novelty rose 10.7%. The most creative writers saw little effect."}],"format":"multi","weight":1,"multiAnswers":[0,1],"theme":"ai-work","study":{"design":"Online experiment","n":"293 writers and 600 evaluators"},"permuted":true},{"id":"ai09","track":"AI × Business","concept":"Trust in AI","tag":"09 / TRUST","title":"The model that erred","scene":"A prediction model outperforms a human forecaster but makes visible errors.","question":"After seeing the model err, whom did people choose for paid forecasts?","options":["The model, more often than before the error","Themselves, though the model beat them","The model, since it beat them","Each about half of the time"],"answer":1,"answerTitle":"A visible error can dominate","explain":"In Dietvorst, Simmons and Massey's Study 1, 65% of participants who saw no forecasts bet on the model. After seeing both the model's and their own forecasts, only 23% did, although people made 15 to 29% more error than the model.","implication":"Communicate expected error rates and compare human and model performance symmetrically.","boundary":"Incentivized forecasts of MBA students' performance and US states' airline-passenger ranks, by lab and online participants.","sources":["diet15"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who took part?","a":"Participants in the Wharton Behavioral Lab (Studies 1, 2, 4) and on Mechanical Turk (Studies 3a, 3b), with final samples of 206 to 1,036 per study."},{"q":"How much better was the model?","a":"Human forecasts had 15 to 29% more error than the model when predicting MBA students' performance, and 90 to 97% more when ranking states by airline passengers."},{"q":"Was real money at stake?","a":"Yes. Lab participants could earn up to $10 extra for accurate forecasts. In Study 1 they earned $1 each time the forecast they relied on was within 5 percentiles."},{"q":"Why do other studies find people prefer algorithms?","a":"Designs differ. Here people watched the model make errors before choosing; in Logg, Minson and Moore (2019) people weighed advice labeled as an algorithm’s without seeing it fail, and leaned on it more."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Five incentivized forecasting experiments (lab and online)","n":"206 to 1,036 participants per study"},"permuted":true,"chart":{"labels":["Saw no forecast results","Saw own results only","Saw the model's results only","Saw both sets of results"],"values":[65,63,26,23],"unit":"%","highlight":3,"note":"Share who chose the model to forecast, Study 1."}},{"id":"ai10","track":"AI × Business","concept":"Trust in AI","tag":"10 / ADVICE","title":"Advice from a person or a program","scene":"People estimated a person’s weight from a photo, then saw an advice estimate and could revise. The same advice was labeled as coming from other people for some and from an algorithm for others. With human-labeled advice, they moved 30% of the way toward it.","question":"How likely is it that the study found this?","answerTitle":"45% of the way, versus 30% for human advice","explain":"Weight on advice averaged 0.45 when the advice was labeled algorithmic and 0.30 when labeled human, for identical advice.","implication":"Check whether experienced staff discount model advice; in this study, experts who relied less on the algorithm were less accurate.","boundary":"Six experiments, mostly with lay participants, on estimation and forecasting tasks; one tested experienced forecasters.","sources":["logg19"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What tasks were used?","a":"Numeric estimates about a visual stimulus, and forecasts of song popularity and romantic attraction, across six experiments."},{"q":"Did experts behave the same way?","a":"No. Experienced professionals who forecast regularly relied less on algorithmic advice than lay people did, and that hurt their accuracy."},{"q":"When did the preference fade?","a":"It weakened when people had to choose between the algorithm's estimate and their own, rather than weighing advice from an outside source."}],"format":"forecast","weight":1,"theme":"ai-trust","study":{"design":"Six experiments","n":"Lay participants, plus one study of experienced forecasters"},"chart":{"labels":["Labeled as people","Labeled as an algorithm"],"values":[30,45],"unit":"%","highlight":1,"note":"Logg, Minson & Moore (2019), Experiment 1A, weight on advice."},"forecast":{"claim":"People moved further toward identical advice when it was labeled as other people’s rather than an algorithm’s.","truth":false}},{"id":"ai11","track":"AI × Business","concept":"Trust in AI","tag":"11 / FIT","title":"Two jobs for an algorithm","scene":"In online lab and field studies, people decided whether to rely on an algorithm for tasks that seemed objective and measurable, or subjective and a matter of personal taste.","question":"For which task were people more reluctant to rely on an algorithm?","options":["Judging a personal aesthetic preference","Recommending a product for its practical use"],"answer":0,"answerTitle":"Subjectivity changes acceptance","explain":"Castelo, Bos and Lehmann ran four online lab studies with over 1,400 participants and two field studies with over 56,000. People trusted and used algorithms less for tasks that seem subjective; making a task seem more objective raised reliance.","implication":"For taste-based recommendations, explain the measurable inputs the algorithm uses, which makes the task seem more objective.","boundary":"Online lab and field studies of consumers' reliance on algorithms for tasks seen as subjective or objective.","sources":["cast19"],"visual":"matrix","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How much evidence is there?","a":"Four online lab studies with over 1,400 participants and two online field studies with over 56,000."},{"q":"Can the aversion be reduced?","a":"Yes. Making a task seem more objective increased trust in, and use of, algorithms for that task."},{"q":"What if the task stays subjective?","a":"Presenting the algorithm as having more humanlike emotional ability increased its use for subjective tasks."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Four online lab studies and two online field studies","n":"Over 1,400 lab and over 56,000 field participants"},"permuted":true},{"id":"ai12","track":"AI × Business","concept":"Trust in AI","tag":"12 / PERSONALIZATION","title":"Medical advice from AI","scene":"Consumers choose between medical care, such as diagnoses and recommendations, from an AI provider or from a human provider.","question":"What mainly drove consumers’ resistance?","options":["It feels less accountable when it errs","Its handling of health data feels unsafe","It cannot account for each patient’s uniqueness"],"answer":2,"answerTitle":"People fear AI ignores what makes them unique","explain":"Longoni, Bonezzi and Morewedge traced resistance to uniqueness neglect: consumers doubt an AI provider can account for their unique characteristics and circumstances. Resistance was stronger among people who saw themselves as more unique and disappeared when AI care was framed as personalized.","implication":"Present AI as supporting a clinician's or advisor's decision, and say how it adapts to each person's case.","boundary":"Consumers choosing between AI and human providers of medical care, in real and hypothetical choices.","sources":["long19"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the resistance look like?","a":"In real and hypothetical choices, consumers were less likely to use AI care, would pay less for it, and were less sensitive to differences in provider quality."},{"q":"What removed the resistance?","a":"It disappeared when AI care was framed as personalized, when the care was for someone else, or when AI supported a human provider's decision instead of replacing it."},{"q":"What drives the resistance?","a":"Uniqueness neglect: the worry that an AI provider cannot account for a person’s unique characteristics and circumstances as well as a human provider can."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Series of consumer choice experiments"},"permuted":true},{"id":"biz01","track":"Business","concept":"Defaults","tag":"13 / DESIGN","title":"The enrollment default","scene":"A US firm switched its 401(k) from sign-up-yourself to automatic enrollment for new hires. Among the earlier cohort, who had to opt in, 37% participated at similar tenure.","question":"What share of the automatically enrolled hires participated?","answerTitle":"86% under the default, against 37%","explain":"At 3 to 15 months of tenure, 86% of automatically enrolled hires participated, against 37% of the previous cohort who had to sign up.","implication":"Make enrollment in beneficial programs the default, with easy opt-out, and track take-up by employee group.","boundary":"New hires at one Fortune 500 health care and insurance firm, compared with the cohort hired just before the switch.","sources":["defaults01","cribb20"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What was the default?","a":"New hires were enrolled at a 3% contribution rate, invested entirely in the money market fund."},{"q":"Who gained the most?","a":"Gains were largest among groups with low participation before: Black and Hispanic employees, younger workers, and lower-paid employees. The gap between women and men nearly disappeared."},{"q":"What kind of company was it?","a":"A large, publicly traded Fortune 500 firm in health care and insurance. The plan's economic features did not change, only the default."}],"format":"estimate","weight":1,"theme":"choice","estimate":{"target":86,"min":0,"max":100,"tolerance":5,"label":"Participation under automatic enrollment","unit":"%"},"chart":{"labels":["Had to opt in","Enrolled by default"],"values":[37,86],"unit":"%","highlight":1,"note":"Madrian & Shea (2001), cohorts at 3 to 15 months of tenure, as reported by Cribb & Emmerson (2020)."},"study":{"design":"Natural experiment in one firm","n":"Employees of a large US corporation"}},{"id":"biz02","track":"Business","concept":"Defaults","tag":"14 / FRICTION","title":"The sticky default","scene":"After automatic enrollment, a large share of new hires kept both the default contribution rate and the default fund, a combination few earlier hires had chosen.","question":"Why did so many keep the default?","options":["Inertia, and the default read as advice","The employer match required the default rate","Few employees knew they could change it"],"answer":0,"answerTitle":"Defaults communicate advice","explain":"Madrian and Shea found that many employees hired under automatic enrollment kept both the default contribution rate and the default fund, a pairing few earlier hires chose. They trace this to inertia and to employees reading the default as investment advice.","implication":"Set default contribution rates at the level you would recommend, since most enrollees keep whatever rate you choose.","boundary":"Contribution rates and fund choices of new hires at one US firm, measured in their first months of tenure.","sources":["defaults01"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Did many keep the default rate?","a":"Yes. A substantial share of employees hired under automatic enrollment kept the default contribution rate, which few earlier hires had chosen."},{"q":"Did they keep the default fund too?","a":"Yes. Many also kept the default fund allocation, an outcome few employees hired before the switch picked."},{"q":"What does this mean for plan design?","a":"The default sets the saving rate as well as participation, so choose a default contribution rate you would recommend."}],"format":"choice","weight":1,"theme":"choice","study":{"design":"Natural experiment in one firm","n":"New hires and earlier cohorts at one Fortune 500 firm"},"permuted":true},{"id":"biz04","track":"Business","concept":"Replication","tag":"16 / CONTEXT","title":"Does the towel sign travel?","scene":"A famous US study found hotel guests reused more towels when a sign said most guests do, especially guests of the same room. Researchers repeated the test in two German hotels.","question":"Is this what the replication found?","answerTitle":"Both signs helped; the norm sign did no better","explain":"Bohner and Schlüter repeated the test in two German hotels. In the first (N = 724), norm signs combined reached 81.9% reuse against 83.7% for the standard environmental sign; in the second (N = 204), the environmental sign reached 93.3% versus 76.5% for the norm signs combined.","implication":"Before rolling out a famous nudge, test it against the plain message you would otherwise use, not just against doing nothing.","boundary":"Two hotels in Germany; later meta-analyses report modest, consistent effects of norm messages across studies.","sources":["bohner14","hotel08","nisa17"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the original study find?","a":"Goldstein, Cialdini and Griskevicius (2008) found that a sign saying most guests reuse towels beat a standard environmental appeal, and that a same-room norm worked best."},{"q":"So do norm messages work at all?","a":"Modestly. A 2017 meta-analysis of hotel studies described the social-norms effect as weaker than earlier estimates but consistent."},{"q":"What should a manager compare against?","a":"The message you would send anyway. Here, any sign beat no sign, which a test against silence would have mistaken for a norm effect."}],"format":"forecast","weight":1,"theme":"evidence","study":{"design":"Field replication","n":"Guests of two German hotels"},"forecast":{"claim":"In the German hotels, the “most guests reuse” sign raised reuse more than a standard environmental sign.","truth":false},"chart":{"labels":["No sign","Standard environmental sign","Norm signs (combined)"],"values":[64.3,93.3,76.5],"unit":"%","highlight":2,"note":"Towel reuse rate, second hotel."}},{"id":"biz05","track":"Business","concept":"Norms","tag":"17 / BACKFIRE","title":"Feedback for thrifty homes","scene":"A household already uses less electricity than its neighbors. It receives feedback showing the higher neighborhood average.","question":"Which two results did the study find?","options":["Above-average households raised their electricity use","Some already-efficient households raised usage","Descriptive feedback alone kept low users steady","A smiley face kept efficient homes steady"],"answerTitle":"A norm message can backfire","explain":"Schultz and colleagues gave usage feedback to 290 San Marcos households. Below-average homes shown only the neighborhood average raised daily use from 10.15 to 11.13 kWh over the longer term; adding a smiley-face approval cue held them at baseline.","implication":"When sending peer comparisons, add explicit approval for customers already doing better than average, and check in a pilot whether low users drift up.","boundary":"Two doorhanger messages to 290 California households, with electricity read from meters over about four weeks.","sources":["energy07"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was in the study?","a":"290 households in San Marcos, California, with visible electricity meters; 287 stayed in the analysis."},{"q":"How large was the boomerang?","a":"Below-average households that saw only the neighborhood average rose from 10.38 to 11.27 kWh per day in the first week, and stayed higher three weeks later."},{"q":"Did heavy users keep saving?","a":"Above-average households given only the average cut 1.22 kWh per day in the first week. Over the longer term their use was 21.29 kWh per day against a 22.32 baseline, a drop that was not statistically significant."}],"format":"multi","weight":1,"multiAnswers":[1,3],"theme":"choice","study":{"design":"Field experiment","n":"290 households in San Marcos, California"},"permuted":true,"chart":{"labels":["Average only: before","Average only: weeks later","Average + smiley: before","Average + smiley: weeks later"],"values":[10.15,11.13,10.04,10.14],"unit":"","highlight":1,"note":"Daily electricity use of below-average homes."}},{"id":"biz07","track":"Business","concept":"Innovation","tag":"19 / PROCESS","title":"Fixing a slow process","scene":"In experiments, people were asked to improve things such as a Lego structure, a mini-golf hole or a written essay, and could change them by adding or by removing elements.","question":"Which kind of fix do people tend to miss?","options":["Adding a review step","Automating an existing step","Removing an existing step"],"answer":2,"answerTitle":"Subtraction is often missed","explain":"In Adams, Converse, Hales and Klotz's experiment 4, only 21% of uncued participants listed any subtractive idea for improving a mini-golf hole. Reminded that they could add or subtract, 48% did.","implication":"Make “What can we remove?” mandatory in process reviews.","boundary":"Eight experiments with puzzles and design tasks in which removing an element was an advantageous change.","sources":["subtract21"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What tasks did people solve?","a":"Problems such as stabilizing a Lego structure, improving a miniature golf course, and transforming a grid pattern. Most people added a block to the Lego structure rather than removing one."},{"q":"How many people took part?","a":"Hundreds of participants across eight experiments, each solving a different improvement problem."},{"q":"What helped people spot subtractions?","a":"Being cued to consider subtraction, and having several chances rather than one to see that adding was not working."}],"format":"choice","weight":1,"theme":"choice","study":{"design":"Eight experiments"},"permuted":true,"chart":{"labels":["No reminder","Reminded to add or subtract"],"values":[21,48],"unit":"%","highlight":0,"note":"Share listing at least one idea that removes something, experiment 4."}},{"id":"biz08","track":"Business","concept":"Innovation","tag":"20 / COGNITIVE LOAD","title":"Under pressure","scene":"In one experiment, people improved a pattern on a grid; some did it while keeping track of a second task at the same time.","question":"Is this what the study found?","answerTitle":"Pressure favors additions","explain":"Across eight experiments, Adams, Converse, Hales and Klotz found people were less likely to spot helpful subtractive changes under higher cognitive load, and also when nothing cued subtraction or when they had only one chance to notice it.","implication":"Schedule deliberate simplification sessions with fewer distractions.","boundary":"Cognitive load was manipulated in controlled experiments on puzzle and design tasks.","sources":["subtract21"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Does a second try help?","a":"Yes. People found subtractive improvements more often when they had several opportunities, rather than one, to notice that adding was not working."},{"q":"Which real problems do the authors link this to?","a":"Overloaded schedules, institutional red tape, and damage to the environment."},{"q":"Was this a single study?","a":"No. It was one of eight experiments that all pointed to a default toward adding."}],"format":"forecast","weight":1,"theme":"choice","study":{"design":"Eight experiments","n":""},"forecast":{"claim":"People juggling other tasks were more likely to overlook improvements that remove something.","truth":true}},{"id":"biz11","track":"Business","concept":"Judgment","tag":"23 / NUMBERS","title":"The wheel of fortune","scene":"People spun a wheel that landed on 10 or 65, then estimated the share of UN member countries that are African. The group that saw 65 gave a median of 45%.","question":"What median estimate did the group that saw 10 give?","answerTitle":"25%, pulled down by a random number","explain":"Median estimates were 25% after the wheel showed 10 and 45% after it showed 65, though everyone could see the number was random.","implication":"In negotiations and forecasts, write down your own estimate before you see anyone else’s number.","boundary":"People estimating percentages after watching a wheel produce a visibly random number; paying for accuracy did not reduce the effect.","sources":["anchor74"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What exactly did people do?","a":"The wheel was spun in front of them. They first said whether the true value was higher or lower than the number, then gave their own estimate."},{"q":"Does anchoring show up in calculations too?","a":"Yes. High school students given 5 seconds estimated 1x2x...x8 at a median of 512 and 8x7x...x1 at 2,250. The correct answer is 40,320."},{"q":"Are experts immune?","a":"No. The authors note that experienced researchers are prone to the same biases when they think intuitively."}],"format":"estimate","weight":1,"theme":"choice","estimate":{"target":25,"min":0,"max":100,"tolerance":5,"label":"Median estimate after seeing 10","unit":"%"},"chart":{"labels":["Wheel showed 10","Wheel showed 65"],"values":[25,45],"unit":"%","highlight":1,"note":"Tversky & Kahneman (1974), p. 1128."},"study":{"design":"Classroom experiment"}},{"id":"social01","track":"Culture & Society","concept":"Norm distributions","tag":"27 / CULTURE","title":"Same average, different culture","scene":"Two teams have the same average cooperation. In one, behavior is tightly clustered around the average; in the other, it is widely spread out.","question":"Which two results did the experiments find?","options":["People ignored the norm and played their own strategy","Loose norms generated more behavioral variation","Tight norms produced the most extreme choices","The spread of behavior shaped choices"],"answerTitle":"The distribution matters","explain":"Dimant, Gelfand, Hochleitner and Sonderegger showed about 1,200 Americans co-player behavior with the same mean but different spreads. Choices tracked the spread: contribution variance was 1.26 after a tight norm and 1.65 after a loose one.","implication":"Report the spread and clustering of team behavior alongside averages in culture and engagement dashboards.","boundary":"Two-player contribution game with 1,203 US adults, varying the shape of the norm while holding its average fixed.","sources":["norms24"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did participants actually do?","a":"They played a two-player public goods game. Each could contribute up to four tokens; contributions were multiplied by 1.4 and shared."},{"q":"Who took part?","a":"About 1,200 US participants recruited on Prolific, representative by age, gender, and ethnicity."},{"q":"Why does this matter for a manager?","a":"Two teams with the same average norm can behave very differently once the spread of views differs, so report the spread as well as the mean."}],"format":"multi","weight":1,"multiAnswers":[1,3],"theme":"norms","study":{"design":"Online experiment, two-player contribution game (6 treatments)","n":"1,203 US adults (representative sample)"},"permuted":true,"chart":{"labels":["Saw a tight norm","Saw a loose norm"],"values":[1.26,1.65],"unit":"","highlight":1,"note":"Variance of contributions after seeing others' choices."}},{"id":"social04","track":"Culture & Society","concept":"Pluralistic ignorance","tag":"30 / TEAM DYNAMICS","title":"Comfort with campus drinking","scene":"Students rated their own comfort with campus drinking and the comfort of the average student at their university.","question":"What did students report?","options":["Peers were as comfortable as they were","Peers were less comfortable with drinking than they were","Peers were more comfortable than they were"],"answer":2,"answerTitle":"Private views and public beliefs diverge","explain":"In all four of Prentice and Miller's studies, students rated their peers as more comfortable with campus drinking than they were themselves. Over a semester, men shifted their own attitudes toward that mistaken norm; women did not.","implication":"Elicit private views before public discussion.","boundary":"Four studies of college students' own attitudes toward campus alcohol use and their estimates of peers' attitudes.","sources":["plural93"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was studied?","a":"College students, across four studies, who rated their own comfort with campus drinking and estimated the average student's comfort."},{"q":"Did beliefs change over time?","a":"In a study that followed students over a semester, men shifted their attitudes toward the norm they mistakenly perceived. Women did not."},{"q":"What did feeling out of step cost?","a":"Students who saw themselves as deviant felt more alienated from campus, even though that deviance was illusory."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Four studies, one following students over a semester","n":"College students"},"permuted":true},{"id":"social07","track":"Culture & Society","concept":"Norm pluralism","tag":"33 / COALITIONS","title":"Drawing a party’s norm","scene":"Members of a political party agree on its headline position. Researchers asked members to draw how views are spread within their party.","question":"What did drawing each party’s norm reveal?","options":["Several coexisting views within each party","Near-uniform views held by members of each party","Two opposed camps within each party"],"answer":0,"answerTitle":"Groups are less monolithic","explain":"Among 996 US respondents, Panizza, Dimant, Kimbrough and Vostroknutov recovered several views within each party. Agreement ranged from 95% of Democrats including the same view on same-sex rights in their drawings to only 50% of Republicans on gun policy.","implication":"Before engaging a stakeholder group, map the distinct views inside it and estimate each view's share.","boundary":"One incentivized online survey of 996 US respondents on seven political issues, compared with a standard single-norm measure.","sources":["plural24"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who answered?","a":"996 US respondents on Prolific, stratified by age, gender, and political orientation."},{"q":"Which issues were covered?","a":"Abortion, same-sex rights, marijuana legalization, federal spending, gun violence, immigration, and energy investments."},{"q":"How does norm-drawing work?","a":"Respondents sketch the views different subgroups might hold and estimate the share holding each. Pay depends on how close their guesses come."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Incentivized online survey","n":"996 US respondents"},"permuted":true},{"id":"social08","track":"Culture & Society","concept":"Networks","tag":"34 / DIFFUSION","title":"Which network spreads change?","scene":"In an online health community, researchers built networks that were either clustered (neighbors share neighbors) or random (more long-range ties), then seeded a health behavior.","question":"Is this what the study found?","answerTitle":"Reinforcement can beat reach","explain":"In Centola's online experiment with 1,528 participants, a health behavior reached 53.77% of people in clustered networks but only 38.26% in random networks, and it spread more than four times faster through the clustered ones.","implication":"Launch hard-to-adopt practices inside tightly connected teams, so each person hears about them from several colleagues.","boundary":"1,528 anonymous online participants in constructed networks deciding whether to register for a health forum.","sources":["cent10"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How much farther did it spread?","a":"The behavior reached 53.77% of people in clustered networks, against 38.26% in random networks."},{"q":"How much faster?","a":"Diffusion in clustered networks was more than four times faster than in random ones."},{"q":"Did reinforcement affect follow-through?","a":"Yes. Fewer than 15% of adopters who got one signal returned to the forum, against over 30% of those who got two."}],"format":"forecast","weight":1,"theme":"forecasting","study":{"design":"Online network experiment, six trials","n":"1,528 participants"},"forecast":{"claim":"The behavior spread farther through networks with random long ties than through clustered networks with redundant ties.","truth":false},"chart":{"labels":["Clustered networks","Random networks"],"values":[53.77,38.26],"unit":"%","highlight":0,"note":"Share of people who adopted the health behavior."}},{"id":"social10","track":"Culture & Society","concept":"Replication","tag":"36 / TEAM IQ","title":"Does turn-taking make groups smart?","scene":"A 2010 Science paper reported a general “collective intelligence” factor in groups, linked to members’ social sensitivity and to equal turn-taking in conversation. Independent researchers ran their own groups.","question":"Is this what the independent replication found?","answerTitle":"Turn-taking did not predict it; members’ IQ did","explain":"In the independent replication, members’ individual IQ largely accounted for differences in group performance, and the turn-taking and share-of-women effects were not supported.","implication":"Treat team-composition recipes from single studies as hypotheses. Track your own teams’ results before redesigning how meetings run.","boundary":"Lab groups on standardized tasks. The original team’s later meta-analysis of 22 studies supports a collective intelligence factor, so the debate continues.","sources":["bates17","team10","riedl21"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the original paper claim?","a":"Woolley et al. (2010) reported a general factor across group tasks, correlated with average social sensitivity, equal turn-taking and the share of women."},{"q":"Is the whole idea dead?","a":"No. The original team’s 2021 meta-analysis supports the factor and points to social perceptiveness, while independent analyses find it weaker or explained by members’ IQ."},{"q":"Why does replication matter here?","a":"Team-design advice spread widely from the original paper. When an independent test fails on the key predictors, the advice should wait for more evidence."}],"format":"forecast","weight":1,"theme":"evidence","study":{"design":"Independent lab replications"},"forecast":{"claim":"Groups with more equal conversational turn-taking scored higher on collective intelligence.","truth":false}},{"id":"social12","track":"Culture & Society","concept":"Bias","tag":"38 / HIRING","title":"Identical résumé, different name","scene":"In a field experiment, comparable résumés were assigned names signaling different racial identities.","question":"Approximately how much higher was the callback rate for White-sounding names?","answerTitle":"50% more callbacks","explain":"Bertrand and Mullainathan answered Boston and Chicago help-wanted ads with fictitious résumés randomly given African-American- or White-sounding names. White names received 50 percent more callbacks, and callbacks responded more to résumé quality for White names.","implication":"Run periodic paired-résumé audits of your own screening, comparing callbacks for identical profiles with different names.","boundary":"Fictitious résumés sent to sales, administrative, clerical, and customer-service ads in Boston and Chicago, 2001 to 2002.","sources":["resume04"],"visual":"bars","values":[100,150],"labels":["Black-sounding","White-sounding"],"unit":"callback rate index","follow":[{"q":"Was the gap the same across jobs?","a":"Yes. The racial gap was uniform across occupation, industry and employer size."},{"q":"Did a stronger résumé close the gap?","a":"No. Better credentials raised callbacks much less for African-American names than for White names."},{"q":"Did \"Equal Opportunity Employer\" ads differ?","a":"No. Employers who listed that label in their ads discriminated as much as other employers."}],"format":"estimate","weight":1,"estimate":{"target":50,"min":0,"max":130,"tolerance":10,"label":"Callback advantage (%)"},"theme":"fairness","study":{"design":"Field expe
