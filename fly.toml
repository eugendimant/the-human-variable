# Fly.io: fly launch --no-deploy; fly volumes create thv_data --size 1; fly secrets set THV_INSTRUCTOR_PASSCODE=... GEMINI_API_KEY=...; fly deploy
app = "human-variable"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "thv_data"
  destination = "/data"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "3s"
