y job."},{"q":"What did the researchers actually test?","a":"In a 453-person writing experiment, time decreased 40% and quality increased 18%."}],"format":"estimate","weight":1,"estimate":{"target":40,"min":0,"max":70,"tolerance":10,"label":"Decrease in completion time (%)"}},{"id":"ai02","track":"AI × Business","concept":"Productivity","tag":"02 / QUALITY","title":"Faster, but worse?","scene":"The same writing experiment evaluated finished work, not just speed.","question":"What happened to average output quality?","options":["It declined","It improved by 18%","No detectable difference"],"answer":1,"answerTitle":"Quality improved 18%","explain":"The study found faster completion and higher externally evaluated quality.","implication":"Set up double-outcome tests, with blind quality evaluation.","boundary":"The 18% finding is from this writing-task sample.","sources":["noy23"],"visual":"bars","values":[100,118],"labels":["Without AI","With AI"],"unit":"quality index","follow":[{"q":"Where does this show up at work?","a":"Set up double-outcome tests, with blind quality evaluation."},{"q":"Is this always true?","a":"The 18% finding is from this writing-task sample."},{"q":"What did the researchers actually test?","a":"In a 453-person writing experiment, time decreased 40% and quality increased 18%."}],"format":"estimate","weight":1,"estimate":{"target":18,"min":0,"max":50,"tolerance":5,"label":"Increase in quality (%)"}},{"id":"ai03","track":"AI × Business","concept":"Heterogeneity","tag":"03 / TALENT","title":"Who captures the upside?","scene":"Thousands of customer-support agents begin using a generative AI assistant.","question":"Which TWO observations fit the customer-support study?","options":["Average productivity rose about 15%","Less experienced workers tended to gain more","Every worker experienced the same gains"],"answer":0,"answerTitle":"The less experienced gained more","explain":"The support-center study found average productivity gains of 15%, concentrated among lower-skill and less experienced workers.","implication":"Segment pilot results by tenure and baseline performance.","boundary":"This pattern is not a general law of AI adoption.","sources":["bry25"],"visual":"bars","values":[],"labels":["Average gain","Experienced: smaller"],"unit":"illustrative ordering","follow":[{"q":"Where does this show up at work?","a":"Segment pilot results by tenure and baseline performance."},{"q":"Is this always true?","a":"This pattern is not a general law of AI adoption."},{"q":"What did the researchers actually test?","a":"AI assistance raised customer-support issues resolved per hour 15% on average, with larger gains for less experienced workers."}],"format":"multi","weight":1,"multiAnswers":[0,1]},{"id":"ai04","track":"AI × Business","concept":"Adoption","tag":"04 / OPERATIONS","title":"A real-world baseline","scene":"A company deploys AI in a live customer-support workflow.","question":"How much did issues resolved per hour rise on average?","options":["About 2%","About 15%","About 70%"],"answer":1,"answerTitle":"15% on average","explain":"The analysis covered 5,172 agents and measured issues resolved per hour.","implication":"Start with a single operational metric and check subgroup effects.","boundary":"Context was customer support; other workflows may differ.","sources":["bry25"],"visual":"bars","values":[100,115],"labels":["Pre-adoption","AI assistance"],"unit":"relative output","follow":[{"q":"Where does this show up at work?","a":"Start with a single operational metric and check subgroup effects."},{"q":"Is this always true?","a":"Context was customer support; other workflows may differ."},{"q":"What did the researchers actually test?","a":"AI assistance raised customer-support issues resolved per hour 15% on average, with larger gains for less experienced workers."}],"format":"estimate","weight":1,"estimate":{"target":15,"min":0,"max":50,"tolerance":5,"label":"Increase in issues per hour (%)"}},{"id":"ai05","track":"AI × Business","concept":"Frontiers","tag":"05 / STRATEGY","title":"The jagged frontier","scene":"Consultants use an AI model across several professional tasks. Some tasks are well matched to the model; some are not.","question":"What is the most defensible rollout policy?","options":["AI for every task by default","Evaluate capabilities task by task","Use no AI on high-skill work"],"answer":1,"answerTitle":"Map the task frontier","explain":"The field experiment highlights that AI performance depends on the task. Broad job titles are poor guides to where AI helps.","implication":"Test representative tasks, including failure cases, before rollout.","boundary":"The frontier changes with model, prompts, and task design.","sources":["dell26"],"visual":"matrix","values":[],"labels":["Inside frontier","Outside frontier"],"unit":"stylized concept","follow":[{"q":"Where does this show up at work?","a":"Test representative tasks, including failure cases, before rollout."},{"q":"Is this always true?","a":"The frontier changes with model, prompts, and task design."},{"q":"What did the researchers actually test?","a":"Generative AI performance depended on whether tasks were within or outside the AI capability frontier."}],"format":"choice","weight":1},{"id":"ai06","track":"AI × Business","concept":"Frontiers","tag":"06 / OVERSIGHT","title":"When expertise backfires","scene":"A manager observes a strong AI answer on one task and extends its use to an unrelated task.","question":"Which assumption is dangerous?","options":["Capabilities transfer evenly","Human review has a cost","Some tasks are easier than others"],"answer":0,"answerTitle":"Competence does not transfer evenly","explain":"The paper describes an uneven capability frontier: strong results on one task do not validate a neighboring task.","implication":"Define tasks and acceptance tests rather than “AI-ready” departments.","boundary":"No universal safe or unsafe category is established by one study.","sources":["dell26"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Define tasks and acceptance tests rather than “AI-ready” departments."},{"q":"Is this always true?","a":"No universal safe or unsafe category is established by one study."},{"q":"What did the researchers actually test?","a":"Generative AI performance depended on whether tasks were within or outside the AI capability frontier."}],"format":"choice","weight":1},{"id":"ai07","track":"AI × Business","concept":"Creativity","tag":"07 / IDEAS","title":"Better ideas, closer together","scene":"Writers receive ideas from a generative AI system before producing stories.","question":"Which TWO findings occurred in the study?","options":["AI-assisted stories were rated more creative","AI-assisted stories were more similar to each other","Writers universally rejected the AI ideas"],"answer":0,"answerTitle":"A creativity trade-off","explain":"AI-assisted stories scored higher on creativity but became more similar to one another.","implication":"Evaluate distinctiveness across your full campaign, not only each asset.","boundary":"This experiment studied short stories, not all innovation work.","sources":["doshi24"],"visual":"scatter","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Evaluate distinctiveness across your full campaign, not only each asset."},{"q":"Is this always true?","a":"This experiment studied short stories, not all innovation work."},{"q":"What did the researchers actually test?","a":"AI ideas improved evaluated short-story creativity but made resulting stories more similar."}],"format":"multi","weight":1,"multiAnswers":[0,1]},{"id":"ai08","track":"AI × Business","concept":"Creativity","tag":"08 / PORTFOLIO","title":"The hidden portfolio risk","scene":"An agency uses one model to brainstorm 30 campaign concepts. Each looks polished.","question":"What metric could reveal a hidden problem?","options":["Total word count","Similarity across concepts","Average design time"],"answer":1,"answerTitle":"Measure between-idea similarity","explain":"A set of individually strong outputs can still lack range. That was the central tension in the story experiment.","implication":"Assess novelty against the whole output set.","boundary":"Similarity is not necessarily harmful in every communication task.","sources":["doshi24"],"visual":"scatter","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Assess novelty against the whole output set."},{"q":"Is this always true?","a":"Similarity is not necessarily harmful in every communication task."},{"q":"What did the researchers actually test?","a":"AI ideas improved evaluated short-story creativity but made resulting stories more similar."}],"format":"choice","weight":1},{"id":"ai09","track":"AI × Business","concept":"Trust in AI","tag":"09 / TRUST","title":"One error, lost trust","scene":"A prediction model outperforms a human expert but makes one visible error.","question":"What did participants in algorithm-aversion studies often do?","options":["Shift away from the model","Become more trusting of the model","Ignore the mistake entirely"],"answer":0,"answerTitle":"A visible error can dominate","explain":"Participants became reluctant to use an algorithm after watching it err, even when it outperformed people.","implication":"Communicate expected error rates and compare human and model performance symmetrically.","boundary":"Other experiments find algorithm appreciation. The task and framing matter.","sources":["diet15"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Communicate expected error rates and compare human and model performance symmetrically."},{"q":"Is this always true?","a":"Other experiments find algorithm appreciation. The task and framing matter."},{"q":"What did the researchers actually test?","a":"Observers lose confidence in algorithmic forecasters after seeing them err, even where algorithms outperform humans."}],"format":"choice","weight":1},{"id":"ai10","track":"AI × Business","concept":"Trust in AI","tag":"10 / ADVICE","title":"Do people always dislike algorithms?","scene":"A forecasting tool and a person offer advice in a prediction task.","question":"Which generalization is supported by published research?","options":["People always trust the person","People sometimes weight algorithmic advice more","Everyone ignores all external advice"],"answer":1,"answerTitle":"Algorithm appreciation exists","explain":"In several tasks, participants relied more on algorithmic advice than human advice.","implication":"Test how trust changes by task, domain, and visible errors.","boundary":"Appreciation and aversion are not contradictory universal rules.","sources":["logg19"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Test how trust changes by task, domain, and visible errors."},{"q":"Is this always true?","a":"Appreciation and aversion are not contradictory universal rules."},{"q":"What did the researchers actually test?","a":"In several prediction settings, people weigh algorithmic advice more heavily than human advice."}],"format":"choice","weight":1},{"id":"ai11","track":"AI × Business","concept":"Trust in AI","tag":"11 / FIT","title":"A model for taste?","scene":"A retailer considers algorithms to recommend a practical product versus judge a highly personal aesthetic preference.","question":"Where is algorithm aversion more likely?","options":["The subjective judgment","The objective judgment","Both equally in every setting"],"answer":0,"answerTitle":"Subjectivity changes acceptance","explain":"The task-dependent aversion experiments link perceived subjectivity to resistance to algorithms.","implication":"Frame tools around strengths and allow agency in subjective contexts.","boundary":"Task perceptions differ between users and cultures.","sources":["cast19"],"visual":"matrix","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Frame tools around strengths and allow agency in subjective contexts."},{"q":"Is this always true?","a":"Task perceptions differ between users and cultures."},{"q":"What did the researchers actually test?","a":"Acceptance of algorithms varies with whether tasks seem subjective or objective."}],"format":"choice","weight":1},{"id":"ai12","track":"AI × Business","concept":"Trust in AI","tag":"12 / PERSONALIZATION","title":"The uniqueness concern","scene":"A service uses AI for individualized medical recommendations. Consumers are told the system is highly accurate.","question":"What concern can still drive resistance?","options":["The service is too quick","It cannot account for my uniqueness","The service has too many employees"],"answer":1,"answerTitle":"People care about being seen","explain":"Medical-AI resistance research highlights concerns that algorithms will not consider unique circumstances.","implication":"Explain customization and allow meaningful human escalation.","boundary":"Healthcare attitudes may not transfer directly to retail or HR.","sources":["long19"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Explain customization and allow meaningful human escalation."},{"q":"Is this always true?","a":"Healthcare attitudes may not transfer directly to retail or HR."},{"q":"What did the researchers actually test?","a":"Consumers can resist medical AI, in part from concerns about uniqueness and tailoring."}],"format":"choice","weight":1},{"id":"biz01","track":"Business","concept":"Defaults","tag":"13 / DESIGN","title":"The choice you do not make","scene":"A company automatically enrolls new hires into retirement savings but lets them opt out.","question":"What happened in the landmark workplace study?","options":["Participation rose","Participation fell","Enrollment stayed constant"],"answer":0,"answerTitle":"The default changed behavior","explain":"Automatic enrollment sharply increased participation, with many employees retaining default settings.","implication":"Audit defaults in product settings, benefits, and subscriptions.","boundary":"Defaults can preserve unwanted allocations as well as improve take-up.","sources":["defaults01"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Audit defaults in product settings, benefits, and subscriptions."},{"q":"Is this always true?","a":"Defaults can preserve unwanted allocations as well as improve take-up."},{"q":"What did the researchers actually test?","a":"Automatic enrollment increased plan participation, and many retained default rates and allocations."}],"format":"choice","weight":1},{"id":"biz02","track":"Business","concept":"Defaults","tag":"14 / FRICTION","title":"The sticky default","scene":"New hires stay enrolled, but rarely change the contribution rate.","question":"Which mechanism best fits the evidence?","options":["Active deliberate optimization","Inertia and endorsement from the default","A legal requirement to keep the rate"],"answer":1,"answerTitle":"Defaults communicate advice","explain":"The researchers linked persistence partly to inertia and perceiving defaults as implicit advice.","implication":"Make beneficial defaults clear, editable, and salient.","boundary":"Persistence by itself does not prove a choice was optimal.","sources":["defaults01"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Make beneficial defaults clear, editable, and salient."},{"q":"Is this always true?","a":"Persistence by itself does not prove a choice was optimal."},{"q":"What did the researchers actually test?","a":"Automatic enrollment increased plan participation, and many retained default rates and allocations."}],"format":"choice","weight":1},{"id":"biz03","track":"Business","concept":"Social proof","tag":"15 / MARKETING","title":"The hotel-room note","scene":"A hotel asks guests to reuse towels. One sign cites conservation; another cites what other guests do.","question":"Which appeal performed better in the field studies?","options":["Environmental appeal","Descriptive norm appeal","Both were equally ineffective"],"answer":1,"answerTitle":"Behavioral evidence beat a generic appeal","explain":"Descriptive-norm messaging outperformed a conventional environmental appeal in the hotel field experiments.","implication":"Use truthful, locally relevant peer comparisons.","boundary":"Do not invent “most customers” statistics.","sources":["hotel08"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Use truthful, locally relevant peer comparisons."},{"q":"Is this always true?","a":"Do not invent “most customers” statistics."},{"q":"What did the researchers actually test?","a":"Descriptive norm appeals outperformed a conventional conservation appeal; local-room norms performed well."}],"format":"choice","weight":1},{"id":"biz04","track":"Business","concept":"Social proof","tag":"16 / CONTEXT","title":"The most persuasive neighbor","scene":"A hotel can refer to guests across the hotel or guests who stayed in the same room.","question":"Which comparison was particularly effective?","options":["All hotel guests","Same-room guests","No comparison group"],"answer":1,"answerTitle":"Local norms can carry more weight","explain":"The hotel experiments found stronger influence from norms tied to the guests’ immediate setting.","implication":"Compare reference-group proximity when designing social proof.","boundary":"Local norms must be measured accurately and ethically.","sources":["hotel08"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Compare reference-group proximity when designing social proof."},{"q":"Is this always true?","a":"Local norms must be measured accurately and ethically."},{"q":"What did the researchers actually test?","a":"Descriptive norm appeals outperformed a conventional conservation appeal; local-room norms performed well."}],"format":"choice","weight":1},{"id":"biz05","track":"Business","concept":"Norms","tag":"17 / BACKFIRE","title":"The energy bill that backfired","scene":"A household already uses less electricity than its neighbors. Its bill highlights the higher neighborhood average.","question":"Which TWO patterns appeared in the energy study?","options":["Some already-efficient households raised usage","Injunctive feedback counteracted the boomerang effect","Descriptive averages reduced use for every household"],"answer":0,"answerTitle":"A norm message can backfire","explain":"Information on typical neighborhood consumption increased consumption among some already-efficient households.","implication":"Add signals that praise the desired behavior, not averages alone.","boundary":"The result concerns this specific norm intervention.","sources":["energy07"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Add signals that praise the desired behavior, not averages alone."},{"q":"Is this always true?","a":"The result concerns this specific norm intervention."},{"q":"What did the researchers actually test?","a":"Neighborhood average messages induced savings or boomerang effects; injunctive feedback changed that pattern."}],"format":"multi","weight":1,"multiAnswers":[0,1]},{"id":"biz06","track":"Business","concept":"Norms","tag":"18 / FIX","title":"Two types of social feedback","scene":"A utility adds an approval cue to neighborhood comparison messages.","question":"What happened to the unwanted boomerang effect?","options":["It was counteracted","It doubled","It spread to every household"],"answer":0,"answerTitle":"Approval changed the response","explain":"Injunctive feedback counteracted the increase among households already below average.","implication":"Combine descriptive norms with clear approval for desirable conduct.","boundary":"Approval signals also need responsible testing.","sources":["energy07"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Combine descriptive norms with clear approval for desirable conduct."},{"q":"Is this always true?","a":"Approval signals also need responsible testing."},{"q":"What did the researchers actually test?","a":"Neighborhood average messages induced savings or boomerang effects; injunctive feedback changed that pattern."}],"format":"choice","weight":1},{"id":"biz07","track":"Business","concept":"Innovation","tag":"19 / PROCESS","title":"Delete before you add","scene":"A team has a slow approval process. Asked to improve it, members suggest new steps and dashboards.","question":"What type of solution do people systematically overlook?","options":["Adding checks","Removing steps","Renaming teams"],"answer":1,"answerTitle":"Subtraction is often missed","explain":"Across experiments, people overlooked beneficial subtractive changes, especially without prompts to consider deletion.","implication":"Make “What can we remove?” mandatory in process reviews.","boundary":"Subtraction is an option to test, not a universal answer.","sources":["subtract21"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Make “What can we remove?” mandatory in process reviews."},{"q":"Is this always true?","a":"Subtraction is an option to test, not a universal answer."},{"q":"What did the researchers actually test?","a":"People often default to adding rather than subtracting when asked to improve a situation."}],"format":"choice","weight":1},{"id":"biz08","track":"Business","concept":"Innovation","tag":"20 / COGNITIVE LOAD","title":"Under pressure","scene":"An operations team must solve a complex process problem while juggling other tasks.","question":"How does higher cognitive load affect overlooked subtraction?","options":["Makes subtraction more likely","Makes subtraction less likely","Always has zero effect"],"answer":1,"answerTitle":"Pressure favors additions","explain":"The Nature experiments found subtractive improvements were less likely under greater cognitive load.","implication":"Schedule deliberate simplification sessions with fewer distractions.","boundary":"Effects depend on the search problem and prompts.","sources":["subtract21"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Schedule deliberate simplification sessions with fewer distractions."},{"q":"Is this always true?","a":"Effects depend on the search problem and prompts."},{"q":"What did the researchers actually test?","a":"People often default to adding rather than subtracting when asked to improve a situation."}],"format":"choice","weight":1},{"id":"biz09","track":"Business","concept":"Decisions","tag":"21 / FRAMING","title":"Same outcome, different decision","scene":"An executive sees the same policy choice described as lives saved or lives lost.","question":"What does classic framing research predict?","options":["Identical preferences always","Possible preference reversals","Perfectly rational optimization independent of framing"],"answer":1,"answerTitle":"Presentation can change choice","explain":"Classic experiments found that logically equivalent frames could produce different preferences.","implication":"Present both gain and loss frames in decision briefs.","boundary":"Effect sizes vary; framing is not mind control.","sources":["frame81"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Present both gain and loss frames in decision briefs."},{"q":"Is this always true?","a":"Effect sizes vary; framing is not mind control."},{"q":"What did the researchers actually test?","a":"Equivalent decision problems can produce different preferences depending on presentation."}],"format":"choice","weight":1},{"id":"biz10","track":"Business","concept":"Decisions","tag":"22 / REVIEW","title":"A decision memo rewrite","scene":"A manager wants to reduce influence from selective framing.","question":"Which intervention directly addresses the concern?","options":["Show only upside scenarios","Present equivalent gain and loss formulations","Remove all base rates"],"answer":1,"answerTitle":"Make the frame visible","explain":"The underlying problem is that the description of a choice can change preference.","implication":"Require a neutral restatement before sign-off.","boundary":"Balanced framing alone does not remove all biases.","sources":["frame81"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Where does this show up at work?","a":"Require a neutral restatement before sign-off."},{"q":"Is this always true?","a":"Balanced framing alone does not remove all biases."},{"q":"What did the researchers actually test?","a":"Equivalent decision problems can produce different preferences depending on presentation."}],"format":"choice","weight":1},{"id":"biz11","track":"Business","concept":"Judgment","tag":"23 / NUMBERS","title":"An irrelevant number","scene":"During valuation, a negotiator hears an arbitrary early number unrelated to the actual asset value.","question":"What can happen to a later estimate?","options":["It may drift toward that number","It mu function game(){const c=cardNow();if(!c){mode='home';return home()}const isReveal=phase==='reveal';const ordered=order(c);const progress=Math.round(step/deck.length*100);const answer=ordered.map((o,j)=>`<button class="answer-option ${(Array.isArray(selected)?selected.includes(o.index):selected===o.index)?'is-picked':''} ${isReveal&&(c.format==='multi'?c.multiAnswers.includes(o.index):o.index===c.answer)?'is-correct':''} ${isReveal&&(Array.isArray(selected)?selected.includes(o.index):selected===o.index)&&!(c.format==='multi'?c.multiAnswers.includes(o.index):o.index===c.answer)?'is-wrong':''}" data-choice="${o.index}" ${isReveal?'disabled':''}><span class="answer-key">${String.fromCharCode(65+j)}</span><span class="answer-text">${esc(o.text)}</span>${isReveal&&(c.format==='multi'?c.multiAnswers.includes(o.index):o.index===c.answer)?'<span class="answer-check">✓</span>':''}</button>`).join('');const currentResult=session[session.length-1];const sc=session.filter(x=>x.correct).length;

`<h1 class="round-title">${esc(c.title)}.</h1><p class="round-scene">${esc(c.scene)}</p><div class="question-label">${c.format==='multi'?'YOUR PREDICTION / SELECT TWO':c.format==='estimate'?'YOUR PREDICTION / MAKE AN ESTIMATE':'YOUR PREDICTION'}</div><h2 class="question">${esc(c.question)}</h2>${c.format==='estimate'?`<div class="estimate-widget"><div class="estimate-top"><span>${esc(c.estimate.label)}</span><strong id="estimate-read">${estimate===null?'YOUR ESTIMATE':estimate+'%'}</strong></div><input type="range" id="estimate" min="${c.estimate.min}" max="${c.estimate.max}" step="1" value="${estimate===null?Math.round(c.estimate.max/2):estimate}" aria-label="${esc(c.estimate.label)}"/><div class="estimate-axis"><span>${c.estimate.min}%</span><span>${c.estimate.max}%</span></div><p>Move the marker to commit to an estimate. You can revise it before locking.</p></div>`:`<div class="answers">${answer}</div>`}<div class="confidence"><label for="confidence">How confident are you?</label><span class="confidence-number" id="confidence-read">${confidence}%</span><input type="range" id="confidence" min="0" max="100" step="5" value="${confidence}" aria-label="Confidence from 0 to 100 percent"/><div class="confidence-scale"><span>0% · uncertain</span><span>100% · certain</span></div></div><div class="stage-actions"><button class="btn-dark" id="lock-answer" ${(c.format==='estimate'?estimate===null:c.format==='multi'?!Array.isArray(selected)||selected.length!==2:selected===null)?'disabled':''}>Lock prediction <span class="arrow">→</span></button><span class="stage-footnote">A confident prediction makes<br>the reveal more instructive.</span></div>`}

function atlas(){let matches=ALL.filter(c=>(atlasFilter==='All areas'||c.track===atlasFilter)&&[c.title,c.scene,c.concept,c.question,c.explain,c.track,SOURCE[c.sources[0]].authors].join(' ').toLowerCase().includes(atlasSearch.trim().toLowerCase()));return `<section class="atlas-top"><div class="eyebrow">THE RESEARCH ATLAS / ${ALL.length} EXPERIMENTS &amp; INSIGHTS</div><h1 class="atlas-headline">Follow your curiosity.</h1><p class="section-intro">Explore ${Object.keys(SOURCE).length} published sources through ${ALL.length} carefully scoped decision challenges. Search by concept, author, or question.</p><div class="atlas-search"><span style="font-size:26px">⌕</span><input id="atlas-search" type="search" placeholder="Find a concept, question, or researcher" value="${esc(atlasSearch)}" aria-label="Search the research atlas"/><button id="atlas-clear">CLEAR</button></div></section><section class="atlas-body"><div class="filter-row">${['All areas',...tracks].map(t=>`<button class="filter-btn ${atlasFilter===t?'is-active':''}" data-atlas-filter="${esc(t)}">${esc(t)}</button>`).join('')}<span class="pill muted" style="margin-left:auto">${matches.length} ENTRIES</span></div><div class="atlas-grid" id="atlas-grid">${matches.length?matches.map(c=>`<button class="atlas-card" data-play="${esc(c.id)}"><div class="at-id">${esc(c.tag)} &nbsp; · &nbsp; ${esc(c.track)}</div><h3>${esc(c.title)}</h3><div class="at-sub">${esc(c.question)}</div><div class="at-footer"><span>${esc(c.concept.toUpperCase())}</span><span>PLAY ↗</span></div></button>`).join(''):`<div class="empty-state"><h3>No matching entries.</h3><p>Try “AI”, “norms”, “hiring”, or an author.</p></div>`}</div></section>`}
function results(){const m=metric(),last=session.length?session:saved.slice(-8),n=last.length,correct=last.filter(x=>x.correct).length,avgConf=n?Math.round(last.reduce((a,x)=>a+x.confidence,0)/n):0,acc=n?Math.round(correct/n*100):0,cal=n?Math.round(last.reduce((a,x)=>a+(x.confidence/100-(x.correct?1:0))**2,0)/n*100):null;
const groups=[['50–60',50,60],['65–75',65,75],['80–90',80,90],['95–100',95,100]];return `<section class="report-hero"><div class="eyebrow">THE HUMAN VARIABLE / PERSONAL RECORD</div><h1 class="report-title">Every prediction<br>leaves a trace.</h1><p class="report-intro">A record of how often you were right, how certain you felt, and which research areas deserve another look. Saved only in this browser.</p><div class="report-cells"><div class="report-cell"><strong>${m.n}</strong><span>Lifetime calls</span></div><div class="report-cell"><strong>${m.accuracy}%</strong><span>Lifetime accuracy</span></div><div class="report-cell"><strong>${n?acc+'%':'—'}</strong><span>${session.length?'This session':'Recent'} accuracy</span></div><div class="report-cell"><strong>${cal===null?'—':(cal/100).toFixed(2)}</strong><span>${session.length?'Session':'Recent'} Brier loss ↓</span></div></div></section><section class="report-body"><div class="section-bar"><div><div class="eyebrow">YOUR DECISION PROFILE</div><h2 class="section-title">How you called it.</h2></div><p class="section-intro">Accuracy is the share of correct choices. Calibration compares confidence with correctness. Binary Brier loss (lower is better) scores your stated confidence that your answer was correct, across all challenge formats.</p></div><div class="report-layout"><div class="panel"><h3 class="panel-title">Recent decisions</h3>${last.length?last.slice().reverse().map(r=>{let c=ALL.find(x=>x.id===r.id);return `<div class="history-line"><span><strong>${r.correct?'✓':'×'} ${esc(c?c.title:r.id)}</strong><br><small>${esc(r.track)} · ${r.confidence}% confidence</small></span><span class="pill ${r.correct?'acid':'muted'}">${r.correct?'RIGHT':'MISSED'}</span></div>`}).join(''):'<p class="muted">No predictions yet. Play a short session to begin.</p>'}</div><div class="panel"><h3 class="panel-title">Confidence by bucket</h3><p style="font-size:12px;line-height:1.6;color:#67786d">Filled bars show accuracy within each confidence range. Gaps matter more than a single score.</p><div class="calib-list">${groups.map(([name,a,b])=>{let x=last.filter(t=>t.confidence>=a&&t.confidence<=b),val=x.length?Math.round(x.filter(v=>v.correct).length/x.length*100):0;return `<div class="calib-row"><span>${name}%</span><div class="calib-bar"><span style="width:${val}%"></span></div><strong>${x.length?val+'%':'—'}</strong></div>`}).join('')}</div><p class="reveal-small">${n?`Recent average confidence: ${avgConf}%. Recent accuracy: ${acc}%.`:'A calibration profile appears as you play.'} Confidence ranges are descriptive, not a standardized assessment.</p></div></div>${cohort?`<div class="cohort-summary"><div><span class="pill acid">CLASSROOM COMPARISON</span><h3>${cohort.accuracy}% average accuracy across ${cohort.n} matching exports</h3><p>Import-only aggregate; group files were processed locally and not retained. ${cohort.rejected} mismatched files skipped. This is not a population benchmark.</p></div><div class="cohort-graphic"><div><span>Your session</span><strong>${acc}%</strong><i style="width:${acc}%"></i></div><div><span>Imported cohort</span><strong>${cohort.accuracy}%</strong><i style="width:${cohort.accuracy}%"></i></div></div></div>`:''}<div class="classroom-tools"><div><span class="pill muted">CLASSROOM / OPTIONAL</span><h3>Compare with your cohort.</h3><p>Each student exports a session JSON file. Import the files here to compare scores on the same seeded question set, without a server or shared account.</p></div><div><button class="btn-secondary" id="export-class">Export session JSON <span class="arrow">↓</span></button><button class="btn-secondary" id="cohort-import">Import cohort files <span class="arrow">↗</span></button><input type="file" id="cohort-files" accept=".json,application/json" multiple hidden /></div></div><div class="report-actions">${btn('Play another session','dark','replay')}<button class="btn-secondary" id="share-report">Copy a class-friendly summary <span class="arrow">↗</span></button><button class="btn-secondary" id="export-csv">Export CSV <span class="arrow">↓</span></button><button class="btn-secondary" id="host-link">Copy a class session link <span class="arrow">↗</span></button></div><div style="margin-top:35px"><button class="mini-btn" id="reset-progress">Erase local record</button></div></section>`}

function downloadFile(name,text,mime='text/plain'){let blob=new Blob([text],{type:mime});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

async function importCohort(files){let group=[],rejected=0,accepted=0;for(const f of files){try{if(f.size>150000){rejected++;continue}const data=JSON.parse(await f.text());if(data.kind!=='thv-session'||!Array.isArray(data.results)||!data.results.length||data.results.length>60){rejected++;continue}if(data.sessionSeed!==seed){rejected++;continue}if(!data.results.every(x=>ALL.some(y=>y.id===x.id)&&typeof x.correct==='boolean'&&Number.isFinite(x.confidence))){rejected++;continue}group.push(data.results);accepted++}catch{rejected++}}if(!group.length){notice('No matching class-session files. Use the same class link for every participant.');return}const avg=group.reduce((a,run)=>a+run.filter(x=>x.correct).length/run.length,0)/group.length*100;cohort={n:accepted,rejected,accuracy:Math.round(avg),questions:group.reduce((a,run)=>a+run.length,0)};render();notice('Cohort summary assembled locally; no records uploaded.')}

function reportText(){const m=metric();return `THE HUMAN VARIABLE · decision record\n${m.n} predictions · ${m.accuracy}% correct overall\nOriginal concept by Eugen Dimant\nResearch-backed executive decision lab.\nScores are personal and not standardized.`}
function classLink(){let p=new URLSearchParams();if(selectedTrack!=='All areas')p.set('track',selectedTrack);p.set('n',String(chosenLength));p.set('seed',String(seed));p.set('class','1');return location.origin+location.pathname+'?'+p.toString()}
function localAnswer(q,c){const stop=new Set('what which where when why does that this with from about some more have should would there their these they them then into how could does work study case research model paper business effect people thing found finding do did i you your the for and are can a in of to on is it an be me if as was were at by or we');let terms=(q.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!stop.has(w));const results=ALL.map(x=>({x,score:(x.id===c.id?3:0)+terms.reduce((sum,t)=>sum+([x.concept,x.title,x.explain,x.boundary,x.implication,x.scene].join(' ').toLowerCase().includes(t)?1:0),0)})).filter(v=>v.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
if(!terms.length||results.every(x=>x.score<=3)){return `Curated answer: ${c.explain}\n\nContext: ${c.boundary}\n\nSource: ${SOURCE[c.sources[0]].authors} (${SOURCE[c.sources[0]].year}). This is a library summary, not a live AI response.`}
let best=results[0].x;return `Related finding: ${best.explain}\n\nWhere it applies: ${best.implication}\n\nBoundary: ${best.boundary}\n\nSource: ${SOURCE[best.sources[0]].authors} (${SOURCE[best.sources[0]].year}). Curated research lookup, not a generated answer.`}
async function tutorAsk(){const inp=qs('#tutor-input');if(!inp||loadingTutor)return;const q=inp.value.trim().slice(0,180);if(q.length<5){notice('Enter a question of at least five characters.');return}const c=cardNow();loadingTutor=true;tutorResponse='';render();if(!window.THV_TUTOR_ENDPOINT){tutorResponse=localAnswer(q,c);loadingTutor=false;render();return}
try{const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),6500);const resp=await fetch(window.THV_TUTOR_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,cardId:c.id}),signal:ctl.signal});clearTimeout(timeout);if(!resp.ok)throw Error('tutor unavailable');const data=await resp.json();if(typeof data.answer!=='string'||!data.answer.trim())throw Error('empty');tutorResponse=data.answer.slice(0,1100)+(data.mode==='curated'?'\n\nCurated research answer.':'\n\nAI-assisted answer: verify details in linked sources.')}catch{tutorResponse=localAnswer(q,c)+'\n\nThe optional AI service is busy or unavailable. The game remains fully usable.'}finally{loadingTutor=false;render()}}
function render(){const v=qs('#view');v.innerHTML=mode==='home'?home():mode==='atlas'?atlas():mode==='game'?game():results();layout();document.title=(mode==='game'?cardNow()?.title+' · ':mode==='atlas'?'Atlas · ':mode==='results'?'Your record · ':'')+'The Human Variable';}
// Single delegated click handler avoids stale listeners after renders.
document.addEventListener('click',e=>{const tgt=e.target.closest('button,a');if(!tgt)return;if(tgt.dataset.nav){route(tgt.dataset.nav);return}if(tgt.dataset.track){selectedTrack=selectedTrack===tgt.dataset.track?'All areas':tgt.dataset.track;let available=selectedTrack==='All areas'?ALL.length:ALL.filter(x=>x.track===selectedTrack).length;if(chosenLength>available)chosenLength=available>=12?12:available>=8?8:5;render();return}if(tgt.dataset.length){chosenLength=+tgt.dataset.length;render();return}if(tgt.dataset.atlasFilter){atlasFilter=tgt.dataset.atlasFilter;render();return}if(tgt.dataset.choice!==undefined){choose(+tgt.dataset.choice);return}if(tgt.dataset.follow!==undefined){followIndex=followIndex===+tgt.dataset.follow?-1:+tgt.dataset.follow;render();return}if(tgt.dataset.play){beginSingle(tgt.dataset.play);return}if(tgt.dataset.source){sourceModal(tgt.dataset.source);return}
const id=tgt.id;
if(id==='hero-start'){document.getElementById('choose-track')?.scrollIntoView({behavior:'smooth'});return}
if(id==='start-run'||id==='replay'){if(id==='replay'||!FOR_CLASS)seed=(Math.random()*0xffffffff)>>>0;startRun();return}
if(id==='game-next'){next();return}if(id==='lock-answer'){lock();return}if(id==='atlas-clear'){atlasSearch='';render();qs('#atlas-search')?.focus();return}if(id==='tutor-submit'){tutorAsk();return}
if(id==='footer-sources'){infoModal('sources');return}if(id==='footer-about'){infoModal('about');return}if(id==='modal-close'||e.target.classList.contains('modal-backdrop')){closeModal();return}
if(id==='save-field-note'){const t=qs('#field-note-input');const c=cardNow();if(t&&c){notes[c.id]=t.value.slice(0,480);try{localStorage.setItem(NOTES_KEY,JSON.stringify(notes))}catch{}notice('Field note saved on this device.')}return}
if(id==='export-class'){exportSession();return}if(id==='cohort-import'){qs('#cohort-files')?.click();return}
if(id==='share-report'){copy(reportText());return}if(id==='export-csv'){csvExport();return}if(id==='host-link'){copy(classLink());return}if(id==='reset-progress'){if(confirm('Erase all decisions and field notes stored in this browser? This cannot be undone.')){saved=[];session=[];notes={};cohort=null;try{localStorage.removeItem(KEY);localStorage.removeItem(NOTES_KEY)}catch{}render();notice('Local record erased.')}return}
if(id==='menu-toggle'){qs('.nav')?.classList.toggle('is-open');return}
});
document.addEventListener('input',e=>{if(e.target.id==='estimate'){estimate=Number(e.target.value);const e2=qs('#estimate-read');if(e2)e2.textContent=estimate+'%';const l=qs('#lock-answer');if(l)l.disabled=false;return}if(e.target.id==='confidence'){confidence=Number(e.target.value);const x=qs('#confidence-read');if(x)x.textContent=confidence+'%';return}if(e.target.id==='atlas-search'){const pos=e.target.selectionStart;atlasSearch=e.target.value;const grid=qs('#atlas-grid');if(!grid)return; // Search refresh without losing focus
const temp=atlas();const doc=new DOMParser().parseFromString(temp,'text/html');grid.innerHTML=doc.querySelector('#atlas-grid')?.innerHTML||'';return}});
document.addEventListener('change',e=>{if(e.target.id==='cohort-files'&&e.target.files?.length)importCohort([...e.target.files])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(e.target.matches('input,textarea')){if(e.key==='Enter'&&e.target.id==='tutor-input')tutorAsk();return}if(mode==='game'&&phase==='predict'){const num=Number(e.key);if(num>=1&&num<=4){const ordered=order(cardNow());if(ordered[num-1])choose(ordered[num-1].index)}if(e.key==='Enter'&&(cardNow().format==='estimate'?estimate!==null:cardNow().format==='multi'?Array.isArray(selected)&&selected.length===2:selected!==null))lock()}else if(mode==='game'&&phase==='reveal'&&(e.key==='Enter'||e.key==='ArrowRight'))next()});
if(PARAM.get('view')==='atlas')mode='atlas';if(PARAM.get('view')==='results')mode='results';
if(FOR_CLASS){notice('Class link loaded. Select Start to use the shared question order.');}
render();
})();
</script>
</body></html>
