:root{
  --paper:#eceff3;--surface:#ffffff;--sunk:#e2e7ed;--ink:#14203a;--ink-2:#36425e;--muted:#56617a;--rule:#cbd3dd;--rule-strong:#9aa6b6;
  --you:#2f54eb;--you-soft:#dfe6ff;--you-ink:#1f3cc2;
  --ev:#e0a01c;--ev-soft:#fbefd2;--ev-ink:#7d5200;
  --good:#1d7a52;--bad:#b4362a;
  --sans:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --r-panel:14px;--r-ctl:10px;--gut:clamp(16px,4vw,56px);--max:1280px;
  --t1:clamp(40px,6.2vw,88px);--t2:clamp(30px,3.6vw,48px);--t3:clamp(22px,2.2vw,30px);--t4:19px;--t5:16px;--t6:14px;--t7:12.5px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body.in-play{scroll-padding-bottom:128px}
html:has(body.in-play){scroll-padding-bottom:128px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t5)/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--you-ink);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--you);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r-ctl);z-index:100}
.skip:focus{top:12px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:var(--max);margin:auto;padding:0 var(--gut);height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand-glyph{width:26px;height:26px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{padding:8px 12px;border-radius:999px;font-weight:600;font-size:var(--t6);color:var(--ink-2)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.menu-btn{display:none;margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule)}

/* Shared */
.wrap{max-width:var(--max);margin:auto;padding:0 var(--gut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:var(--t6);letter-spacing:.005em;transition:background .15s,transform .15s}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover:not(:disabled){background:#22325a}
.btn-you{background:var(--you);color:#fff}
.btn-you:hover:not(:disabled){background:var(--you-ink)}
.btn-line{border:1.5px solid var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-quiet{min-height:40px;padding:0 14px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface)}
.btn-quiet:hover{border-color:var(--rule-strong)}
.link-btn{color:var(--you-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.kicker{font-size:var(--t6);font-weight:600;color:var(--muted)}
.serif{font-family:var(--serif)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-panel)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--sunk);font-size:var(--t7);font-weight:650;color:var(--ink-2)}
.tag-ev{background:var(--ev-soft);color:var(--ev-ink)}
.tag-you{background:var(--you-soft);color:var(--you-ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot-you{background:var(--you)}.dot-ev{background:var(--ev)}

/* Home */
.hero{padding-top:clamp(36px,6vw,84px);padding-bottom:clamp(40px,6vw,72px)}
.hero h1{font-size:clamp(44px,5.4vw,78px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0;max-width:none}
.hero-lede{font-family:var(--serif);font-size:clamp(19px,1.7vw,23px);line-height:1.45;color:var(--ink-2);max-width:34em;margin:0 0 30px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{margin-top:26px;font-size:var(--t7);color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact{padding:22px 16px 22px 0}
.fact+.fact{padding-left:24px;border-left:1px solid var(--rule)}
.fact b{display:block;font-size:var(--t2);letter-spacing:-.03em;line-height:1;font-weight:750}
.fact span{font-size:var(--t6);color:var(--muted)}

.section{padding-top:clamp(48px,7vw,96px);padding-bottom:clamp(48px,7vw,96px)}
.section-head{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;margin-bottom:32px}
.section-head h2{font-size:var(--t2);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:780}
.section-head p{margin:0;color:var(--ink-2);font-family:var(--serif);font-size:19px;max-width:32em}

.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pick{text-align:left;padding:18px;min-height:132px;border-radius:var(--r-panel);border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:border-color .15s}
.pick:hover{border-color:var(--rule-strong)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick strong{font-size:19px;letter-spacing:-.02em;line-height:1.15}
.pick small{color:var(--muted);font-size:var(--t7)}
.lengths{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 22px;align-items:center}
.lengths .label{margin-right:8px}
.seg{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-weight:600;font-size:var(--t6)}
.seg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.formats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-panel);overflow:hidden}
.format{background:var(--surface);padding:22px}
.format h3{font-size:17px;margin:12px 0 6px;letter-spacing:-.01em}
.format p{margin:0;color:var(--muted);font-size:var(--t6);line-height:1.5}
.format svg{display:block;height:34px;width:auto}

.dimant{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,5vw,72px);align-items:start}
.dimant h2{font-size:var(--t2);letter-spacing:-.035em;line-height:1.02;margin:0 0 14px}
.dimant p{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin:0 0 14px}
.paper-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.paper-list li{border-bottom:1px solid var(--rule)}
.paper-list button{width:100%;text-align:left;padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline}
.paper-list strong{font-weight:650;letter-spacing:-.01em}
.paper-list small{color:var(--muted);font-size:var(--t7);white-space:nowrap}

/* Play */
.play{padding-top:28px;padding-bottom:64px}
.play-top{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.steps{display:flex;gap:4px;flex:1;min-width:160px}
.steps i{flex:1;height:5px;border-radius:4px;background:var(--rule)}
.steps i.done{background:var(--ink)}
.steps i.now{background:var(--you)}
.play-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:clamp(20px,3vw,40px);align-items:start}
.card{padding:clamp(22px,3vw,40px)}
.case-strip{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.scene{font-family:var(--serif);font-size:clamp(19px,1.6vw,22px);line-height:1.5;color:var(--ink-2);margin:14px 0 22px;max-width:40em}
.q{font-size:var(--t3);line-height:1.15;letter-spacing:-.025em;margin:0 0 22px;font-weight:760}
.hint{font-size:var(--t6);color:var(--muted);margin:-10px 0 16px}
/* options as a ruled list with hanging numerals, not a stack of boxed buttons (redesign, round 36) */
.opts{display:grid;gap:0;border-bottom:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;text-align:left;padding:15px 10px 15px 4px;border:0;border-top:1px solid var(--rule);border-radius:0;background:none;color:var(--ink);transition:background .15s}
.opt:hover:not(:disabled){background:rgba(20,32,58,.045)}
.opt .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:none;color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.opt[aria-pressed="true"]{background:var(--you-soft);font-weight:650}
.opt[aria-pressed="true"] .k{background:var(--you);color:#fff;box-shadow:none}
.opt.is-ev{background:var(--ev-soft)}
.opt.is-ev .k{background:var(--ev);color:var(--ink);box-shadow:none}
.opt .mark{font-size:var(--t7);font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.opt:disabled{cursor:default;opacity:1}

/* Instruments */
.meter{padding:6px 0 4px}
.meter-read{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.meter-read b{font-size:clamp(36px,4vw,54px);letter-spacing:-.03em;line-height:1;color:var(--you-ink);font-variant-numeric:tabular-nums}
.meter-read b.empty{visibility:hidden}   /* the read-out keeps its size before the first touch; the action bar carries the instruction */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(to right,var(--you) var(--fill,50%),var(--rule) var(--fill,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:var(--rule)}
input[type=range]::-moz-range-progress{height:6px;border-radius:4px;background:var(--you)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--you);margin-top:-10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--you)}
input[type=range].untouched::-webkit-slider-thumb{border-color:var(--rule-strong)}
input[type=range].untouched::-webkit-slider-runnable-track{background:var(--rule)}
.axis{display:flex;justify-content:space-between;font-size:var(--t7);color:var(--muted)}
.claim{font-family:var(--serif);font-size:22px;line-height:1.4;margin:0 0 20px;quotes:'“' '”'}.claim::before{content:open-quote}.claim::after{content:close-quote}   /* the claim is set as a quotation: no stripe, no box in a box (rules 7 and 21) */
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank-item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 10px 10px 14px;border:1.5px solid var(--rule);border-radius:var(--r-ctl);background:var(--surface)}
.rank-item .pos{font-weight:800;color:var(--you-ink);font-variant-numeric:tabular-nums}
.rank-move{display:flex;gap:4px}
.rank-move button{width:40px;height:40px;border-radius:var(--r-ctl);border:1px solid var(--rule);font-size:18px;line-height:1}
.rank-move button:hover:not(:disabled){border-color:var(--rule-strong);background:var(--sunk)}
.alloc{display:grid;gap:14px}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 56px;gap:14px;align-items:center}
.alloc-row label{font-weight:600;font-size:15px;line-height:1.3}
.alloc-row output{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.alloc-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:var(--r-ctl);background:var(--sunk);font-weight:650;font-size:var(--t6)}
.alloc-total.ok{background:var(--you-soft);color:var(--you-ink)}
.deleg{display:grid;gap:10px}
.deleg-row{border:1.5px solid var(--rule);border-radius:var(--r-ctl);padding:14px;background:var(--surface)}
.deleg-row p{margin:0 0 10px;font-weight:600;line-height:1.35}
.deleg-opts{display:flex;flex-wrap:wrap;gap:6px}
.deleg-opts button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--rule);font-size:13.5px;font-weight:600}
.deleg-opts button[aria-pressed="true"]{background:var(--you);border-color:var(--you);color:#fff}
.deleg-opts button.is-ev{box-shadow:0 0 0 2px var(--ev)}
.deleg-why{margin:10px 0 0;font-size:var(--t6);color:var(--ink-2);font-family:var(--serif);font-size:16px}
.dag{width:100%;height:auto;display:block;margin:0 0 18px;background:var(--sunk);border-radius:var(--r-ctl)}

/* Side panel */
.side{position:sticky;top:84px;display:grid;gap:14px}
.bet{padding:22px}
.bet h2{font-size:var(--t5);margin:0 0 2px}
.bet p{margin:0 0 12px;color:var(--muted);font-size:var(--t6)}
.bet .btn{width:100%;margin-top:14px}
.bet-note{font-size:var(--t7);color:var(--muted);margin-top:10px;text-align:center}
.stakes{padding:20px}
.stakes dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:var(--t6)}
.stakes dt{color:var(--muted)}
.stakes dd{margin:0;font-weight:600}

/* Reveal */
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.verdict-score{font-size:var(--t6);font-weight:700}
.reveal-title{font-size:var(--t2);line-height:1.02;letter-spacing:-.035em;margin:4px 0 16px;font-weight:800}
.reveal-body{font-family:var(--serif);font-size:clamp(19px,1.5vw,21px);line-height:1.55;color:var(--ink);margin:0 0 22px;max-width:38em}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
.lesson{padding:14px 0 0;border-top:1px solid var(--rule)}
.lesson h3{font-size:var(--t6);margin:0 0 6px}
.lesson p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2)}
.follow{border-top:1px solid var(--rule)}
.follow details{border-bottom:1px solid var(--rule)}
.follow summary{cursor:pointer;padding:14px 0;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:12px}
.follow summary::-webkit-details-marker{display:none}
.follow summary::after{content:'+';font-weight:400;font-size:20px;line-height:1;color:var(--muted)}
.follow details[open] summary::after{content:'–'}
.follow details p{margin:0 0 16px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink-2)}
.next-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.note-box textarea{width:100%;min-height:84px;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:12px;resize:vertical;background:var(--surface);font-family:var(--serif);font-size:17px}

.gap{padding:22px}
.gap h2{font-size:var(--t5);margin:0 0 4px}
.gap-legend{display:flex;gap:16px;font-size:var(--t7);color:var(--ink-2);margin:6px 0 4px;flex-wrap:wrap}
.gap-legend span{display:inline-flex;gap:6px;align-items:center}
.gap svg{width:100%;height:auto;display:block;overflow:visible}
.gap-caption{font-size:var(--t7);color:var(--muted);margin:8px 0 0;line-height:1.5}
.ev-mark{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .4s}
.source-card{padding:20px}
.source-card h3{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.35;margin:8px 0 6px}
.source-card p{margin:0;font-size:var(--t6);color:var(--ink-2)}
.source-card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.status{display:inline-flex;gap:6px;align-items:center;font-size:var(--t7);font-weight:650}
.status{font-weight:650}

.tutor{padding:20px}
.tutor h2{font-size:var(--t5);margin:0 0 4px}
.tutor p.small{font-size:var(--t7);color:var(--muted);margin:8px 0 0}
.tutor-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tutor-chips button{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--rule);text-align:left}
.tutor-line{display:flex;gap:8px;margin-top:6px}
.tutor-line input{flex:1;min-width:0;height:44px;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface)}
.tutor-answer{margin-top:12px;padding:14px;border-radius:var(--r-ctl);background:var(--sunk);font-family:var(--serif);font-size:16.5px;line-height:1.55;white-space:pre-wrap}
.tutor-answer cite{font-style:normal;font-family:var(--sans);font-size:var(--t7);font-weight:650;color:var(--ev-ink)}

/* Atlas */
.atlas-head{padding-top:clamp(36px,5vw,64px);padding-bottom:24px}
.atlas-head h1{font-size:var(--t2);letter-spacing:-.03em;line-height:1;margin:0 0 12px}
.atlas-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;height:48px;border:1px solid var(--rule);border-radius:999px;padding:0 16px;background:var(--surface)}
.search input{flex:1;border:0;background:transparent;height:100%;outline:none;min-width:0}
.search:focus-within{outline:3px solid var(--you);outline-offset:2px}
/* All decisions: a ruled index, one entry per decision; format and area as a phrase, your best score in ink (review 28: rules 2, 4, 18) */
.atlas-grid{display:block;padding-bottom:64px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;row-gap:4px;width:100%;text-align:left;padding:16px 0;border:0;border-top:1px solid var(--rule);border-radius:0;background:none}
.entry:hover .entry-title{color:var(--you-ink)}
.entry .entry-title{grid-column:1;font-weight:750;font-size:18px;line-height:1.25;letter-spacing:-.015em}
.entry .entry-best{grid-column:2;grid-row:1;font-weight:700;color:var(--ink);white-space:nowrap}
.entry .entry-q{grid-column:1/-1;color:var(--ink-2);font-family:var(--serif);font-size:17px;line-height:1.45;max-width:68ch}
.entry .entry-meta{grid-column:1/-1;font-size:var(--t7);color:var(--muted)}

/* Record */
.rec-head{padding-top:clamp(36px,5vw,64px);padding-bottom:8px}
.rec-head h1{font-size:var(--t2);letter-spacing:-.03em;line-height:1;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}
.kpi{padding:18px}
.kpi b{display:block;font-size:var(--t2);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:var(--t6);color:var(--muted)}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:56px}.rec-col{display:grid;gap:0;align-content:start}
.rec-grid{align-items:start}
@media (max-width:820px){.rec-grid>.rec-panel:first-child{grid-row:auto}}
.rec-panel{padding:24px 0 28px;background:none;border:0;border-top:1px solid var(--rule);border-radius:0;box-shadow:none}   /* record sections are rules, not three equal cards */
.rec-panel h2{font-size:var(--t4);margin:0 0 4px}
.rec-panel>p{margin:0 0 12px;color:var(--muted);font-size:var(--t6)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:var(--t6)}
.hist small{color:var(--muted);font-size:12.5px;display:block}
.bar-score{display:inline-block;width:64px;height:6px;border-radius:4px;background:var(--rule);position:relative;vertical-align:middle;margin-left:8px}
.bar-score i{position:absolute;left:50%;top:0;bottom:0;border-radius:4px;background:var(--ink)}.bar-score .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink-2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 64px}

/* Modal, toast */
.modal-back{position:fixed;inset:0;background:rgba(14,22,40,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:var(--r-panel);max-width:640px;width:100%;max-height:min(86vh,800px);overflow:auto;padding:clamp(22px,4vw,36px);position:relative}
.modal h2{font-size:var(--t3);letter-spacing:-.025em;line-height:1.12;margin:6px 40px 12px 0}
.modal p,.modal li{font-family:var(--serif);font-size:17.5px;line-height:1.55;color:var(--ink-2)}
.modal .close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);font-size:20px}
.modal table{border-collapse:collapse;width:100%;font-size:var(--t6)}
.modal td,.modal th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:var(--t6);font-weight:600;transition:.25s;z-index:70;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}

.foot{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:var(--t6);color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot nav{display:flex;gap:16px;flex-wrap:wrap}
.foot button{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.empty-state{padding:40px;text-align:center;color:var(--muted)}

/* Responsive */
@media (max-width:1080px){
  .picker{grid-template-columns:repeat(3,1fr)}
  .formats{grid-template-columns:repeat(2,1fr)}
  .play-grid{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:820px){
  .section-head,.dimant,.rec-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--rule)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .lessons{grid-template-columns:1fr}
  .nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--rule);flex-direction:column;padding:10px var(--gut) 16px}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:12px}
  .menu-btn{display:grid;place-items:center}
}
@media (max-width:560px){
  .paper-list button{grid-template-columns:1fr;gap:4px}
  .picker{grid-template-columns:1fr 1fr}
  .pick{min-height:104px}
  .formats{grid-template-columns:1fr}
  .alloc-row{grid-template-columns:1fr 64px;grid-template-areas:"l o" "s s"}
  .alloc-row label{grid-area:l}.alloc-row output{grid-area:o}.alloc-row input{grid-area:s}
  .opt{grid-template-columns:30px 1fr;}
  .opt .mark{grid-column:2}
  .hero h1{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{.bar,.foot,.side .tutor,.next-row{display:none}body{background:#fff}}

.room-wait{max-width:760px;margin:0 auto}
.room-wait .q{max-width:none}

/* Paths, summary, playbook */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 26px}
.lesson-card{padding:18px}
.lesson-card h3,.lesson-card .card-h{margin:6px 0;font-size:18px;letter-spacing:-.015em}
.lesson-card p{margin:0 0 8px;font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.theme{padding:clamp(20px,3vw,32px);margin-bottom:14px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:24px;row-gap:14px;align-items:start}
.theme-head{display:contents}.theme-head h2{grid-column:1;grid-row:2;align-self:start}.theme-head p{grid-column:2;grid-row:1/span 2}
.theme>.btn{grid-column:1;grid-row:3;justify-self:start;align-self:center}.theme>.theme-more{grid-column:2;grid-row:3;margin:0;align-self:center}
.theme-head h2{font-size:var(--t3);letter-spacing:-.025em;margin:0;line-height:1.1}
.theme-head p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink-2)}
.findings{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--rule)}
.findings li{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:17px;line-height:1.5}
.findings strong{font-family:var(--sans);font-size:15.5px}
.findings small{font-family:var(--sans);font-size:var(--t7);color:var(--muted)}
@media (max-width:820px){.theme{grid-template-columns:1fr}.theme-head h2,.theme-head p,.theme>.btn,.theme>.theme-more{grid-column:1;grid-row:auto}.findings li{grid-template-columns:1fr}}

[tabindex="-1"]:focus{outline:none}
.big-stat{font-size:40px;letter-spacing:-.03em;margin:6px 0;font-weight:800;line-height:1}
.rank-cmp{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rank-cmp li{display:grid;grid-template-columns:1fr 30px 30px;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r-ctl);background:var(--sunk)}
.rc-name{font-weight:600;font-size:14.5px;line-height:1.3}
.rc-name small{display:block;font-weight:500;color:var(--ev-ink);font-size:var(--t7)}

/* ===== Focus mode (one decision per screen, Duolingo-style action bar) ===== */

.tabpanel{min-height:120px}
.deep-text{font-family:var(--serif);font-size:18px;line-height:1.55;color:var(--ink-2);margin:10px 0}
.src-title{font-family:var(--serif);font-size:19px;line-height:1.4;margin:10px 0 4px}

/* Home declutter */

.lib-tabs button{padding:9px 16px;border-radius:999px;font-weight:650;font-size:var(--t6)}

@media (max-width:820px){
  .hero{min-height:0}
  .conf-row{grid-template-columns:minmax(0,1fr) 52px}.conf-row input{min-width:0}.conf-row label{grid-column:1/-1}
  .actionbar-in{flex-wrap:wrap;gap:6px 12px;padding-top:10px}.actionbar-in .kicker{flex:1 1 100%;font-size:13px;line-height:1.3}.actionbar-in .kicker:empty{display:none}.actionbar-in .btn{flex:1}
  .tabs{flex-wrap:wrap;overflow:visible}

}

.axis-svg{width:100%;height:auto;display:block}

.tools{align-items:center;gap:18px}
.tool-links{display:flex;gap:18px;flex-wrap:wrap}
.link-quiet{text-align:left;font-weight:650;color:var(--ink)}
.link-quiet:hover{text-decoration:underline}

.theme-more{margin:0 0 16px}

.conf-row output.empty{color:var(--rule-strong)}
.deleg-why{margin-top:12px}

.focus-card.is-locked .opt[aria-pressed="true"],.focus-card.is-locked .meter-read b,.focus-card.is-locked .rank-item,.focus-card.is-locked .deleg-opts button[aria-pressed="true"]{animation:lockpulse .42s ease-out}
@keyframes lockpulse{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:12px 16px!important;border-radius:var(--r-panel);background:var(--you-soft);color:var(--you-ink);max-width:calc(var(--max) - 2*var(--gut))}
:root{color-scheme:light}

.hbars{display:grid;gap:14px;margin:6px 0 4px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) 70px;grid-template-areas:"l l" "t v";gap:4px 12px;align-items:center}
.hb-label{grid-area:l;font-weight:650;font-size:15px;line-height:1.3}
.hb-row>.hb-track{grid-area:t}.hb-row>b{grid-area:v;font-size:15px;font-weight:800;white-space:nowrap}
.hb-track{height:14px;border-radius:var(--r-ctl);background:var(--sunk);position:relative;overflow:hidden}
.hb-track i{position:absolute;inset:0 auto 0 0;border-radius:var(--r-ctl);background:var(--ink);transform-origin:left}
.hb-track i.ev{background:var(--ev)}.hb-track i.you{background:var(--you)}
.hb-row.two{grid-template-areas:"l l" "t1 v1" "t2 v2"}
.hb-row.two>.hb-track:nth-of-type(2){grid-area:t1}.hb-row.two>b.you{grid-area:v1;color:var(--you-ink)}
.hb-row.two>.hb-track:nth-of-type(3){grid-area:t2}.hb-row.two>b.ev{grid-area:v2;color:var(--ev-ink);font-size:13px}
.grow{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.alloc-cmp .hb-row{grid-template-columns:minmax(0,1fr) 100px}

.gap-claim{font-family:var(--serif);font-size:18px;line-height:1.4;margin:0 0 6px;color:var(--ink-2)}


.alloc-val{display:block;font-weight:600;color:var(--ev-ink);font-size:13px;margin-top:2px}

.lock-note{margin:0 0 14px;padding:10px 14px;border-radius:var(--r-ctl);background:var(--ev-soft);color:var(--ev-ink);font-size:var(--t6);line-height:1.4}

/* untouched inputs: a quiet prompt instead of a big placeholder, and a faint thumb so the start position is not an anchor */
input[type=range].untouched::-webkit-slider-thumb{opacity:.4}
input[type=range].untouched::-moz-range-thumb{opacity:.4}

#start.section{padding-top:clamp(24px,3vw,40px)}
.dimant>div:first-child{position:sticky;top:96px}
.dimant-stat{margin:14px 0 18px;color:var(--muted);font-size:var(--t6)}
@media (max-width:820px){.dimant>div:first-child{position:static}}

/* one dark editorial band: the research behind the game */
.dimant-band{background:var(--ink);color:#fff;max-width:none;padding:clamp(40px,6vw,80px) max(var(--gut),calc((100vw - var(--max))/2 + var(--gut)))}
.dimant-band .dimant h2{color:#fff}.dimant-band .dimant p{color:rgba(255,255,255,.86)}.dimant-band .dimant-stat{color:rgba(255,255,255,.7)}
.dimant-band .paper-list button{color:#fff;border-color:rgba(255,255,255,.18)}.dimant-band .paper-list small{color:rgba(255,255,255,.66)}
.dimant-band .btn-line{color:#fff;border-color:rgba(255,255,255,.6)}
.dimant-band .paper-list li{border-color:rgba(255,255,255,.18)}
/* wide screens: the reveal reads in two columns, the finding beside the evidence */
@media (min-width:1200px){
  .focus:has(.reveal){max-width:1240px}
  .focus:has(.reveal) .focus-top{max-width:none}
  .reveal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);column-gap:56px;align-items:start;grid-auto-flow:row dense}   /* dense: a live-class panel in the right column no longer pushes the finding down (audit 42) */
  .reveal>*{grid-column:1}
  .reveal>figure.gap{grid-column:2;grid-row:1/span 7;margin-top:0}
  .reveal>section.gap{grid-column:2}
  .reveal>.deep{grid-column:1/-1;margin-top:40px}   /* below both columns: no dead quadrant beside the questions (review 31) */
  .reveal>.deep .tabpanel:has(.follow){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);column-gap:56px;align-items:start}
  .reveal>.deep .tabpanel:has(.follow) .tutor{margin-top:0}
  .focus:has(.reveal) .actionbar-in{max-width:1240px}
  /* the question screen uses the same two columns: the question on the left, your answer beside it (owner, 2026-11-01: fill the space) */
  .focus:has(.q-col){max-width:1240px}
  .focus:has(.q-col) .actionbar-in{max-width:1240px}
  .focus-card:has(.q-col){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);column-gap:56px;align-items:start}
  .focus-card:has(.q-col)>.lock-note{grid-column:1/-1}
  .a-col{padding-top:8px;align-self:center}   /* the instrument sits level with the question, not stranded at the top (review 32, m10) */
}

/* numeric reveal: the two numbers are the moment */
.gap-head{display:grid;grid-template-columns:auto auto 1fr;align-items:end;gap:6px 36px;margin:2px 0 14px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.gh-cell span{display:block;font-size:var(--t7);color:var(--ink-2);margin-bottom:4px}

@media (max-width:520px){.gap-head{grid-template-columns:1fr 1fr}.gh-gap{grid-column:1/-1;justify-self:start}}

/* causal reveal: the links arrive one at a time */
@keyframes edIn{from{opacity:0}to{opacity:1}}
.dag .ed{opacity:0;animation:edIn .3s ease forwards}
@media (prefers-reduced-motion:reduce){.dag .ed{opacity:1;animation:none}}

.conf-line{margin:-4px 0 12px;font-size:var(--t6);color:var(--ink-2)}

/* phone: the reveal tabs scroll sideways instead of wrapping */
@media (max-width:640px){.deep .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.deep .tabs::-webkit-scrollbar{display:none}.deep .tabs [role=tab]{flex:none}}

/* ===== editorial pass (iteration 20) ===== */

/* evidence plate: the study's figure is the reveal's centrepiece */
.gap .hbars{gap:18px}
.gap .hb-label{font-size:16px}
.gap .hb-track{height:22px;border-radius:var(--r-ctl)}
.gap .hb-track i{border-radius:var(--r-ctl);background:rgba(20,32,58,.32)}
.gap .hb-track i.ev{background:var(--ev)}
.gap .hb-track i.you{background:var(--you)}

.gap .hb-row{grid-template-columns:minmax(0,1fr) 84px}
.plate-h{font-size:var(--t7);font-weight:750;color:var(--ev-ink);margin:0 0 10px}


/* projector: a dark stage around white cards */
body.projector{background:#0f1830}
body.projector .join-banner{background:#16223f;border-color:#2a3a63;color:#fff}

body.projector .join-code{color:#fff}

.deleg-cmp li.ok>span:first-child::before{content:"✓";color:var(--good);font-weight:800;margin-right:8px}
.gap:has(.deleg-cmp) .gap-legend{display:flex}
.score-row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}.spark{width:278px;height:56px;margin-bottom:14px}
/* causal diagrams sit on a faint lab grid, so the factors read as a board waiting for its links */
.dag{background:none;border:0}
.plate-more{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.plate-more .small{font-size:var(--t7);color:var(--muted);margin:8px 0 0}
/* library: each principle shows how much of it the player has opened */
.theme-head p.locked{font-size:17px;color:var(--muted);font-style:italic}
.theme-meter{display:block;height:6px;border-radius:4px;background:var(--sunk);margin:14px 0 6px;overflow:hidden;max-width:320px}

.theme{padding:clamp(18px,2.4vw,26px)}
.gap .hb-row:nth-child(2) .grow{animation-delay:.12s}.gap .hb-row:nth-child(3) .grow{animation-delay:.24s}.gap .hb-row:nth-child(4) .grow{animation-delay:.36s}
/* verdict: the first thing read after the call, set as a statement rather than a pill */
.verdict .tag{font-size:15px;font-weight:800;padding:6px 14px;border-radius:999px;background:var(--ink);color:#fff;letter-spacing:-.005em}
.verdict .tag.tag-ev{background:var(--ev);color:var(--ink)}
.verdict .num{font-size:15px;font-weight:750}

.axis-svg .ax-track{stroke:#cbd3dd}.axis-svg .ax-band{fill:#fbefd2;stroke:#e0a01c}.axis-svg .ax-gap{stroke:#14203a}
.axis-svg .ax-you{fill:#1f3cc2}.axis-svg .ax-ev{fill:#7d5200}.axis-svg .ax-tick{fill:#56617a}

/* ===== the evidence plate: the reveal's signature, a dark panel carrying the paper's numbers ===== */
.gap.has-plate{padding:0;overflow:hidden;background:var(--surface)}

.plate .hb-track{background:rgba(255,255,255,.12)}

.plate .hb-track i.ev{background:#f0b43c}.plate .hb-track i.you{background:#8ea4ff}
.plate .hb-track i.ev.ns{background:transparent;box-shadow:inset 0 0 0 2px #f0b43c}

.plate .axis-svg .ax-you{fill:#a9b9ff}.plate .axis-svg .ax-ev{fill:#f0b43c}.plate .axis-svg .ax-tick{fill:#b9c4dd}

.plate .rank-cmp small,.plate .alloc-val{color:#f0b43c}

.plate .chip.you{background:#2f54eb;color:#fff}.plate .chip.ev{background:#f0b43c;color:#14203a}
.plate .gap-legend .tag{background:#f0b43c;color:#14203a}
.study-card{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:0;padding:18px 22px 20px;border-top:1px solid var(--rule)}

/* hero demo on the same dark plate as the reveal's evidence: the page's one bold surface */

/* qa/DESIGN_RULES.md 11: balanced headings, no orphans */

icle page","text_url":"https://pure.eur.nl/en/publications/41e6a6cd-516e-47c1-94ac-e939a166758f"}},"yin24":{"id":"yin24","authors":"Yin, Jia & Wakslak","authors_full":"Yidan Yin, Nan Jia, Cheryl J. Wakslak","year":2024,"title":"AI can help people feel heard, but an AI label diminishes this impact","venue":"Proceedings of the National Academy of Sciences","volume":"121(14)","pages":"e2319112121","doi":"10.1073/pnas.2319112121","url":"https://doi.org/10.1073/pnas.2319112121","kind":"peer-reviewed","takeaway":"AI-written replies made people feel more heard than human replies, but labeling a reply as AI made people feel less heard.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"Full text via Europe PMC open-access XML","text_url":"https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10998586/fullTextXML"}},"reif25":{"id":"reif25","authors":"Reif, Larrick & Soll","authors_full":"Jessica A. Reif, Richard P. Larrick, Jack B. Soll","year":2025,"title":"Evidence of a social evaluation penalty for using AI","venue":"Proceedings of the National Academy of Sciences","volume":"122(19)","pages":"e2426766122","doi":"10.1073/pnas.2426766122","url":"https://doi.org/10.1073/pnas.2426766122","kind":"peer-reviewed","takeaway":"People who get help from AI are rated lazier and less competent than those who get other help, and employees anticipate this and hide AI use.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"Full text via Europe PMC open-access XML","text_url":"https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12088386/fullTextXML"}},"cui26":{"id":"cui26","authors":"Cui et al.","authors_full":"Kevin Zheyuan Cui, Mert Demirer, Sonia Jaffe, Leon Musolff, Sida Peng, Tobias Salz","year":2026,"title":"The Effects of Generative AI on High-Skilled Work: Evidence from Three Field Experiments with Software Developers","venue":"Management Science" ugs but significant and persistent for lotteries.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched Crossref record","text_read":"abstract (Crossref)"}},"huberman06":{"id":"huberman06","authors":"Huberman & Jiang","authors_full":"Gur Huberman, Wei Jiang","year":2006,"title":"Offering versus Choice in 401(k) Plans: Equity Exposure and Number of Funds","venue":"Journal of Finance","volume":"61(2)","pages":"763-801","doi":"10.1111/j.1540-6261.2006.00854.x","url":"https://doi.org/10.1111/j.1540-6261.2006.00854.x","kind":"peer-reviewed","takeaway":"In real 401(k) records, participants split contributions evenly across the few funds they use, but their equity share moves little with the share of equity funds offered.","verification":{"status":"verified_abstract","checked":"2026-10-31","metadata":"matched RePEc record of the published article","text_read":"Published abstract (IDEAS/RePEc)"}},"manylabs14":{"id":"manylabs14","authors":"Klein et al.","year":2014,"title":"Investigating variation in replicability: A “Many Labs” replication project","venue":"Social Psychology","volume":"45(3)","pages":"142-152","doi":"10.1027/1864-9335/a000178","url":"https://doi.org/10.1027/1864-9335/a000178","kind":"peer-reviewed","takeaway":"Across 36 samples, 10 of 13 classic effects replicated consistently; anchoring came out larger than originally reported.","verification":{"status":"verified_full_text","checked":"2026-10-31","metadata":"journal, volume and pages printed on the article","text_read":"published article PDF (Hogrefe layout), University of Padova repository copy","text_url":"https://research.unipd.it/bitstream/11577/2688304/1/ManyLabs.2014.SP.fulltext.pdf"}}},"challenges":[{"id":"ai01","track":"AI × Business","concept":"Productivity","tag":"01 / WORK","title":"Writing with ChatGPT","scene":"In an online experiment, 453 professionals complete short occupation-specific writing tasks; half are randomly given access to ChatGPT.","question":"How much less time did the ChatGPT group take?","answerTitle":"40% less time","explain":"Across 453 professionals, average completion time fell 40%.","implication":"Pilot AI on measurable tasks. Track quality as well as speed.","boundary":"Short, incentivized, occupation-specific writing tasks done online by 453 college-educated professionals.","sources":["noy23"],"visual":"bars","values":[100,60],"labels":["Without AI","With AI"],"unit":"relative time","follow":[{"q":"Who took part?","a":"453 college-educated professionals, each given occupation-specific, incentivized writing tasks typical of their job."},{"q":"Who gained the most?","a":"Participants with weaker writing skills benefited most, so the gap between stronger and weaker workers narrowed."},{"q":"Did quality improve too?","a":"Yes. Graders rated the ChatGPT group’s work higher as well; how much higher is a separate decision in this game."}],"format":"estimate","weight":1,"estimate":{"target":40,"min":0,"max":60,"tolerance":5,"label":"Decrease in completion time (%)"},"theme":"ai-work","study":{"design":"Preregistered online experiment","n":"453 college-educated professionals"}},{"id":"ai02","track":"AI × Business","concept":"Productivity","tag":"02 / QUALITY","title":"Faster, but worse?","scene":"In an online experiment, 453 professionals did short writing tasks for their occupation, half with ChatGPT. Independent professionals graded the finished work blind.","question":"By how much did graded quality change with ChatGPT?","answerTitle":"Quality improved 18%","explain":"Noy and Zhang gave half of 453 college-educated professionals access to ChatGPT for occupation-specific writing tasks. Graded output quality rose 18%, and inequality between workers decreased.","implication":"Set up double-outcome tests, with blind quality evaluation.","boundary":"Occupation-specific, incentivized writing tasks for 453 college-educated professionals.","sources":["noy23"],"visual":"bars","values":[100,118],"labels":["Without AI","With AI"],"unit":"quality index","follow":[{"q":"Did quality really improve?","a":"Yes. Average output quality rose 18%."},{"q":"Which tasks?","a":"Midlevel professional writing tasks matched to each participant’s occupation."},{"q":"Who took part?","a":"453 college-educated professionals in a preregistered online experiment, randomly given access to ChatGPT or not."}],"format":"estimate","weight":1,"estimate":{"target":18,"min":0,"max":100,"tolerance":4,"label":"Increase in quality (%)"},"theme":"ai-work","study":{"design":"Preregistered online experiment","n":"453 college-educated professionals"}},{"id":"ai07","track":"AI × Business","concept":"Creativity","tag":"07 / IDEAS","title":"Stories written with AI","scene":"Writers receive ideas from a generative AI system before producing stories.","question":"Which two results did the study find?","options":["AI-assisted stories were more similar to each other","AI help made stories less enjoyable to read","AI-assisted stories were rated more creative","Gains were largest for the most creative writers"],"answerTitle":"A creativity trade-off","explain":"Doshi and Hauser’s 293 writers produced stories rated 8.1% more novel and 9.0% more useful with access to up to five AI ideas. Those stories were also more similar to each other, a shift worth 8.9% of the similarity range.","implication":"Evaluate distinctiveness across your full campaign, not only each asset.","boundary":"Online writers produced eight-sentence stories with no AI ideas, one AI idea, or up to five AI ideas.","sources":["doshi24"],"visual":"scatter","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was in the study?","a":"293 writers recruited on Prolific each wrote an eight-sentence story. A separate group of 600 participants rated the stories."},{"q":"How large was the creativity gain?","a":"With access to up to five AI ideas, rated novelty rose 8.1% and usefulness 9.0% compared with writers who had no AI help."},{"q":"Who benefited most?","a":"Writers who scored lowest on a creativity test: with up to five AI ideas, their stories’ novelty rose 10.7%. The most creative writers saw little effect."}],"format":"multi","weight":1,"multiAnswers":[0,2],"theme":"ai-work","study":{"design":"Online experiment","n":"293 writers and 600 evaluators"},"permuted":true,"chart":{"labels":["More novel","More useful","More similar to each other"],"values":[8.1,9.0,8.9],"unit":"%","highlight":2,"note":"Stories by writers with access to up to five AI ideas, against writers without; similarity as a share of its range.","decimals":1}},{"id":"ai09","track":"AI × Business","concept":"Trust in AI","tag":"09 / TRUST","title":"The model that erred","scene":"A prediction model outperforms a human forecaster but makes visible errors.","question":"After seeing the model err, whom did people choose for paid forecasts?","options":["Themselves, though the model beat them","The model, more often than before the error","The model, since it beat them","Each about half of the time"],"answer":0,"answerTitle":"Seeing the model err drove people away from it","explain":"In Dietvorst, Simmons and Massey’s Study 1, 65% of participants who saw no forecasts bet on the model. After seeing both the model’s and their own forecasts, only 23% did, although people made 15 to 29% more error than the model.","implication":"Communicate expected error rates and compare human and model performance symmetrically.","boundary":"Incentivized forecasts of MBA students’ performance and US states’ airline-passenger ranks, by lab and online participants.","sources":["diet15"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who took part?","a":"Participants in the Wharton Behavioral Lab (Studies 1, 2, 4) and on Mechanical Turk (Studies 3a, 3b), with final samples of 206 to 1,036 per study."},{"q":"How much better was the model?","a":"Human forecasts had 15 to 29% more error than the model when predicting MBA students’ performance, and 90 to 97% more when ranking states by airline passengers."},{"q":"Was real money at stake?","a":"Yes. Lab participants could earn up to $10 extra for accurate forecasts. In Study 1 they earned $1 each time the forecast they relied on was within 5 percentiles."},{"q":"Why do other studies find people prefer algorithms?","a":"Designs differ. Here people watched the model make errors before choosing. Studies in which advice is only labeled as coming from an algorithm, and never seen to fail, test a different situation; one of them is a decision of its own in the lab."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Five incentivized forecasting experiments (lab and online)","n":"206 to 1,036 participants per study"},"permuted":true,"chart":{"labels":["Saw no forecast results","Saw own results only","Saw the model’s results only","Saw both sets of results"],"values":[65,63,26,23],"unit":"%","highlight":3,"note":"Share who chose the model to forecast, Study 1."}},{"id":"ai10","track":"AI × Business","concept":"Trust in AI","tag":"10 / ADVICE","title":"Advice from a person or a program","scene":"People estimated a person’s weight from a photo, then saw an advice estimate and could revise. The same advice was labeled as coming from other people for some and from an algorithm for others. With human-labeled advice, they moved 30% of the way toward it.","question":"How likely is it that the study found this?","answerTitle":"45% of the way, versus 30% for human advice","explain":"Weight on advice averaged 0.45 when the advice was labeled algorithmic and 0.30 when labeled human, for identical advice.","implication":"Check whether experienced staff discount model advice; in this study, experts who relied less on the algorithm were less accurate.","boundary":"Six experiments, mostly with lay participants, on estimation and forecasting tasks; one tested experienced forecasters.","sources":["logg19"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What tasks were used?","a":"Numeric estimates about a visual stimulus, and forecasts of song popularity and romantic attraction, across six experiments."},{"q":"Did experts behave the same way?","a":"No. Experienced professionals who forecast regularly relied less on algorithmic advice than lay people did, and that hurt their accuracy."},{"q":"When did the preference fade?","a":"It weakened when people had to choose between the algorithm’s estimate and their own, rather than weighing advice from an outside source."}],"format":"forecast","weight":1,"theme":"ai-trust","study":{"design":"Six experiments","n":"Lay participants, plus one study of experienced forecasters"},"chart":{"labels":["Labeled as people","Labeled as an algorithm"],"values":[30,45],"unit":"%","highlight":1,"note":"Weight on the advice, by its label (Experiment 1A)."},"forecast":{"claim":"People moved further toward identical advice when it was labeled as other people’s rather than an algorithm’s.","truth":false}},{"id":"ai11","track":"AI × Business","concept":"Trust in AI","tag":"11 / FIT","title":"Two jobs for an algorithm","scene":"In online lab and field studies, people decided whether to rely on an algorithm or a person for different tasks, from recommending a product for its practical use to judging an aesthetic preference.","question":"For which task were people more reluctant to rely on an algorithm?","options":["Judging a personal aesthetic preference","Recommending a product for its practical use","Reliance was about the same for both"],"answer":0,"answerTitle":"People relied on algorithms less for matters of taste","explain":"Castelo, Bos and Lehmann ran four online lab studies with over 1,400 participants and two field studies with over 56,000. People trusted and used algorithms less for tasks that seem subjective; making a task seem more objective raised reliance.","implication":"For taste-based recommendations, explain the measurable inputs the algorithm uses, which makes the task seem more objective.","boundary":"Online lab and field studies of consumers’ reliance on algorithms for tasks seen as subjective or objective.","sources":["cast19"],"visual":"matrix","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How much evidence is there?","a":"Four online lab studies with over 1,400 participants and two online field studies with over 56,000."},{"q":"Can the aversion be reduced?","a":"Yes. Making a task seem more objective increased trust in, and use of, algorithms for that task."},{"q":"What if the task stays subjective?","a":"Presenting the algorithm as having more humanlike emotional ability increased its use for subjective tasks."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Four online lab studies and two online field studies","n":"Over 1,400 lab and over 56,000 field participants"},"permuted":true},{"id":"ai12","track":"AI × Business","concept":"Trust in AI","tag":"12 / PERSONALIZATION","title":"Medical advice from AI","scene":"Consumers choose between medical care, such as diagnoses and recommendations, from an AI provider or from a human provider.","question":"What mainly drove consumers’ resistance?","options":["It cannot account for each patient’s uniqueness","It feels less accountable when it errs","Its handling of health data feels unsafe"],"answer":0,"answerTitle":"People fear AI ignores what makes them unique","explain":"Longoni, Bonezzi and Morewedge traced resistance to uniqueness neglect: consumers doubt an AI provider can account for their unique characteristics and circumstances. Resistance was stronger among people who saw themselves as more unique and disappeared when AI care was framed as personalized.","implication":"Present AI as supporting a clinician’s or advisor’s decision, and say how it adapts to each person’s case.","boundary":"Consumers choosing between AI and human providers of medical care, in real and hypothetical choices.","sources":["long19"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the resistance look like?","a":"In real and hypothetical choices, consumers were less likely to use AI care, would pay less for it, and were less sensitive to differences in provider quality."},{"q":"What removed the resistance?","a":"It disappeared when AI care was framed as personalized, when the care was for someone else, or when AI supported a human provider’s decision instead of replacing it."},{"q":"What drives the resistance?","a":"Uniqueness neglect: the worry that an AI provider cannot account for a person’s unique characteristics and circumstances as well as a human provider can."}],"format":"choice","weight":1,"theme":"ai-trust","study":{"design":"Series of consumer choice experiments"},"permuted":true},{"id":"biz01","track":"Business","concept":"Defaults","tag":"13 / DESIGN","title":"The enrollment default","scene":"A US firm switched its 401(k) from sign-up-yourself to automatic enrollment for new hires. Among the earlier cohort, who had to opt in, 37% participated at similar tenure.","question":"What share of the automatically enrolled hires participated?","answerTitle":"86% under the default, against 37%","explain":"At 3 to 15 months of tenure, 86% of automatically enrolled hires participated, against 37% of the previous cohort who had to sign up.","implication":"Make enrollment in beneficial programs the default, with easy opt-out, and track take-up by employee group.","boundary":"New hires at one Fortune 500 health care and insurance firm, compared with the cohort hired just before the switch.","sources":["defaults01","cribb20"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How fast did enrollment build?","a":"Under automatic enrollment, 86% of employees were in the 401(k) after 3 to 15 months, against 37% of those not enrolled automatically."},{"q":"Who gained the most?","a":"Gains were largest among groups with low participation before: Black and Hispanic employees, younger workers, and lower-paid employees. The gap between women and men nearly disappeared."},{"q":"What kind of company was it?","a":"A large, publicly traded Fortune 500 firm in health care and insurance. The plan’s economic features did not change, only the default."}],"format":"estimate","weight":1,"theme":"choice","estimate":{"target":86,"min":0,"max":100,"tolerance":5,"label":"Participation under automatic enrollment","unit":"%"},"chart":{"labels":["Had to opt in","Enrolled by default"],"values":[37,86],"unit":"%","highlight":1,"note":"Share enrolled in the savings plan at 3 to 15 months of tenure."},"study":{"design":"Natural experiment in one firm","n":"Employees of a large US corporation"}},{"id":"biz02","track":"Business","concept":"Defaults","tag":"14 / FRICTION","title":"The sticky default","scene":"After automatic enrollment, a large share of new hires kept both the default contribution rate and the default fund, a combination few earlier hires had chosen.","question":"Why did so many keep the default?","options":["Inertia, and the default read as advice","The employer match required the default rate","Few employees knew they could change it, and few asked"],"answer":0,"answerTitle":"People took the default as advice","explain":"Madrian and Shea found that many employees hired under automatic enrollment kept both the default contribution rate and the default fund, a pairing few earlier hires chose. They trace this to inertia and to employees reading the default as investment advice.","implication":"Set default contribution rates at the level you would recommend, since most enrollees keep whatever rate you choose.","boundary":"Contribution rates and fund choices of new hires at one US firm, measured in their first months of tenure.","sources":["defaults01"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Did many keep the default rate?","a":"Yes. A substantial share of employees hired under automatic enrollment kept the default contribution rate, which few earlier hires had chosen."},{"q":"Did they keep the default fund too?","a":"Yes. Many also kept the default fund allocation, an outcome few employees hired before the switch picked."},{"q":"What does this mean for plan design?","a":"The default sets the saving rate as well as participation, so choose a default contribution rate you would recommend."}],"format":"choice","weight":1,"theme":"choice","study":{"design":"Natural experiment in one firm","n":"New hires and earlier cohorts at one Fortune 500 firm"},"permuted":true},{"id":"biz04","track":"Business","concept":"Replication","tag":"16 / CONTEXT","title":"Does the towel sign travel?","scene":"A famous US study found hotel guests reused more towels when a sign said most guests do, especially guests of the same room. Researchers repeated the test in two German hotels.","question":"How likely is it that the study found this?","answerTitle":"Both signs helped; the norm sign did no better","explain":"Bohner and Schlüter repeated the test in two German hotels. In the first, with 724 observations, norm signs combined reached 81.9% reuse against 83.7% for the standard environmental sign; in the second hotel, the environmental sign reached 93.3% versus 76.5% for the norm signs combined.","implication":"Before rolling out a famous nudge, test it against the plain message you would otherwise use as well as against doing nothing.","boundary":"Two hotels in Germany; later meta-analyses report modest, consistent effects of norm messages across studies.","sources":["bohner14","hotel08","nisa17"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the original study find?","a":"Goldstein, Cialdini and Griskevicius (2008) found that a sign saying most guests reuse towels beat a standard environmental appeal, and that a same-room norm worked best."},{"q":"So do norm messages work at all?","a":"Modestly. A 2017 meta-analysis of hotel studies described the social-norms effect as weaker than earlier estimates but consistent."},{"q":"What should a manager compare against?","a":"The message you would send anyway. Here, any sign beat no sign, which a test against silence would have mistaken for a norm effect."}],"format":"forecast","weight":1,"theme":"evidence","study":{"design":"Field replication","n":"Guests of two German hotels"},"forecast":{"claim":"In the German hotels, the norm sign beat the standard environmental sign.","truth":false},"chart":{"labels":["No sign","Standard environmental sign","Norm signs (combined)"],"values":[64.3,93.3,76.5],"unit":"%","highlight":2,"note":"Towel reuse rate, second hotel."}},{"id":"biz05","track":"Business","concept":"Norms","tag":"17 / BACKFIRE","title":"Feedback for thrifty homes","scene":"A household already uses less electricity than its neighbors. It receives feedback showing the higher neighborhood average.","question":"Which two results did the study find?","options":["Some already-efficient households raised usage","The smiley made above-average households use more","Above-average homes raised their usage","A smiley face kept efficient homes steady"],"answerTitle":"A norm message can backfire","explain":"Schultz and colleagues gave usage feedback to 290 San Marcos households. Below-average homes shown only the neighborhood average raised daily use from 10.15 to 11.13 kWh over the longer term; adding a smiley-face approval cue held them at baseline.","implication":"When sending peer comparisons, add explicit approval for customers already doing better than average, and check in a pilot whether low users drift up.","boundary":"Two doorhanger messages to 290 California households, with electricity read from meters over about four weeks.","sources":["energy07"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was in the study?","a":"290 households in San Marcos, California, with visible electricity meters; 287 stayed in the analysis."},{"q":"How large was the boomerang?","a":"Below-average households that saw only the neighborhood average rose from 10.38 to 11.27 kWh per day in the first week, and stayed higher three weeks later."},{"q":"Did heavy users keep saving?","a":"Above-average households given only the average cut 1.22 kWh per day in the first week. Over the longer term their use was 21.29 kWh per day against a 22.32 baseline, a drop that was not statistically significant."}],"format":"multi","weight":1,"multiAnswers":[0,3],"theme":"choice","study":{"design":"Field experiment","n":"290 households in San Marcos, California"},"permuted":true,"chart":{"labels":["Average only: before","Average only: weeks later","Average + smiley: before","Average + smiley: weeks later"],"values":[10.15,11.13,10.04,10.14],"unit":"","highlight":1,"note":"Daily electricity use of below-average homes, kWh."}},{"id":"biz07","track":"Business","concept":"Innovation","tag":"19 / PROCESS","title":"Fixing a slow process","scene":"In experiments, people were asked to improve things such as a Lego structure, a mini-golf hole or a written essay, and could change them however they liked.","question":"Which kind of fix do people tend to miss?","options":["Adding a review step","Removing an existing step","Automating an existing step"],"answer":1,"answerTitle":"Subtraction is often missed","explain":"In Adams, Converse, Hales and Klotz’s experiment 4, only 21% of uncued participants listed any subtractive idea for improving a mini-golf hole. Reminded that they could add or subtract, 48% did.","implication":"Make “What can we remove?” mandatory in process reviews.","boundary":"Eight experiments with puzzles and design tasks in which removing an element was an advantageous change.","sources":["subtract21"],"visual":"flow","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What tasks did people solve?","a":"Problems such as stabilizing a Lego structure, improving a miniature golf course, and transforming a grid pattern. Most people added a block to the Lego structure rather than removing one."},{"q":"How many people took part?","a":"Hundreds of participants across eight experiments, each solving a different improvement problem."},{"q":"What helped people spot subtractions?","a":"Being cued to consider subtraction, and having several chances rather than one to see that adding was not working."}],"format":"choice","weight":1,"theme":"choice","study":{"design":"Eight experiments"},"permuted":true,"chart":{"labels":["No reminder","Reminded to add or subtract"],"values":[21,48],"unit":"%","highlight":0,"note":"Share listing at least one idea that removes something, experiment 4."}},{"id":"biz08","track":"Business","concept":"Innovation","tag":"20 / COGNITIVE LOAD","title":"Under pressure","scene":"In one experiment, people improved a pattern on a grid; some did it while keeping track of a second task at the same time.","question":"How likely is it that the study found this?","answerTitle":"Pressure favors additions","explain":"Across eight experiments, Adams, Converse, Hales and Klotz found people were less likely to spot helpful subtractive changes under higher cognitive load, and also when nothing cued subtraction or when they had only one chance to notice it.","implication":"Schedule deliberate simplification sessions with fewer distractions.","boundary":"Cognitive load was manipulated in controlled experiments on puzzle and design tasks.","sources":["subtract21"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Does a second try help?","a":"Yes. People found subtractive improvements more often when they had several opportunities, rather than one, to notice that adding was not working."},{"q":"Which real problems do the authors link this to?","a":"Overloaded schedules, institutional red tape, and damage to the environment."},{"q":"Was this a single study?","a":"No. It was one of eight experiments that all pointed to a default toward adding."}],"format":"forecast","weight":1,"theme":"choice","study":{"design":"Eight experiments","n":""},"forecast":{"claim":"People juggling other tasks were more likely to overlook improvements that remove something.","truth":true}},{"id":"biz11","track":"Business","concept":"Judgment","tag":"23 / NUMBERS","title":"The wheel of fortune","scene":"People spun a wheel that landed on 10 or 65, then estimated the share of UN member countries that are African. The group that saw 65 gave a median of 45%.","question":"What median estimate did the group that saw 10 give?","answerTitle":"25%, pulled down by a random number","explain":"Median estimates were 25% after the wheel showed 10 and 45% after it showed 65, though everyone could see the number was random.","implication":"In negotiations and forecasts, write down your own estimate before you see anyone else’s number.","boundary":"People estimating percentages after watching a wheel produce a visibly random number; paying for accuracy did not reduce the effect.","sources":["anchor74"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What exactly did people do?","a":"The wheel was spun in front of them. They first said whether the true value was higher or lower than the number, then gave their own estimate."},{"q":"Does anchoring show up in calculations too?","a":"Yes. High school students given 5 seconds estimated 1x2x...x8 at a median of 512 and 8x7x...x1 at 2,250. The correct answer is 40,320."},{"q":"Are experts immune?","a":"No. The authors note that experienced researchers are prone to the same biases when they think intuitively."}],"format":"estimate","weight":1,"theme":"choice","estimate":{"target":25,"min":0,"max":100,"tolerance":5,"label":"Median estimate after seeing 10","unit":"%"},"chart":{"labels":["Wheel showed 10","Wheel showed 65"],"values":[25,45],"unit":"%","highlight":1,"note":"Median estimate of the share of African countries in the UN, by the number the wheel showed."},"study":{"design":"Classroom experiment"}},{"id":"social01","track":"Culture & Society","concept":"Norm distributions","tag":"27 / CULTURE","title":"Tight, loose or split","scene":"Two teams have the same average cooperation. In one, behavior is tightly clustered around the average; in the other, it is widely spread out.","question":"Which two results did the experiments find?","options":["Loose norms generated more behavioral variation","The spread of behavior shaped choices","Polarized norms pulled choices toward the middle","Tight norms produced the most extreme choices"],"answerTitle":"The spread of others’ behavior changed choices","explain":"Dimant, Gelfand, Hochleitner and Sonderegger showed about 1,200 Americans co-player behavior with the same mean but different spreads. Choices tracked the spread: contribution variance was 1.26 after a tight norm and 1.65 after a loose one.","implication":"Report the spread and clustering of team behavior alongside averages in culture and engagement dashboards.","boundary":"Two-player contribution game with 1,203 US adults, varying the shape of the norm while holding its average fixed.","sources":["norms24"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did participants actually do?","a":"They played a two-player public goods game. Each could contribute up to four tokens; contributions were multiplied by 1.4 and shared."},{"q":"Who took part?","a":"About 1,200 US participants recruited on Prolific, representative by age, gender, and ethnicity."},{"q":"Why does this matter for a manager?","a":"Two teams with the same average norm can behave very differently once the spread of views differs, so report the spread as well as the mean."}],"format":"multi","weight":1,"multiAnswers":[0,1],"theme":"norms","study":{"design":"Online experiment, two-player contribution game (6 treatments)","n":"1,203 US adults (representative sample)"},"permuted":true,"chart":{"labels":["Saw a tight norm","Saw a loose norm"],"values":[1.26,1.65],"unit":"","highlight":1,"note":"Variance of contributions after seeing others’ choices."}},{"id":"social04","track":"Culture & Society","concept":"Pluralistic ignorance","tag":"30 / TEAM DYNAMICS","title":"Comfort with campus drinking","scene":"Students rated their own comfort with campus drinking and the comfort of the average student at their university.","question":"What did students report?","options":["Peers were as comfortable as they were","Peers were more comfortable than they were","Peers were less comfortable with drinking than they were"],"answer":1,"answerTitle":"Private views and public beliefs diverge","explain":"In all four of Prentice and Miller’s studies, students rated their peers as more comfortable with campus drinking than they were themselves. Over a semester, men shifted their own attitudes toward that mistaken norm; women did not.","implication":"Elicit private views before public discussion.","boundary":"Four studies of college students’ own attitudes toward campus alcohol use and their estimates of peers’ attitudes.","sources":["plural93"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who was studied?","a":"College students, across four studies, who rated their own comfort with campus drinking and estimated the average student’s comfort."},{"q":"Did beliefs change over time?","a":"In a study that followed students over a semester, men shifted their attitudes toward the norm they mistakenly perceived. Women did not."},{"q":"What did feeling out of step cost?","a":"Students who saw themselves as deviant felt more alienated from campus, even though that deviance was illusory."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Four studies, one following students over a semester","n":"College students"},"permuted":true},{"id":"social07","track":"Culture & Society","concept":"Norm pluralism","tag":"33 / COALITIONS","title":"Drawing a party’s norm","scene":"Members of a political party agree on its headline position. Researchers asked members to draw how views are spread within their party.","question":"What did drawing each party’s norm reveal?","options":["Near-uniform views held by members of each party","Two opposed camps within each party","Several coexisting views within each party"],"answer":2,"answerTitle":"Each party holds several distinct views","explain":"Among 996 US respondents, Panizza, Dimant, Kimbrough and Vostroknutov recovered several views within each party. Agreement ranged from 95% of Democrats including the same view on same-sex rights in their drawings to only 50% of Republicans on gun policy.","implication":"Before engaging a stakeholder group, map the distinct views inside it and estimate each view’s share.","boundary":"One incentivized online survey of 996 US respondents on seven political issues, compared with a standard single-norm measure.","sources":["plural24"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who answered?","a":"996 US respondents on Prolific, stratified by age, gender, and political orientation."},{"q":"Which issues were covered?","a":"Abortion, same-sex rights, marijuana legalization, federal spending, gun violence, immigration, and energy investments."},{"q":"How does norm-drawing work?","a":"Respondents sketch the views different subgroups might hold and estimate the share holding each. Pay depends on how close their guesses come."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Incentivized online survey","n":"996 US respondents"},"permuted":true,"chart":{"labels":["Democrats on same-sex rights","Republicans on gun policy"],"values":[95,50],"unit":"%","highlight":1,"note":"Share of a party including the same view in their drawing, the highest and the lowest issue."}},{"id":"social08","track":"Culture & Society","concept":"Networks","tag":"34 / DIFFUSION","title":"Which network spreads change?","scene":"In an online health community, researchers built networks that were either clustered (neighbors share neighbors) or random (more long-range ties), then seeded a health behavior.","question":"How likely is it that the study found this?","answerTitle":"Reinforcement can beat reach","explain":"In Centola’s online experiment with 1,528 participants, a health behavior reached 53.77% of people in clustered networks but only 38.26% in random networks, and it spread more than four times faster through the clustered ones.","implication":"Launch hard-to-adopt practices inside tightly connected teams, so each person hears about them from several colleagues.","boundary":"1,528 anonymous online participants in constructed networks deciding whether to register for a health forum.","sources":["cent10"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How much farther did it spread?","a":"The behavior reached 53.77% of people in clustered networks, against 38.26% in random networks."},{"q":"How much faster?","a":"Diffusion in clustered networks was more than four times faster than in random ones."},{"q":"Did reinforcement affect follow-through?","a":"Yes. Fewer than 15% of adopters who got one signal returned to the forum, against over 30% of those who got two."}],"format":"forecast","weight":1,"theme":"forecasting","study":{"design":"Online network experiment, six trials","n":"1,528 participants"},"forecast":{"claim":"Behavior spread farther through random long ties than through clustered ties.","truth":false},"chart":{"labels":["Clustered networks","Random networks"],"values":[53.77,38.26],"unit":"%","highlight":0,"note":"Share of people who adopted the health behavior."}},{"id":"social10","track":"Culture & Society","concept":"Replication","tag":"36 / TEAM IQ","title":"Does turn-taking make groups smart?","scene":"A 2010 Science paper reported a general “collective intelligence” factor in groups, linked to members’ social sensitivity and to equal turn-taking in conversation. Independent researchers ran their own groups.","question":"How likely is it that the study found this?","answerTitle":"Turn-taking did not predict it; members’ IQ did","explain":"In the independent replication, members’ individual IQ largely accounted for differences in group performance, and the turn-taking and share-of-women effects were not supported.","implication":"Treat team-composition recipes from single studies as hypotheses. Track your own teams’ results before redesigning how meetings run.","boundary":"Lab groups on standardized tasks. The original team’s later meta-analysis of 22 studies supports a collective intelligence factor, so the debate continues.","sources":["bates17","team10","riedl21"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What did the original paper claim?","a":"Woolley et al. (2010) reported a general factor across group tasks, correlated with average social sensitivity, equal turn-taking and the share of women."},{"q":"Is the whole idea dead?","a":"No. The original team’s 2021 meta-analysis supports the factor and points to social perceptiveness, while independent analyses find it weaker or explained by members’ IQ."},{"q":"Why does replication matter here?","a":"Team-design advice spread widely from the original paper. When an independent test fails on the key predictors, the advice should wait for more evidence."}],"format":"forecast","weight":1,"theme":"evidence","study":{"design":"Independent lab replications"},"forecast":{"claim":"Groups with more equal conversational turn-taking scored higher on collective intelligence.","truth":false}},{"id":"social12","track":"Culture & Society","concept":"Bias","tag":"38 / HIRING","title":"Identical résumé, different name","scene":"In a field experiment, comparable résumés were assigned names signaling different racial identities.","question":"Approximately how much higher was the callback rate for White-sounding names?","answerTitle":"50% more callbacks","explain":"Bertrand and Mullainathan answered Boston and Chicago help-wanted ads with fictitious résumés randomly given African-American- or White-sounding names. White names received 50 percent more callbacks, and callbacks responded more to résumé quality for White names.","implication":"Run periodic paired-résumé audits of your own screening, comparing callbacks for identical profiles with different names.","boundary":"Fictitious résumés sent to sales, administrative, clerical, and customer-service ads in Boston and Chicago, 2001 to 2002.","sources":["resume04"],"visual":"bars","values":[100,150],"labels":["Black-sounding","White-sounding"],"unit":"callback rate index","follow":[{"q":"Was the gap the same across jobs?","a":"Yes. The racial gap was uniform across occupation, industry and employer size."},{"q":"Did a stronger résumé close the gap?","a":"No. Better credentials raised callbacks much less for African-American names than for White names."},{"q":"Did “Equal Opportunity Employer” ads differ?","a":"No. Employers who listed that label in their ads discriminated as much as other employers."}],"format":"estimate","weight":1,"estimate":{"target":50,"min":0,"max":130,"tolerance":10,"label":"Callback advantage (%)"},"theme":"fairness","study":{"design":"Field experiment (résumé audit)","n":"Fictitious résumés sent to help-wanted ads in Boston and Chicago"}},{"id":"social13","track":"Culture & Society","concept":"Bias","tag":"39 / HIRING","title":"Screens at auditions","scene":"Orchestra auditions begin concealing candidates’ identity behind screens.","question":"What did the authors estimate for women?","answerTitle":"Favorable to women, with some imprecise estimates","explain":"Goldin and Rouse estimate that the screen raised by 50 percent the chance a woman advanced from certain preliminary rounds, and that blind auditions explain about 30 percent of the rise in women among new hires. Some estimates are imprecise.","implication":"Hide names and other identity cues in early screening rounds, then compare pass rates by group before and after.","boundary":"Orchestra audition records; the authors report large standard errors for several estimates, and one effect ran in the opposite direction.","sources":["blind00"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How precise were the estimates?","a":"Mixed. The authors note that some estimates are imprecise and one effect persistently runs against women; they judge that the weight of the evidence favors women."},{"q":"What did the authors conclude?","a":"That blind auditions fostered impartiality in hiring and contributed to the rising share of women in orchestras."},{"q":"How was this measured?","a":"With actual audition records, comparing the same musicians across auditions with and without a screen."}],"format":"choice","weight":1,"theme":"fairness","study":{"design":"Panel of audition records (individual fixed effects)","n":"Musicians auditioning at major US orchestras"},"permuted":true,"options":["About 50% likelier to advance from some rounds; several estimates imprecise","About 50% likelier to advance, with precise estimates throughout","Little change in who advanced; several estimates imprecise","Less likely to advance once screened"],"answer":0},{"id":"social14","track":"Culture & Society","concept":"Bias","tag":"40 / CONTACT","title":"Why did they stay away?","scene":"White and Black participants were asked how interested they were in contact with the other group, and why each side might hold back.","question":"How did each group explain the hesitation?","op
