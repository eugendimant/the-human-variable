tions":["Own side fears rejection; other lacks interest","Own side lacks interest; other fears conflict","Each side blamed its own lack of interest"],"answer":0,"answerTitle":"The misreading can be mutual","explain":"Across seven studies, Shelton and Richeson found that White and Black participants wanted more contact with the other group but believed it did not. Each explained its own hesitation by fear of racial rejection and the other side’s by lack of interest.","implication":"Have managers make the first cross-group introduction, so neither side has to risk reaching out first.","boundary":"Seven studies of White and Black participants’ interest in interracial contact and how they explained avoidance.","sources":["contact05"],"visual":"network","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who took part?","a":"White and Black participants, across seven studies."},{"q":"Why call it pluralistic ignorance?","a":"Both groups privately wanted more contact, yet each wrongly believed the other group did not."},{"q":"Did the researchers go beyond attitudes?","a":"Yes. One study examined the behavioral consequences of the bias, and a final study tested a way to reduce it based on the extended contact hypothesis."}],"format":"choice","weight":1,"theme":"fairness","study":{"design":"Seven studies","n":"White and Black participants"},"permuted":true},{"id":"judg02","track":"Judgment","concept":"Loss aversion","tag":"42 / CONTRADICTION","title":"Is loss aversion a law?","scene":"A workshop leader says: “Losses always hurt more than equal gains feel good.”","question":"Which two statements fit the loss-aversion evidence?","options":["Loss aversion held steady when gamble ranges changed","Loss aversion can reverse in experiments","The distributions of outcomes can matter"],"answerTitle":"It is not a universal law","explain":"Experiments have found that apparent loss aversion can disappear or reverse when distributions change.","implication":"Before applying a 2:1 loss-aversion rule to pricing, test how customers respond to the gains and losses they actually face.","boundary":"Accept-or-reject choices on 50/50 money gambles, mostly hypothetical, with Mechanical Turk workers and Warwick students.","sources":["loss15"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How was loss aversion measured?","a":"People accepted or rejected 50/50 gambles offering a gain and a loss. The researchers varied the ranges from which gains and losses were drawn."},{"q":"Who took part?","a":"Three online experiments with Mechanical Turk workers (323 to 401 analyzed) using hypothetical gambles, and one lab study with 82 Warwick participants playing for real money."},{"q":"Has the reversal held up?","a":"It is contested. Andre and de Langhe (2021) showed the conditions used different gambles; comparing only shared gambles removes the pattern."}],"format":"multi","weight":1,"multiAnswers":[1,2],"theme":"choice","study":{"design":"Four experiments (three online, one lab)","n":"1,106 MTurk workers and 82 lab participants analyzed"},"permuted":true},{"id":"social15","track":"Culture & Society","concept":"Polarization","tag":"49 / IDENTITY","title":"Hate or love?","scene":"Across 15 experiments, Trump supporters and opponents rated how close they felt to each side, then chose whether to give money to, or take money from, members of each side.","question":"Where did in-group love and out-group hate show up?","options":["Hate showed in feelings, love in behavior","Love showed in feelings, hate in behavior","Love and hate showed mainly in feelings"],"answer":1,"answerTitle":"Closer to allies, but no more generous to them","explain":"In Dimant’s experiments, Trump supporters and opponents felt far closer to their own side (78.1%) than to a group-mate who shared only a painting preference (about 39%), yet gave allies about the same (14.97% versus 13.54%). A painting out-group still received 11.99%; from political opponents, people took 22.9%.","implication":"When teams distrust each other, measure how they actually treat each other, not only how they feel about each other.","boundary":"Incentivized behavioral experiments with US Trump supporters and opponents, plus a sports-identity comparison.","sources":["hate23"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"How large was the evidence base?","a":"Five preregistered studies with 15 behavioral experiments and over 8,600 participants."},{"q":"Was this about politics alone?","a":"The studies compared political identity with other political and nonpolitical identities."},{"q":"Which outcomes counted as behavior?","a":"How people helped, harmed and cooperated with members of each group in incentivized games."},{"q":"Which games were these?","a":"Giving and taking games, in which one person moved money to or from another; a public goods game in the same project measured cooperation separately."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Five preregistered studies, 15 behavioral experiments","n":"Over 8,600 participants"},"permuted":true,"chart":{"labels":["Given to allies","Given to a painting group-mate"],"values":[14.97,13.54],"unit":"%","highlight":0,"note":"Share of the endowment given; allies got about as much as a group-mate who shared only a painting preference."}},{"id":"social16","track":"Culture & Society","concept":"Polarization","tag":"50 / INTERVENTIONS","title":"Nudges across the divide","scene":"A leader offers prosocial defaults and normative messages to participants divided by political identity.","question":"Which two results did the nudges produce?","options":["The interventions improved prosociality","The nudges closed the partisan gap on most measures","Measured polarization gaps persisted","The default failed; norms worked"],"answerTitle":"General improvement, persistent gap","explain":"With a default nudge, Dimant shows that taking from political opponents fell from about 20% of the endowment to essentially 0%, and giving to allies rose from about 10–15% to 25–35%. The ally-opponent difference stayed statistically reliable.","implication":"Track between-group gaps as a separate metric when testing interventions, since average cooperation can rise while the gap stays.","boundary":"Default and norm nudges tested in incentivized giving and cooperation games with US Trump supporters and opponents.","sources":["hate23"],"visual":"bars","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Which nudges were tested?","a":"A default nudge and a norm nudge that gave descriptive information about others’ behavior."},{"q":"How large was the evidence base?","a":"Five preregistered studies with 15 experiments and over 8,600 participants."},{"q":"What does this mean for a manager?","a":"Raising overall goodwill can leave the gap between groups in place, so track the gap itself, not only the average."}],"format":"multi","weight":1,"multiAnswers":[0,2],"theme":"norms","study":{"design":"Five preregistered studies, 15 behavioral experiments","n":"Over 8,600 participants"},"permuted":true},{"id":"social20","track":"Culture & Society","concept":"Measurement","tag":"54 / MEASUREMENT","title":"Same average, two teams","scene":"Two departments report the same average rating of how acceptable a practice is. You suspect their norms still differ.","question":"How do you check whether their norms differ?","options":["Ask each team’s manager to describe the norm","Compare how often each team breaks the rule","Compare each team’s most common answer","Ask each person how views are spread across colleagues"],"answer":3,"answerTitle":"Keep the whole distribution","explain":"Dimant’s method elicits, with incentives, each person’s belief about the full distribution of views instead of the mean or most common view, so a unified team and one split into opposing camps can be told apart.","implication":"In culture surveys, ask each person how views are spread across colleagues, not only what the typical view is.","boundary":"A short methods paper presenting an incentive-compatible survey tool that measures each person’s perceived norm distribution.","sources":["measure23"],"visual":"distribution","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"What do standard norm measures capture?","a":"The average or most frequent behavior or opinion in a given context."},{"q":"Why pay respondents?","a":"The method is incentive-compatible, so respondents are rewarded for reporting their real beliefs about how views are spread."},{"q":"Can a team use it?","a":"Yes. The paper comes with ready-made Qualtrics software."}],"format":"choice","weight":1,"theme":"norms","study":{"design":"Methods paper (measurement tool)","n":""},"permuted":true},{"id":"judg05","track":"Judgment","concept":"Decision framing","tag":"56 / AMBIGUITY","title":"Same numbers, other frame","scene":"A disease will kill 600 people. Framed as lives saved, 72% chose a sure plan (200 saved) over a gamble. Others saw the same plans framed as deaths: 400 die for sure, or a one-third chance nobody dies.","question":"In the deaths frame, what share chose the gamble?","answerTitle":"78% gambled once the frame was losses","explain":"With identical outcomes, 72% chose the sure option when it was framed as lives saved; 78% chose the gamble when the same options were framed as deaths.","implication":"In investment memos, state each option’s outcomes as both gains and losses before the team decides.","boundary":"Stanford and UBC students choosing between hypothetical public-health programs in a classroom questionnaire.","sources":["frame81"],"visual":"split","values":[],"labels":["Alternative","Observed pattern"],"unit":"","follow":[{"q":"Who answered?","a":"Students at Stanford and the University of British Columbia, in brief classroom questionnaires: 152 saw the lives-saved version and 155 the deaths version."},{"q":"Do experts fall for it too?","a":"Yes. The authors report the same reversal in other groups, including university faculty and physicians."},{"q":"Why does the frame flip choices?","a":"People tend to avoid risk when outcomes are described as gains and to take risk when they are described as losses."}],"format":"estimate","weight":1,"theme":"choice","estimate":{"target":78,"min":0,"max":100,"tolerance":5,"label":"Share choosing the gamble in the deaths frame","unit":"%"},"chart":{"labels":["Gamble, lives-saved frame","Gamble, deaths frame"],"values":[28,78],"unit":"%","highlight":1,"note":"Share choosing the gamble, by frame."},"study":{"design":"Survey experiment","n":"152 and 155 students"}},{"id":"axb01","track":"AI × Business","format":"delegate","concept":"Human-AI synergy","title":"Who should have the final say?","scene":"You are designing workflows for two AI-supported tasks. A meta-analysis of 106 experiments shows when humans plus AI beat either one working alone. The two tasks below are the worked examples the authors use to illustrate that pattern.","question":"For each task, who should do the work?","delegate":{"choices":["Human and AI together","Human alone","AI alone"],"tasks":[{"text":"Flag fake hotel reviews: AI is 73% accurate, staff 55%","answer":2,"why":"In this example the human-AI team scored 69%, below the AI alone at 73%."},{"text":"Classify bird photos: staff are 81% accurate, AI 73%","answer":0,"why":"Here the human-AI team reached 90%, beating both humans and AI alone."}]},"answerTitle":"Combine only where humans beat the AI","explain":"Across 370 effect sizes, human-AI teams did worse on average than the better of the human or the AI working alone. They gained when the human was the better performer and lost when the AI was.","implication":"Benchmark humans and AI separately before adding a human review layer; skip that layer where the AI alone is clearly stronger.","boundary":"Covers experiments published January 2020 to June 2023 across very different tasks; the averages describe that range of tasks.","sources":["vaccaro24"],"study":{"design":"Systematic review and meta-analysis","n":"106 experiments, 370 effect sizes"},"follow":[{"q":"Do humans with AI beat humans alone?","a":"Yes. Against humans alone, human-AI systems performed better on average. The losses appear only against the better of the two."},{"q":"Which task types lost most?","a":"Decision tasks, where people choose from a fixed set of options, showed losses. Creation tasks trended positive, though not reliably."},{"q":"Where do the review and bird numbers come from?","a":"Both come from Cabrera, Perer and Hong (2023), which the authors discuss to show how relative skill drives synergy."}],"theme":"ai-work"},{"id":"axb02","track":"AI × Business","format":"choice","concept":"Algorithm aversion","title":"Control over the model","scene":"In an incentivized task, people forecast students’ math percentiles. They may use an imperfect model that outperforms human forecasts, but each group gets different rules for adjusting it.","question":"Which group chose to use the model least often?","options":["Could adjust each forecast by up to 2","Could use the model only unchanged","Could adjust each forecast by up to 10"],"answerTitle":"Any control beats none; size barely matters","explain":"In Study 2, 47% used the unchangeable model versus 68% to 71% when they could adjust it by 2, 5 or 10 percentiles. The adjustable groups (68% to 71%) did not differ meaningfully.","implication":"Let staff make small, bounded adjustments to model outputs instead of mandating the outputs unchanged.","boundary":"Online and lab forecasting of student test percentiles with small bonuses.","sources":["dietvorst18"],"study":{"design":"Incentivized online experiment (Study 2 of 3)","n":"816 participants"},"follow":[{"q":"Did adjusting hurt accuracy?","a":"No. Because more people used the model, participants who could modify it forecast more accurately as a result, the authors report."},{"q":"What about a 5-percentile limit?","a":"Also 71%, the same as the 10-percentile limit. More freedom did not raise uptake."},{"q":"Did the effect carry over?","a":"Yes. Being able to modify the model raised satisfaction, belief that the model was superior, and willingness to use algorithms for later forecasts."}],"theme":"ai-trust","chart":{"labels":["Could use the model only unchanged","Could adjust by up to 2","Could adjust by up to 5","Could adjust by up to 10"],"values":[47,68,71,71],"unit":"%","highlight":0,"note":"Share who chose to use the model, Study 2."},"answer":1},{"id":"axb03","track":"AI × Business","format":"estimate","concept":"Machine prediction","title":"Same jail rate, less crime","scene":"Judges decide whether defendants await trial at home or in jail, partly by predicting crime risk. Researchers train a machine-learning model on past cases and simulate letting it rank defendants.","question":"Holding the jailing rate fixed, how much could crime fall?","estimate":{"target":24.7,"min":0,"max":40,"tolerance":3,"label":"Maximum crime reduction at the same jailing rate","unit":"%"},"answerTitle":"Up to 24.7% less crime","explain":"Simulations showed crime reductions up to 24.7% with no change in jailing rates, or jailing cuts up to 41.9% with no rise in crime.","implication":"Audit high-volume screening decisions with a prediction model and estimate how many errors you could cut at today’s approval rate.","boundary":"Policy simulations on past bail cases; crime outcomes exist only for released defendants.","sources":["kleinberg18"],"study":{"design":"Machine-learning policy simulation on court records","n":"Pretrial bail decisions (administrative data)"},"follow":[{"q":"Couldn’t the model just copy judges’ choices?","a":"Crime is observed only for defendants judges released. The authors use methods such as quasi-random assignment of cases to judges to compare fairly."},{"q":"What about racial disparities?","a":"The authors report these gains can be achieved while also reducing racial disparities."},{"q":"Is there another way to use the gain?","a":"Yes. Hold crime constant and jail fewer people: jailing could fall up to 41.9% with no increase in crime."}],"theme":"ai-trust"},{"id":"axb04","track":"AI × Business","format":"estimate","concept":"Mechanical prediction","title":"The formula versus the expert","scene":"A meta-analysis compares expert clinicians’ predictions about human health and behavior with predictions from statistical formulas.","question":"On average, how much more accurate were the formulas?","estimate":{"target":10,"min":0,"max":60,"tolerance":2,"label":"Average accuracy advantage of formulas over experts","unit":"%"},"answerTitle":"About 10% more accurate","explain":"Across 136 studies, formulas were about 10% more accurate on average. Experts were substantially more accurate in only 6% to 16% of studies.","implication":"For repeated predictions from structured data, make a validated scoring rule the default and log every expert override.","boundary":"Studies of clinical and behavioral prediction up to 2000 using statistical formulas; many studies showed ties.","sources":["grove00"],"study":{"design":"Meta-analysis","n":"136 studies"},"follow":[{"q":"Did experience help the experts?","a":"No. The formula advantage held across judgment tasks, types of judges, judges’ experience and types of data."},{"q":"Do interviews give experts an edge?","a":"The reverse. Clinical predictions did relatively worse when predictors included clinical interview data."},{"q":"How often did formulas win clearly?","a":"Formulas substantially outperformed experts in 33% to 47% of studies. In many others the two were about equally accurate."}],"theme":"ai-trust"},{"id":"axb05","track":"AI × Business","format":"causal","concept":"Proxy bias","title":"Who gets extra care?","scene":"A health system uses a widely sold algorithm to choose patients for an extra-care program.","question":"Why were Black patients flagged less than equally sick White patients?","options":["Less is spent on Black patients at equal need","The model used zip code as a proxy for race","The model had too little training data","Race was an input to the model"],"answer":0,"dag":{"alt":"Health need and race both affect spending. The risk score is trained to predict spending, so lower spending on Black patients lowers their scores at the same need.","height":200,"nodes":[{"id":"race","label":"Race","x":80,"y":50},{"id":"need","label":"Health need","x":80,"y":150},{"id":"cost","label":"Spending","x":260,"y":100,"mask":true},{"id":"score","label":"Risk score","x":440,"y":100}],"edges":[["need","cost"],["race","cost","q"],["cost","score"]]},"chart":{"labels":["Current algorithm","If the spending gap were removed (simulated)"],"values":[17.7,46.5],"unit":"%","highlight":1,"note":"Share of Black patients flagged for extra help."},"answerTitle":"Cost was a biased proxy for need","explain":"Less money is spent caring for Black patients, so predicted cost understated their need. Removing the disparity would raise their share of extra help from 17.7% to 46.5%.","implication":"Before deploying a model, confirm its target measures what you care about, and audit outcomes by group at equal scores.","boundary":"One widely used commercial algorithm in US health care; the size of the bias depends on spending gaps in each system.","sources":["obermeyer19"],"study":{"design":"Audit of a widely used health-care risk algorithm","n":"Patients at one large academic hospital"},"follow":[{"q":"What fixed it?","a":"Reformulating the algorithm so it no longer used costs as a proxy for needs eliminated the racial bias in predicting who needs extra care."},{"q":"How large was the bias?","a":"At a given risk score, Black patients were sicker than White patients, and the bias cut the number of Black patients identified for extra care by more than half."},{"q":"Why did cost seem a sensible target?","a":"The authors note that health-care cost appears to be an effective proxy for health on many measures, which made the problem easy to miss."}],"theme":"fairness","permuted":true},{"id":"axb06","track":"AI × Business","format":"forecast","concept":"Hiring discretion","title":"When managers overrule the test","scene":"Fifteen firms hiring low-skilled service workers introduce a job test that scores applicants. Managers can still hire against its recommendations.","question":"How likely is it that the study found this?","forecast":{"claim":"Hires made against the test’s recommendation more often turned out worse.","truth":true},"answerTitle":"Overruling the test went with worse hires","explain":"Across 15 firms that introduced job testing for low-skilled service workers, Hoffman, Kahn and Li found that managers facing similar applicant pools who hired against test recommendations ended up with worse average hires.","implication":"Track override rates by manager, compare outcomes of overridden hires, and require a written reason for each override.","boundary":"Low-skilled service jobs at 15 firms adopting job testing.","sources":["hoffman18"],"study":{"design":"Observational study of job-test adoption","n":"15 firms"},"follow":[{"q":"Why do managers overrule?","a":"The authors conclude managers often overrule test recommendations because they are biased or mistaken, not mainly because they hold better information."},{"q":"What tradeoff does the firm face?","a":"More weight on test scores can cut bias and error but may discard useful private information held by managers. Here the first effect dominated."},{"q":"How were managers compared?","a":"The authors compared managers facing similar applicant pools, so differences in overrides did not come from differences in who applied."}],"theme":"ai-trust"},{"id":"axb07","track":"AI × Business","format":"forecast","concept":"AI detection","title":"Spot the AI profile","scene":"Readers see self-descriptions written for job, hospitality and dating profiles. Some were written by people, others by an AI language model.","question":"How likely is it that the study found this?","forecast":{"claim":"People told AI-written from human-written self-descriptions apart well above chance.","truth":false},"answerTitle":"Detection was at chance: 50 to 52%","explain":"Across experiments with 4,600 participants, people identified the source with only 50 to 52% accuracy, relying on cues like first-person pronouns and family topics.","implication":"Do not count on reviewers to spot AI-written applications or reviews; set disclosure rules and verify claims directly.","boundary":"Short self-presentations in professional, hospitality and dating contexts, judged by online participants.","sources":["jakesch23"],"study":{"design":"Six online experiments","n":"4,600 participants, 7,600 self-presentations"},"follow":[{"q":"Did paying for accuracy help?","a":"No. In the dating context half the participants were offered a $3 accuracy bonus, with no difference in performance."},{"q":"Can AI text seem more human than human?","a":"Yes. Text optimized against people’s cues was judged human 65.7% of the time, versus 51.7% for real human text."},{"q":"Which cues misled people?","a":"First-person pronouns, contractions and family topics were read as signs of a human writer, but they did not reliably indicate one."}],"theme":"persuasion"},{"id":"axb08","track":"AI × Business","format":"allocate","concept":"AI persuasion","title":"Who argues your case?","scene":"In 10-minute online debates on assigned topics, people faced either a human or GPT-4. Some opponents also received basic demographic details about the person they debated. The options below are compared with debates between two people.","question":"Which opponent clearly beat human-human debates at shifting agreement?","options":["GPT-4","GPT-4 with demographic profile","Human with demographic profile"],"answerTitle":"Personalized GPT-4 was most persuasive","explain":"Versus human-human debates, personalized GPT-4 raised the odds of higher post-debate agreement by 81.2%. GPT-4 without profiles and personalized humans showed no significant effect.","implication":"Treat customer data fed to persuasive AI as a governed input; review consent and disclosure before using it in sales.","boundary":"Short structured online debates with assigned positions and basic demographics.","sources":["salvi25"],"study":{"design":"Preregistered online experiment","n":"900 participants"},"follow":[{"q":"How often did personalized GPT-4 win?","a":"In pairs where the two sides were not equally persuasive, personalized GPT-4 was more persuasive 64.4% of the time."},{"q":"Could people tell they faced an AI?","a":"Often. Participants identified AI opponents in about three of four cases; for human opponents, identification was near chance."},{"q":"Did humans use the profile well?","a":"No. Humans given the same demographic details were not significantly more persuasive (−15.7%, not statistically significant)."}],"theme":"persuasion","permuted":true,"allocate":{"total":100,"step":1,"label":"Points placed","prefix":"","suffix":"","values":[0,81.2,0],"valueLabels":["+21.9% (not significant)","+81.2%","−15.7% (not significant)"],"valueName":"change in odds of higher agreement than in human-human debates (non-significant changes count as zero)","best":[1]}},{"id":"axb09","track":"AI × Business","format":"forecast","concept":"AI disclosure","title":"The cost of an AI label","scene":"In experiments, people rated true and false headlines. Some carried an “AI-generated” label, including true headlines written by people.","question":"How likely is it that the study found this?","answerTitle":"Less believed and less shared","explain":"Across 4,976 participants, the label cut perceived accuracy and sharing whether headlines were true or false, human- or AI-made. The effect was three times smaller than a ‘false’ label.","implication":"If you label AI use, state what the AI did; vague labels read as full automation and penalize accurate content.","boundary":"Headlines shown to US and UK online participants; the penalty disappeared when labels came with weak or medium definitions of AI involvement.","sources":["altay24"],"study":{"design":"Two preregistered online experiments","n":"4,976 participants (US, UK)"},"follow":[{"q":"Why the penalty?","a":"Readers expected AI-labeled headlines to be written entirely by AI. Without a definition, they leaned toward assuming full automation."},{"q":"Can wording fix it?","a":"In Study 2 the labels had no significant effect when readers got weak or medium definitions. The penalty remained with no definition or a strong one."},{"q":"Are human-made headlines hit too?","a":"Yes. Human-made headlines wrongly labeled as AI-generated were also rated lower."}],"theme":"persuasion","forecast":{"claim":"Labeling headlines “AI-generated” lowered belief in them even when the headlines were true and written by people.","truth":true}},{"id":"axb10","track":"AI × Business","format":"choice","concept":"Overreliance","title":"Designing AI advice","scene":"People make decisions with help from an AI that is usually right but sometimes wrong. Designers test different ways of presenting its advice.","question":"Which design best cut agreement with wrong AI advice?","options":["Showing the AI’s confidence with each suggestion","Plain explanations with each suggestion","Engaging users before the AI answers"],"answer":2,"answerTitle":"Forcing functions worked, but users disliked them","explain":"Among 199 participants, cognitive forcing designs significantly reduced overreliance compared with simple explainable-AI designs. The most effective designs received the least favorable ratings.","implication":"On high-stakes calls, have reviewers record their own judgment before AI output appears, and plan for user pushback.","boundary":"One online decision task; benefits were larger for people higher in Need for Cognition, who enjoy effortful thinking.","sources":["bucinca21"],"study":{"design":"Online experiment","n":"199 participants"},"follow":[{"q":"Who benefited most?","a":"Participants higher in Need for Cognition, who enjoy effortful thinking, benefited more from the interventions."},{"q":"What is the catch?","a":"People gave the least favorable ratings to the designs that reduced overreliance most, a tradeoff between performance and user preference."},{"q":"What were the forcing designs?","a":"Three interventions built to compel people to engage more thoughtfully with the AI’s suggestions and explanations before relying on them."}],"theme":"ai-trust","permuted":true},{"id":"axb11","track":"AI × Business","format":"multi","concept":"Recommender trust","title":"Jokes, friends and algorithms","scene":"People rate a set of jokes. Then a stranger, a friend, a family member or a recommender system predicts which new jokes they will find funny.","question":"Which two findings did the study report?","options":["The algorithm beat strangers but not friends","The algorithm beat strangers, friends and family","People preferred relying on human recommenders","Spouses and family beat the algorithm","People found the algorithm easier to understand"],"multiAnswers":[1,2],"answerTitle":"More accurate, yet people preferred humans","explain":"Yeomans, Shah, Mullainathan and Kleinberg found recommender systems predicted which jokes people would find funny better than strangers, friends or family did. People still preferred human recommenders, partly because the human process felt easier to understand.","implication":"When launching a recommender, explain in plain terms why it suggests each item; accuracy alone will not win adoption.","boundary":"Joke preferences, a taste domain where humans have many advantages.","sources":["yeomans19"],"study":{"design":"Experiments comparing human and algorithmic recommenders","n":"Participants rating jokes (several studies)"},"follow":[{"q":"Why jokes?","a":"The authors chose a domain where human recommenders have many advantages, which makes the algorithm’s win a hard test."},{"q":"Why did people resist?","a":"Partly because they believed the human recommendation process was easier to understand than the algorithm’s."},{"q":"What do the authors recommend?","a":"Accuracy is not enough. Recommender systems must also be understood if people are to rely on them."}],"theme":"ai-trust","permuted":true},{"id":"axb12","track":"AI × Business","format":"choice","concept":"Algorithmic bias","title":"Who saw the STEM ad?","scene":"A firm runs a gender-neutral ad promoting STEM careers and lets the platform’s algorithm deliver it cost-effectively. Fewer women than men end up seeing it.","question":"What best explains the gap?","options":["Women scrolled past the ads more often","Showing ads to young women costs more","The ad copy appealed more to men","The algorithm learned women click less"],"answer":1,"answerTitle":"Young women cost more to reach","explain":"Lambrecht and Tucker found that a gender-neutral STEM job ad reached fewer women than men because younger women cost more to reach. An algorithm optimizing cost-effectiveness crowded them out, and the same pattern held on other major platforms.","implication":"Audit who actually sees your recruiting ads and set reach targets by group rather than pure cost optimization.","boundary":"One field test of how STEM career ads were delivered, with the same pattern on other major platforms.","sources":["lambrecht19"],"study":{"design":"Field test of ad delivery","n":"One STEM career ad campaign"},"follow":[{"q":"Was anyone trying to discriminate?","a":"No. The ad was intended to be gender neutral; the gap came from an algorithm that simply optimized cost-effectiveness."},{"q":"Is this one platform’s quirk?","a":"The authors report the same regularity extends to other major digital platforms."},{"q":"What does crowding out mean here?","a":"Other advertisers value younger women highly, so reaching them costs more, and a cost-minimizing campaign reaches fewer of them."}],"theme":"fairness","permuted":true},{"id":"axb13","track":"AI × Business","format":"forecast","concept":"Customer spillovers","title":"Do customers notice the AI?","scene":"A firm rolled out a generative-AI assistant that suggests replies to its customer-support agents, in stages across 5,172 agents.","question":"How likely is it that the study found this?","forecast":{"claim":"After agents got AI assistance, customers became less likely to ask for a manager.","truth":true},"answerTitle":"Customers got politer and escalated less","explain":"With AI assistance, customers were more polite and less likely to ask to speak to a manager, alongside a 15% average rise in issues resolved per hour.","implication":"Track escalation rates and customer tone in AI pilots; part of the payoff may show up in supervisors’ time.","boundary":"One firm’s customer-support chat operation, with a staggered rollout across agents.","sources":["bry25"],"study":{"design":"Staggered rollout (quasi-experiment)","n":"5,172 support agents"},"follow":[{"q":"Which problems gained most?","a":"Gains were largest for moderately rare problems, where agents had less experience but the system still had enough training data."},{"q":"Did agents learn from it?","a":"The authors find AI assistance facilitated worker learning and improved English fluency, especially among international agents."},{"q":"Did the job get better?","a":"The authors report AI assistance improved the experience of work along several dimensions."}],"theme":"ai-work"},{"id":"axb14","track":"AI × Business","format":"estimate","concept":"Inside the frontier","title":"How much faster with GPT-4?","scene":"BCG consultants work on 18 realistic tasks for a fictional footwear company, such as new product ideas and a press release. Some are randomly given GPT-4.","question":"How much faster did consultants with AI finish?","estimate":{"target":25.1,"min":0,"max":40,"tolerance":3,"label":"Speed gain on inside-frontier tasks","unit":"%"},"answerTitle":"25.1% faster, with more tasks done","explain":"Consultants with GPT-4 completed 12.2% more tasks and worked 25.1% faster. Graded quality rose 33.9% with GPT-4 and a prompt-engineering overview, and 29.9% with GPT-4 alone.","implication":"Pilot AI on drafting and ideation first, and measure speed, completion and blind-graded quality together.","boundary":"One firm’s consultants on designed tasks for a fictional company; on a task outside the frontier, AI users were less often correct.","sources":["dell26"],"study":{"design":"Preregistered field experiment","n":"758 BCG consultants"},"follow":[{"q":"Who gained most?","a":"The bottom-half-skill consultants benefited most, though above-average consultants also benefited meaningfully."},{"q":"Did prompt training matter?","a":"Somewhat. Quality rose 33.9% with a prompt-engineering overview versus 29.9% with GPT-4 alone."},{"q":"Is there a downside?","a":"Yes. The same study built a task outside the frontier, where AI users did worse; the “Leading with AI” case covers that result."}],"theme":"ai-work"},{"id":"rollout1","track":"AI × Business","format":"choice","case":{"id":"rollout","title":"Rolling out an AI assistant","step":1,"of":4},"concept":"Targeted rollout","title":"Who gets the assistant first?","scene":"A firm rolled out a generative-AI reply assistant to its customer-support agents in waves. You decide which agents get the first licenses.","question":"Which agents gained the most from the assistant?","options":["Agents with middling tenure","Newest, least experienced agents","Top-rated, most experienced agents","Agents handling the most common problems"],"answer":1,"answerTitle":"Start with less experienced agents","explain":"In a staggered rollout to customer-support agents, issues resolved per hour rose 15% on average, and less experienced and lower-skilled agents improved both speed and quality.","implication":"Target early licenses at newer and lower-performing staff, and report gains by tenure tier.","boundary":"Customer-support chat at one firm; gains were largest on moderately rare problems where the system had enough training data.","sources":["bry25"],"study":{"design":"Staggered rollout (quasi-experiment)","n":"5,172 support agents"},"follow":[{"q":"Why start with newer agents?","a":"Less experienced and lower-skilled agents improved both speed and quality, which made them the natural first group."},{"q":"How was productivity measured?","a":"Issues resolved per hour, which rose 15% on average with access to the assistant."},{"q":"Which problems gained most?","a":"Gains were largest for moderately rare problems, where agents had less experience but the system still had enough training data."}],"theme":"ai-work","permuted":true},{"id":"rollout2","track":"AI × Business","format":"forecast","case":{"id":"rollout","title":"Rolling out an AI assistant","step":2,"of":4},"concept":"Expert spillback","title":"Will your stars get better too?","scene":"In a staggered rollout of an AI assistant to 5,172 customer-support agents, the assistant also reached the most experienced, highest-skilled agents.","question":"How likely is it that the study found this?","forecast":{"claim":"For the most experienced, highest-skilled agents, AI assistance improved both speed and quality.","truth":false},"answerTitle":"Top agents: slightly faster, slightly lower quality","explain":"Across 5,172 customer-support agents, Brynjolfsson, Li and Raymond found that the most experienced, highest-skilled agents gained little from the AI assistant: small improvements in speed, alongside small declines in the quality of their output.","implication":"Let top performers tune or skip suggestions, and monitor their quality scores after rollout.","boundary":"One firm’s customer-support chat.","sources":["bry25"],"study":{"design":"Staggered rollout (quasi-experiment)","n":"5,172 support agents"},"follow":[{"q":"Did anyone gain on both?","a":"The earlier steps of this case show which agents gained on speed and quality."},{"q":"Does the AI help experts at all?","a":"Slightly. They saw small gains in speed, offset by small declines in quality."},{"q":"Why might experts gain little?","a":"The authors argue the assistant spreads the know-how of the most able agents, which experienced agents already have."}],"theme":"ai-work"},{"id":"rollout3","track":"AI × Business","format":"delegate","case":{"id":"rollout","title":"Rolling out an AI assistant","step":3,"of":4},"concept":"Jagged frontier","title":"Which tasks go to GPT-4?","scene":"Next, your strategy team gets GPT-4. Their work ranges from brainstorming product ideas to picking the brand to grow from interview notes and spreadsheets.","question":"Assign each task.","delegate":{"choices":["Use GPT-4","Work without AI"],"tasks":[{"text":"Propose ten product ideas for an underserved market","answer":0,"why":"Inside the frontier, consultants with GPT-4 finished 12.2% more tasks, with higher graded quality."},{"text":"Draft press-release copy for the new product","answer":0,"why":"This was one of the inside-frontier tasks, where AI users produced higher-quality work."},{"text":"Pick the brand to grow from interview notes and spreadsheets","answer":1,"why":"On this outside-frontier task, correctness fell from 84.5% without AI to 70.6% with GPT-4 and 60% with GPT-4 plus a prompt overview."}]},"answerTitle":"Use AI inside the frontier, not outside","explain":"Inside the frontier, consultants with GPT-4 completed 12.2% more tasks and finished them faster. On the outside-frontier case, correctness fell from 84.5% without AI to 70.6% with GPT-4 and 60% with GPT-4 plus a prompt overview.","implication":"Test each task type for convincing AI errors before rollout; keep humans in charge where those errors appear.","boundary":"One designed outside-frontier task for a fictional company; the frontier moves as models change.","sources":["dell26"],"study":{"design":"Preregistered field experiment","n":"758 BCG consultants"},"follow":[{"q":"Did prompt training help on the hard task?","a":"No. The group with a prompt-engineering overview was correct about 60% of the time, below GPT-4 alone at 70.6%."},{"q":"How was the hard task built?","a":"Success required a careful review of interview notes that held the key details, then advice to the CEO on which brand held the most growth potential."},{"q":"Who were the workers?","a":"758 BCG consultants, randomized to no AI, GPT-4, or GPT-4 with a prompt-engineering overview."},{"q":"What is the jagged frontier?","a":"The authors’ name for the uneven edge of what AI does well. Tasks that look alike can sit on either side of it: inside, GPT-4 made consultants faster and better; on the task just outside, those using GPT-4 reached the right answer less often."}],"theme":"ai-work"},{"id":"rollout4","track":"AI × Business","format":"estimate","case":{"id":"rollout","title":"Rolling out an AI assistant","step":4,"of":4},"concept":"Deskilling risk","title":"Tutoring with GPT-4","scene":"HR proposes unrestricted ChatGPT-style access in new-hire training. In a related field experiment, high school students practiced math with GPT-4, then took exams without it.","question":"How did unrestricted-AI students score on unaided exams versus controls?","estimate":{"target":-17,"min":-50,"max":50,"tolerance":3,"label":"Change in exam grades vs students without AI","unit":"%"},"answerTitle":"17% lower on exams without AI","explain":"Practice grades rose 48% with plain GPT-4, but exam grades fell 17% versus students never given access. A tutor version with safeguards showed no measurable exam harm.","implication":"In training, use AI tutors that give hints rather than answers, and test skills without AI before certifying anyone.","boundary":"Nearly 1,000 high school math students in Turkey over four 90-minute sessions.","sources":["bastani25"],"study":{"design":"Randomized field experiment","n":"Nearly 1,000 high school students"},"follow":[{"q":"What were students doing with it?","a":"Most used plain GPT-4 to obtain solutions; the most common message was ‘What is the answer?’"},{"q":"Did students realize the harm?","a":"No. Students in the plain GPT-4 arm did not perceive that they performed worse or learned less."},{"q":"What did the tutor version change?","a":"It added safeguards such as hints instead of answers and teacher-provided solutions. Practice grades rose 127%, and exam scores matched controls."}],"theme":"ai-work"},{"id":"bz01","track":"AI × Business","format":"choice","concept":"Ad lift measurement","title":"Measuring ad lift","scene":"Your agency compares Facebook users who saw a campaign with users who did not, after matching on demographics and behavior. A randomized holdout ran at the same time.","question":"How did the matched estimates compare with the randomized tests across 15 campaigns?","options":["They matched the randomized lift","They understated the lift by a steady margin","They matched once enough data were added","They often missed the randomized lift"],"answer":3,"answerTitle":"Matching often missed the experiment’s answer","explain":"Across 15 Facebook ad experiments with 1.6 billion impressions, observational methods often failed to reproduce the randomized estimates, even after conditioning on extensive demographic and behavioral data.","implication":"Keep a randomized holdout for major campaigns before trusting matched or platform-reported lift numbers.","boundary":"Fifteen US Facebook campaigns; observational methods both over- and underestimated lift across campaigns.","sources":["gordon19"],"follow":[{"q":"How many experiments were compared?","a":"Fifteen US advertising RCTs run at Facebook, covering about 500 million user-experiment observations and 1.6 billion impressions."},{"q":"Did adding data fix it?","a":"No. Across the 15 experiments, observational methods often failed to match the randomized results, even with rich demographic and behavioral data."},{"q":"Do observational methods always overstate?","a":"Mostly, but not always. In some studies they significantly underestimated the randomized lift."}],"study":{"design":"15 field RCTs compared with observational methods","n":"15 Facebook ad campaigns"},"theme":"evidence","permuted":true},{"id":"bz02","track":"Business","format":"forecast","concept":"Ad ROI precision","title":"The noisy ROI test","scene":"Your CFO wants a randomized test to prove a digital campaign’s return before renewing it. Individual customers’ weekly sales swing wildly.","question":"How likely is it that the study found this?","answerTitle":"Over 100 percentage points wide","explain":"The median confidence interval on return on investment was over 100 percentage points wide, because individual sales are very noisy relative to ad effects.","implication":"Pool several experiments or measure lower-variance outcomes before asking one test to settle a campaign’s ROI.","boundary":"Digital ads for major US retailers and brokerages; the experiments were unbiased, the limit was statistical precision.","sources":["lewis15"],"follow":[{"q":"How much spending was tested?","a":"The experiments represented $2.8 million in digital advertising expenditure."},{"q":"How big would a decisive test be?","a":"With a coefficient of variation of sales around 10, which the authors call common, informative experiments can require more than 10 million person-weeks."},{"q":"Does this mean RCTs are useless here?","a":"No. Randomization still removes selection bias; the problem is that ad effects are small relative to sales noise, so estimates are imprecise."}],"study":{"design":"Randomized field experiments","n":"25 ad campaigns at US retailers and brokerages"},"theme":"evidence","forecast":{"claim":"The median experiment’s ROI confidence interval was under 50 percentage points wide.","truth":false}},{"id":"bz03","track":"Business","format":"estimate","concept":"Commitment savings","title":"Save more, later","scene":"Employees save little for retirement and resist raising contributions now. An adviser offers a plan that commits part of each future pay raise to savings.","question":"Participants started at a 3.5% savings rate. Where were they after four raises?","estimate":{"target":13.6,"min":0,"max":34,"tolerance":2,"label":"Average savings rate after four pay raises","unit":"%"},"answerTitle":"Savings rates rose from 3.5% to 13.6%","explain":"In the first implementation, participants’ savings rates increased from 3.5 percent to 13.6 percent over 40 months, and 78 percent of those offered the plan joined.","implication":"Offer a sign-up that raises retirement contributions at each future raise, so take-home pay never falls.","boundary":"Early company implementations with employees who chose to join.","sources":["thaler04"],"follow":[{"q":"How many people signed up?","a":"78 percent of those offered the plan joined."},{"q":"Did people quit the plan?","a":"Few did. 80 percent of those enrolled remained in it through the fourth pay raise."},{"q":"Why tie saving to raises?","a":"Employees commit in advance to allocating part of future salary increases to saving, so the extra saving starts when pay goes up rather than out of current take-home pay."}],"study":{"design":"Company field implementation","n":"Employees offered the plan at the first implementing firm"},"theme":"choice"},{"id":"bz04","track":"Business","format":"estimate","concept":"Planning fallacy","title":"Thesis deadlines","scene":"Senior honors students gave their most realistic date for finishing their thesis, plus a best-case and a worst-case date. Researchers then tracked when they actually finished.","question":"What share finished by their own most realistic date?","estimate":{"target":29.7,"min":0,"max":100,"tolerance":6,"label":"Share finishing by their best-guess date","unit":"%"},"answerTitle":"Fewer than one in three finished on time","explain":"Only 29.7% finished by their best-guess date (on average they had predicted 33.9 days), and fewer than half (48.7%) finished by their worst-case date.","implication":"Set project deadlines from how long similar past projects actually took, not from the team’s step-by-step plan.","boundary":"Study 1 tracked psychology honors students on their theses; one task type, one university.","sources":["buehler94"],"follow":[{"q":"Did worst-case dates hold?","a":"Not reliably. Only 48.7% finished by the date they predicted if everything went as poorly as it possibly could."},{"q":"How far off was the average?","a":"Students predicted 33.9 days on average; actual completion took about three weeks longer."},{"q":"Why do people underestimate?","a":"Later studies in the paper point to focusing on plans for the future while discounting past experience with similar tasks."}],"study":{"design":"Prospective prediction study","n":"37 honors students (33 analyzed)"},"theme":"forecasting"},{"id":"bz05","track":"Business","format":"estimate","concept":"Remote work productivity","title":"Shirking from home?","scene":"Ctrip, a 16,000-employee Chinese travel agency, asked call-center staff to volunteer for home working, then randomly assigned volunteers to home or office for nine months.","question":"By how much did home workers’ performance change?","estimate":{"target":13,"min":-30,"max":40,"tolerance":3,"label":"Change in performance when working from home","unit":"%"},"answerTitle":"Performance rose 13%","explain":"Home working led to a 13% performance increase, 9% of it from working more minutes per shift, and attrition roughly halved.","implication":"Pilot remote work on roles with measurable output, assign it randomly, and judge it on output rather than presence.","boundary":"Volunteer call-center staff with easily measured output; home workers’ promotion rate, given performance, fell.","sources":["bloom15"],"follow":[{"q":"Where did the gain come from?","a":"Nine of the 13 points came from working more minutes per shift; the rest from more calls per minute, which the authors attribute to a quieter, more convenient setting."},{"q":"What happened when it went company-wide?","a":"Over half of employees switched their choice, and the gains from working from home almost doubled to 22%, which the authors attribute to learning and selection."},{"q":"Was there any downside?","a":"Yes. Conditional on performance, home workers’ promotion rate fell."}],"study":{"design":"Randomized field experiment","n":"Volunteer call-center staff at Ctrip, 9 months"},"theme":"incentives"},{"id":"bz06","track":"Business","format":"choice","concept":"Endowment effect","title":"Mugs, sellers and buyers","scene":"In classic classroom markets, students given a mug asked a median $7.12 to sell it, while buyers offered $2.87. Plott and Zeiler reran the design with training, practice rounds and anonymous offers.","question":"What happened to the gap between sellers and buyers?","answerTitle":"Under careful procedures, the mug gap disappeared","explain":"Sellers’ median of $7.12 against buyers’ $2.87 in the original markets gave way to no gap under Plott and Zeiler’s procedures. Isoni, Loomes and Sugden later confirmed this for mugs but found a persistent gap for lotteries.","implication":"Before pricing on an “owners overvalue” story, test it with clear instructions and practice; the effect depends on how the choice is elicited.","boundary":"Student markets for mugs under two elicitation procedures, with the follow-up debate extending to lotteries.","sources":["kahneman90","plott05","isoni11"],"follow":[{"q":"Did the gap reduce trading in the 1990 markets?","a":"Yes. While 12.5 trades were expected between buyers and sellers, only three took place."},{"q":"What did the 1990 study conclude?","a":"Buyers and choosers gave similar values, so Kahneman, Knetsch and Thaler read the gap as reluctance to give up the mug, not reluctance to spend."},{"q":"Is the gap just a quirk of the procedure?","a":"Debated. Plott and Zeiler (2005) made the mug gap disappear with procedures that remove misunderstandings; Isoni, Loomes and Sugden (2011) confirmed that for mugs but found a persistent gap for lotteries under the same procedures."}],"study":{"design":"Lab market experiment","n":"77 Simon Fraser students (Experiment 6)"},"theme":"incentives","permuted":true,"options":["It disappeared","It stayed about as large","It shrank by about half","It reversed: buyers valued more"],"answer":0},{"id":"bz07","track":"Business","format":"estimate","concept":"Hybrid work retention","title":"Who stays with hybrid?","scene":"Trip.com randomized 1,612 engineering, marketing and finance staff. Those with odd-numbered birthdays could work from home on Wednesdays and Fridays; the rest stayed in the office full time.","question":"By how much did hybrid work cut the quit rate overall?","answerTitle":"Quits fell by a third, with no loss in performance","explain":"Hybrid work cut quit rates by one-third (7.20% to 4.80%), with larger drops for women and non-managers. Performance reviews showed no difference over two years.","implication":"Offer two home days a week in high-attrition roles, and track performance reviews to confirm nothing is lost.","boundary":"One Chinese technology firm: a six-month randomized trial with 1,612 employees, with performance reviews over two years.","sources":["bloom24"],"follow":[{"q":"Did performance suffer?","a":"No. Reviews across four half-year periods showed no difference between groups, and equivalence tests supported a null effect."},{"q":"What about promotions and output?","a":"No evidence of a difference in promotions, and for 653 engineers no difference in daily lines of code."},{"q":"Did managers change their minds?","a":"Yes. Before the trial managers expected a negative effect of 2.6% on average; afterward their estimate turned positive."}],"study":{"design":"Randomized controlled trial","n":"1,612 Trip.com employees"},"theme":"incentives","estimate":{"target":33,"min":0,"max":90,"tolerance":6,"label":"Reduction in quit rate with two home days a week","unit":"%"},"chart":{"labels":["All employees","Women","Non-managers"],"values":[33,54,40],"unit":"%","highlight":0,"note":"Relative fall in quit rates (share of the control rate), by group."}},{"id":"bz08","track":"Business","format":"forecast","concept":"Fines as prices","title":"Fines for late pickup","scene":"In a famous field experiment, ten Israeli day-care centers tracked late pickups for 20 weeks. In week 5, six centers began fining parents NIS 10 for arriving 10+ minutes late. In week 17 the fine was dropped.","question":"How likely is it that the study found this?","forecast":{"claim":"After the fine was removed, late pickups stayed at the higher level they had reached while the fine applied.","truth":true},"answerTitle":"Lateness nearly doubled and stayed high","explain":"In Gneezy and Rustichini’s six fined day-care centers, late pickups settled at almost twice the pre-fine rate and stayed there after the fine ended (center 1: 7.25 a week before, 15.25 after). The four control centers did not change.","implication":"Before fining a behavior, ask whether the fine turns a social obligation into a price people will happily pay.","boundary":"A small fine in ten day-care centers over 20 weeks; four control centers showed no change.","sources":["gneezy00"],"follow":[{"q":"Was there a control group?","a":"Yes. In the four centers without a fine, no noticeable change took place after the fourth week, or in any other week."},{"q":"How large was the fine?","a":"NIS 10 per child for parents arriving 10 or more minutes late."},{"q":"How fast did lateness rise?","a":"The authors observed a steady increase after the fine began, until the rate settled almost twice as large as the initial one."}],"study":{"design":"Field experiment","n":"10 day-care centers, 20 weeks"},"theme":"incentives","chart":{"labels":["Before the fine","While the fine applied","After the fine ended"],"values":[7.25,12.5,15.25],"unit":"","highlight":2,"note":"Late pickups per week at center 1, one of the six fined centers."}},{"id":"bz09","track":"Business","format":"forecast","concept":"Ad content value","title":"Photo or price?","scene":"A consumer lender mailed loan offers to clients, randomizing the interest rate along with ad content such as a photo, the number of example loans and the offer deadline.","question":"How likely is it that the study found this?","forecast":{"claim":"A photo of an attractive woman raised loan demand far less than a 25% interest-rate cut did.","truth":false},"answerTitle":"The photo matched a 25% rate cut","explain":"Showing fewer example loans, not suggesting a particular use, or including a photo of an attractive woman each raised demand about as much as a 25% interest-rate reduction.","implication":"Test creative content against price in randomized offers before giving up margin on discounts, and review creative for fairness: in consumer credit, imagery that sways borrowers raises consumer-protection questions.","boundary":"Direct-mail offers of short-term consumer credit in South Africa; one lender’s former clients.","sources":["bertrand10"],"follow":[{"q":"Which content features mattered?","a":"Fewer example loans, not suggesting a particular use for the loan, and a photo of an attractive woman."},{"q":"What about deadlines?","a":"Demand strongly increased with longer deadlines, contrary to the idea that short deadlines help people who procrastinate."},{"q":"Why would content work?","a":"The authors read the evidence as ads persuading by appealing peripherally to intuition rather than to reason."}],"study":{"design":"Randomized direct-mail field experiment","n":"Former clients of a consumer lender"},"theme":"incentives"},{"id":"bz10","track":"Business","format":"forecast","concept":"Choice overload","title":"More options on the shelf","scene":"A famous grocery study found about 30% of shoppers who stopped at the display bought jam after a 6-flavor display versus 3% after a 24-flavor display. Your team proposes cutting your product range.","question":"How likely is it that the study found this?","forecast":{"claim":"Across 50 experiments, more options reduced choice or satisfaction on average.","truth":false},"answerTitle":"On average, the effect is near zero","explain":"A meta-analysis of 63 conditions from 50 experiments (5,036 participants) found an average effect of virtually zero, with considerable variance between studies.","implication":"Test a range cut in your own category before assuming fewer options will sell more.","boundary":"Large variance between studies: overload appears in some settings and is absent in others.","sources":["scheib10","iyengar00"],"follow":[{"q":"What did the jam study find exactly?","a":"More shoppers stopped at the 24-jam table, but about 30% of those who saw 6 jams bought one, versus 3% of those who saw 24."},{"q":"How large was the meta-analysis?","a":"63 conditions from 50 published and unpublished experiments, with 5,036 participants."},{"q":"So was the jam study wrong?","a":"Not necessarily. The meta-analysis found considerable variance between studies, so single results like the jam study coexist with an average near zero."}],"study":{"design":"Meta-analysis","n":"50 experiments, 5,036 participants"},"theme":"choice"},{"id":"bz11","track":"Business","format":"forecast","concept":"Replication check","title":"Sign here first?","scene":"A 2012 PNAS study reported that signing an honesty statement at the top of a form, rather than the bottom, reduced dishonest reports. Government agencies adopted the practice.","question":"How likely is it that the study found this?","forecast":{"claim":"The replications found no effect of signing first on honest reporting.","truth":true},"answerTitle":"No effect of signing first","explain":"Across five conceptual replications with 4,559 participants and a preregistered direct replication with 1,235, the authors observed no effect of signing first on honest reporting. PNAS retracted the 2012 paper in 2021.","implication":"Before rolling out a published nudge, check for replications and retractions, then pilot it on your own forms.","boundary":"Tests one form-design nudge on experimental self-reports.","sources":["kristal20","shu12"],"follow":[{"q":"Who ran the replication?","a":"The replication team included all five authors of the 2012 paper, alongside Kristal and Whillans."},{"q":"When was the original retracted?","a":"PNAS retracted the original paper in 2021."},{"q":"Why did a failed replication matter so much?","a":"The authors note that government agencies had adopted the practice, so they argued the scientific record needed updating."}],"study":{"design":"Preregistered direct and conceptual replications","n":"4,559 + 1,235 participants"},"theme":"evidence"},{"id":"bz12","track":"Business","format":"choice","concept":"Pay transparency","title":"When salaries go public","scene":"A new website published University of California employees’ pay. Researchers told a random subset of staff about the site, then surveyed everyone on job satisfaction and job search.","question":"What did learning about peers’ pay do?","options":["Above-median earners: more satisfied","Above-median earners: happier, job hunting less","Below-median earners: less satisfied, job hunting","Below-median earners: more motivated to catch up"],"answer":2,"answerTitle":"Below-median earners grew unhappy and started looking","explain":"Card, Mas, Moretti and Saez found that below-median University of California earners told about the salary website became 4.3 percentage points more likely to report being very likely to seek a new job, a 20% rise. Above-median earners were unaffected.","implication":"Before publishing pay data, prepare clear explanations of pay differences for below-median staff, who carry the morale cost.","boundary":"University of California employees; outcomes were self-reported satisfaction and job-search intentions.","sources":["card12"],"follow":[{"q":"Why randomize who heard about the site?","a":"Low-paid staff differ from high-paid staff in many ways. Randomizing who learned about the site isolates the effect of the information itself."},{"q":"Did higher earners gain from learning they earn more?","a":"No. Workers paid above the median were unaffected."},{"q":"Does pay level or pay rank matter more?","a":"Rank. Responses tracked a worker’s rank in the pay distribution more closely than relative pay level."}],"study":{"design":"Randomized information experiment","n":"University of California employees"},"theme":"incentives","permuted":true},{"id":"bz13","track":"Business","format":"forecast","concept":"Pay inequality morale","title":"Pay by rank","scene":"For a month, Indian manufacturing workers in production teams were randomly paid either the same flat daily wage or different wages based on their baseline productivity rank.","question":"How likely is it that the study found this?","answerTitle":"Output fell 0.45 standard deviations; attendance fell 18 points","explain":"When coworkers’ productivity was difficult to observe, pay inequality reduced output by 0.45 standard deviations and attendance by 18 percentage points, and weakened cooperation.","implication":"If pay differs within a team, make the productivity basis visible to everyone before the gap takes effect.","boundary":"One month of randomized daily pay among Indian manufacturing workers in production teams, including teams where coworkers’ productivity was easy to observe.","sources":["breza18"],"follow":[{"q":"Is every pay gap harmful?","a":"No. When workers could clearly perceive that higher-paid peers were more productive, pay disparity had no discernible effect on output, attendance or group cohesion."},{"q":"What happened to teamwork?","a":"Pay inequality also lowered coworkers’ ability to cooperate in their own self-interest."},{"q":"How long did the experiment run?","a":"About one month, in Indian manufacturing."}],"study":{"design":"Randomized field experiment","n":"Indian manufacturing workers, one month"},"theme":"incentives","forecast":{"claim":"Where coworkers could not easily see who was more productive, paying them unequal wages raised output.","truth":false}},{"id":"bz14","track":"Business","format":"choice","concept":"Joint evaluation","title":"Two ways to compare candidates","scene":"Evaluators chose workers for a task and were paid on the chosen worker’s future performance. Some saw candidates one at a time; others compared candidates side by side.","question":"Which procedure made evaluators rely more on individual performance?","options":["Seeing candidates one at a time","Comparing candidates side by side"],"answer":1,"answerTitle":"Side-by-side review focused choices on performance","explain":"In Bohnet, van Geen and Bazerman’s incentivized experiment, evaluators who compared candidates side by side relied more on individual performance, while those judging one at a time leaned more on gender stereotypes, so joint evaluation paid evaluators the most.","implication":"Compare shortlisted candidates side by side on the same criteria instead of scoring each one in isolation.","boundary":"Incentivized lab hiring task with clear performance scores; real hiring information is noisier.","sources":["bohnet16"],"follow":[{"q":"Why does comparing help?","a":"The authors draw on decision research showing that people reason more carefully when they compare options together than when they judge one in isolation."},{"q":"Does it cost the employer anything?","a":"No. Because evaluators picked on performance, joint evaluation was the profit-maximizing procedure."},{"q":"How does it relate to blind auditions?","a":"The authors present it as an alternative to blind evaluation, which helped women musicians win orchestra positions but is hard to use in many workplaces."}],"study":{"design":"Incentivized lab experiment","n":"Evaluators choosing among candidates"},"theme":"fairness","permuted":true},{"id":"bz15","track":"Business","format":"choice","concept":"Default consent","title":"Organ donor forms","scene":"An online survey asked 161 people whether they would be organ donors. The question was framed as opt-in, opt-out, or a neutral form requiring a choice with no default.","question":"Which form produced the fewest donors?","options":["Neutral (must choose, no default)","Opt-out (default: donor)","Opt-in (default: non-donor)"],"answerTitle":"Opt-out and active choice both beat opt-in","explain":"Consent was about twice as high under opt-out as under opt-in, and opt-out did not differ significantly from the neutral form (79%).","implication":"Where you cannot set a favorable default, require an active choice rather than leaving opt-in as the silent default.","boundary":"Stated intentions from 161 online respondents; the country comparisons in the paper are correlational.","sources":["johnson04"],"follow":[{"q":"Does this show up across countries?","a":"Yes. In effective consent rates, nearly 60 percentage points separated opt-out from opt-in European countries, with no overlap."},{"q":"Do actual donations rise?","a":"In a 1999 cross-section cited by the authors, presumed-consent countries had 16.9 donations per million versus 10.8 in explicit-consent countries."},{"q":"Why does the default matter so much?","a":"The authors argue that if preferences about donation were strong, defaults should have little effect; the large gap suggests many people hold weak preferences."}],"study":{"design":"Online experiment plus country comparison","n":"161 online respondents"},"theme":"choice","answer":2},{"id":"bz16","track":"Business","format":"forecast","concept":"Naive diversification","title":"Fund menus and real plans","scene":"Benartzi and Thaler (2001) reported that the share invested in stocks rose with the share of stock funds on a 401(k) menu. Huberman and Jiang (2006) then examined administrative records of participants in many real 401(k) plans.","question":"How likely is it that the study found this?","answerTitle":"In real plans, the menu’s mix mattered little","explain":"Huberman and Jiang found that participants split contributions evenly across the funds they use, typically three or four, yet their propensity to put money into equity funds was not very sensitive to the fraction of equity funds offered.","implication":"Before redesigning a plan menu to steer risk, check your own participants’ records; in large real-plan data, equity exposure moved little with the menu’s mix.","boundary":"Administrative records of 401(k) participants across many plans, set against earlier evidence from hypothetical allocation tasks and plan-level comparisons.","sources":["huberman06","benartzi01"],"follow":[{"q":"What did the original study find?","a":"Benartzi and Thaler reported that some investors split contributions evenly across whatever funds are offered, so the stock share rose with the share of stock funds on the menu."},{"q":"Why do the results differ?","a":"The designs differ: hypothetical allocation tasks and comparisons across plans, versus records of individual participants inside real plans."},{"q":"Does the even split still happen?","a":"Yes. Participants tend to allocate evenly across the funds they use, but they use only a few, and that number does not track how many are offered."}],"study":{"design":"Administrative 401(k) records","n":"Participants in many 401(k) plans"},"theme":"choice","forecast":{"claim":"In real plans, the share put into equity rose roughly in step with the share of equity funds offered.","truth":false}},{"id":"civic-wallet-rank","format":"rank","track":"Culture & Society","concept":"Civic honesty","title":"Lost wallets, different contents","scene":"Researchers handed ‘lost’ wallets to staff at banks, hotels, post offices and police stations. In the US, UK and Poland, wallets held no money, US$13.45, or US$94.15.","question":"Rank the wallets by how often staff contacted the owner.","options":["US$94.15 in cash","No money","US$13.45 in cash"],"rankAnswer":[0,2,1],"rankLabel":"Share of wallets reported to the owner","rankValues":["72%","46%","61%"],"answerTitle":"More money, more wallets returned","explain":"Reporting rose from 46% with no money to 61% with US$13.45 and 72% with US$94.15. Across all 40 countries, money raised reporting from 40% to 51%.","implication":"When designing controls, make the owner and the stakes visible; people resist taking more when it would clearly feel like theft.","boundary":"Wallets handed to counter staff in 355 cities; return was measured by owner emails.","sources":["cohn19"],"follow":[{"q":"Did the key in the wallet matter?","a":"Yes. Wallets with a key, useful only to the owner, were more likely to be reported, which the authors read as concern for the owner."},{"q":"Did this hold in every country?","a":"The money effect appeared in 38 of 40 countries, and no country showed a significant drop in reporting when money was added."},{"q":"How large was the study?","a":"17,303 wallets were turned in across 355 cities in 40 countries, typically five to eight of each country’s largest cities."}],"study":{"design":"Field experiment","n":"17,303 wallets, 355 cities, 40 countries"},"theme":"honesty","permuted":true,"chart":{"labels":["No money","US$13.45 inside","US$94.15 inside"],"values":[46,61,72],"unit":"%","highlight":2,"note":"Share of lost wallets reported, three countries pooled."}},{"id":"civic-wallet-experts","format":"forecast","track":"Judgment","concept":"Forecasting honesty","title":"What the experts expected","scene":"Researchers asked 279 academic economists and 299 other survey respondents to predict how adding cash to a lost wallet would change US return rates.","question":"How likely is it that the study found this?","forecast":{"claim":"Fewer than half of the surveyed economists predicted that return rates would rise with more money.","truth":true},"answerTitle":"Fewer than a third of economists foresaw the pattern","explain":"Among 279 economists, 49% predicted a decrease and 29% an increase; among 299 laypeople, 18% predicted an increase.","implication":"Pilot honesty controls before scaling them; expert intuition about how people respond to temptation got the direction wrong here.","boundary":"Predictions were for US return rates; actual behavior came from the 40-country field experiment with wallets handed to counter staff.","sources":["cohn19"],"follow":[{"q":"What did laypeople predict?","a":"They expected reporting to fall as money increased, from 73% with no money to 65% with a modest sum and 55% with a substantial sum."},{"q":"Were economists closer than laypeople?","a":"Their errors were smaller, but they predicted roughly flat rates of 69%, 69% and 66%."},{"q":"Why might the experts have missed it?","a":"They expected self-interest to win out. The authors trace the rise to concern for the owner combined with an aversion to seeing oneself as a thief."}],"study":{"design":"Field experiment plus prediction surveys","n":"279 economists, 299 laypeople"},"theme":"honesty","chart":{"labels":["Laypeople","Economists"],"values":[18,29],"unit":"%","highlight":1,"note":"Share who predicted more money would raise reporting."}},{"id":"truth-telling-gains","format":"estimate","track":"Culture & Society","concept":"Truth-telling","title":"How much do people lie?","scene":"Across many experiments, people privately rolled a die or flipped a coin and reported the result. Higher reports paid more, and nobody could check.","question":"What share of the possible gains from lying did people leave on the table?","estimate":{"target":75,"min":0,"max":100,"tolerance":7,"label":"Share of potential lying gains forgone","unit":"%"},"answerTitle":"About three-quarters of possible gains forgone","explain":"Pooling 270,616 decisions by 44,390 subjects, the average standardized report was only 0.234: subjects forgo about three-quarters of the potential gains from lying.","implication":"For self-reported claims such as expenses or hours, assume most people report honestly and aim checks at the minority who inflate.","boundary":"Lab and online reporting tasks with modest stakes; raising incentives changed behavior very little within these studies.","sources":["abeler19"],"follow":[{"q":"Why do people pass up free money?","a":"The authors’ new experiments point to two main motives: a preference for being honest and a preference for being seen as honest."},{"q":"Do bigger stakes produce more lying?","a":"Barely. Subjects continued to refrain from lying maximally when stakes increased, and incentives affected behavior only very little."},{"q":"How large is the evidence base?","a":"Experimental studies from economics, psychology and sociology, covering 270,616 decisions by 44,390 subjects."}],"study":{"design":"Meta-study plus new experiments","n":"44,390 subjects in 90 studies"},"theme":"honesty"},{"id":"lies-in-disguise","format":"estimate","track":"Culture & Society","concept":"Partial lying","title":"Honest, liar, or in between","scene":"Lab participants rolled a die in private and reported the number for cash. Nobody could verify any individual roll.","question":"What share of participants did researchers estimate were fully honest?","estimate":{"target":39,"min":0,"max":95,"tolerance":5,"label":"Estimated share of honest participants","unit":"%"},"answerTitle":"About 39% honest, about 20% full liars","explain":"The authors estimate that 39% of subjects were fully honest and about 20% of inexperienced subjects lied to the fullest extent; others lied without claiming the top payoff.","implication":"Design expense or time reporting so moderate inflation, not only extreme claims, meets a check or a reminder.","boundary":"One-shot lab die task; the shares are inferred from the distribution of reports.","sources":["fischbacher13"],"follow":[{"q":"How can they know who lied?","a":"They cannot see individual rolls. They compare the distribution of reports with what a fair die produces, which bounds the shares of honest and fully dishonest people."},{"q":"Why lie only a little?","a":"The authors discuss several motives for this pattern; the study itself measures how many people lie, and by how much."},{"q":"Why does partial lying matter for managers?","a":"Because some people lie without maximizing income, controls that only flag the most extreme claims miss part of the dishonesty the study documents."}],"study":{"design":"Lab experiment"},"theme":"honesty"},{"id":"rule-violations-honesty","format":"forecast","track":"Culture & Society","concept":"Rule environments","title":"Corruption and the die cup","scene":"Students in 23 countries rolled a die twice in a cup and were paid for reporting the first roll. Their countries differed in corruption, tax evasion and political fraud.","question":"How likely is it that the study found this?","forecast":{"claim":"In high rule-violation societies, the extra dishonesty came mainly from people claiming the maximum payoff.","truth":false},"answerTitle":"More rule-bending, not more maximal cheating","explain":"Mean claims were 3.17 in low-violation pools and 3.53 in high-violation pools, near the 3.47 ‘justified dishonesty’ benchmark; the share claiming the maximum was unrelated to rule violations.","implication":"Where rule-breaking is common, expect small self-justified stretching more than brazen fraud; remove ambiguity people use to rationalize.","boundary":"2,568 students in 23 countries; a cross-society correlation with a country index measured years earlier.","sources":["gachter16"],"follow":[{"q":"What is ‘justified dishonesty’?","a":"Reporting the higher of the two rolls instead of the first, a self-justifiable lie. Its benchmark average is 3.47, close to the 3.53 claimed in high-violation societies."},{"q":"How many people were fully honest?","a":"An estimated 48.9% on average, ranging from 4.3% to 87% across subject pools, with fewer fully honest people in high-violation societies."},{"q":"How was rule violation measured?","a":"A country index combining political fraud, tax evasion and corruption, based on data from 2003; the experiments ran at least eight years later."}],"study":{"design":"Cross-country lab experiment","n":"2,568 students, 23 countries"},"theme":"honesty","chart":{"labels":["Low rule-breaking countries","High rule-breaking countries"],"values":[3.17,3.53],"unit":"","highlight":1,"note":"Average amount claimed in the die-roll task."}},{"id":"tax-letter-norms","format":"multi","track":"Culture & Society","concept":"Norm messaging","title":"One sentence in a tax letter","scene":"The UK tax authority sent reminder letters to over 200,000 people with overdue tax. Letters varied one added message: social norms, public services, or loss versus gain framing.","question":"Which two findings did these field experiments report?","options":["Loss framing beat gain framing","Injunctive norms beat descriptive norms in the letters","Norm messages backfired overall","Public-services messages raised payment rates","Social norm messages raised payment rates"],"multiAnswers":[3,4],"answerTitle":"Norm and public-services lines raised payments","explain":"Across more than 200,000 UK taxpayers, adding social norm messages to standard reminders increased payment of overdue tax; public-services messages also helped, and loss framing did no better.","implication":"In compliance reminders, state accurately what most peers do and what the money funds, and test wording on real payment data.","boundary":"UK taxpayers with overdue Self Assessment debts; outcomes were short-run payment, which accelerated revenue rather than proving lasting compliance.","sources":["hallsworth17"],"follow":[{"q":"Which kind of norm worked better?","a":"Descriptive norms, which state what most people do, appeared more effective than injunctive norms about what people ou
