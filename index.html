series of consumer experiments tested reactions to offers better or worse than customers expected.","question":"For each message, which messenger drew the better customer response?","delegate":{"choices":["AI agent","Human employee"],"tasks":[{"text":"A discount larger than the customer expected","answer":1,"why":"For offers better than expected, consumers responded more positively to a human agent."},{"text":"A renewal price higher than the customer expected","answer":0,"why":"For offers worse than expected, consumers showed higher purchase likelihood and satisfaction when dealing with an AI agent."}]},"answerTitle":"AI for worse offers, humans for better ones","explain":"Across consumer experiments, Garvey, Kim and Duhachek found worse-than-expected offers drew higher purchase likelihood and satisfaction from an AI agent, and better-than-expected offers drew more positive responses from a human, because AI seems to have weaker intentions.","implication":"If bots deliver price increases, review that choice for fairness and disclosure; deliver generous offers through people, where they earn more credit.","boundary":"Consumer experiments on purchase likelihood and satisfaction after single offers presented by AI or human agents.","sources":["garvey23"],"study":{"design":"Series of consumer experiments","n":"Multiple studies"},"follow":[{"q":"Why does the AI get a pass?","a":"Consumers see AI agents as having weaker intentions: no selfish motive when the offer favors the firm, no benevolent one when it favors the customer. That dampens reactions both ways."},{"q":"Can a firm get credit through a bot?","a":"Yes, partly. Making the AI agent more humanlike strengthened perceived intentions, giving the firm an avenue to receive due credit for a better offer."},{"q":"Do the authors see an ethics problem?","a":"Yes. They discuss ethical concerns about using AI to bypass consumer resistance to negative offers."}],"theme":"ai-trust"},{"id":"axf05","track":"AI × Business","format":"rank","concept":"Explainable AI","title":"Do explanations catch a bad model?","scene":"457 hospital clinicians diagnosed acute respiratory failure from case vignettes, first without AI, then with AI predictions, half also seeing image explanations. Some predictions came from a deliberately biased model.","question":"Rank the conditions by clinician diagnostic accuracy.","options":["Standard AI, no explanations","Biased AI, no explanations","Standard AI with explanations","No AI","Biased AI with explanations"],"rankAnswer":[2,0,3,4,1],"rankTies":[[0,2],[1,4]],"rankLabel":"Clinician diagnostic accuracy","rankValues":["+2.9 points","−11.3 points","+4.4 points","Baseline, 73.0%","−9.1 points"],"answerTitle":"Explanations did not rescue the biased model","explain":"From a 73.0% baseline, standard AI added 2.9 points, or 4.4 with explanations. Biased AI cut accuracy by 11.3 points; explanations recovered a non-significant 2.3, so pairs within each model type are not scored.","implication":"Audit models for systematic errors before deployment; do not count on explanation overlays to help staff catch bad predictions.","boundary":"Vignettes of acute respiratory failure with three candidate diagnoses, in one survey session, with bias built in by the researchers.","sources":["jabbour23"],"study":{"design":"Randomized clinical vignette survey","n":"457 clinicians in 13 US states"},"follow":[{"q":"What was the bias?","a":"The researchers built models that made systematic errors linked to patient characteristics, then showed their predictions to clinicians."},{"q":"What did the authors conclude?","a":"Standard AI raised accuracy, systematically biased AI lowered it, and image explanations did not mitigate the harm from the biased model."},{"q":"Who took part?","a":"Hospitalist physicians, nurse practitioners and physician assistants (median age 34), surveyed between April 2022 and January 2023."}],"theme":"ai-trust","permuted":true},{"id":"axf06","track":"AI × Business","format":"forecast","concept":"AI assistance gap","title":"Does the chatbot help the doctor?","scene":"Fifty physicians had 60 minutes for up to six hard clinical vignettes, randomized to GPT-4 plus usual resources or usual resources only. Researchers also had GPT-4 answer the cases alone.","question":"How likely is it that the study found this?","answerTitle":"76% versus 74%: no clear gain for physicians","explain":"Physicians scored a median 76% with GPT-4 and 74% with usual resources only, a difference that was not statistically significant.","implication":"Before judging an AI tool by staff results, train staff to use it or build structured prompts into the workflow.","boundary":"Fifty US physicians working six challenging clinical vignettes, graded on a structured reasoning rubric.","sources":["goh24"],"study":{"design":"Randomized clinical trial","n":"50 physicians"},"follow":[{"q":"Did GPT-4 save time?","a":"Not significantly. Median time per case was 519 seconds with GPT-4 and 565 without (a model-adjusted difference of −82 seconds, not statistically significant)."},{"q":"Were physicians trained to prompt?","a":"No explicit prompt-engineering training was given, matching current integrations. The authors suggest training or predefined prompts in the workflow could help."},{"q":"How was GPT-4 alone tested?","a":"Researchers ran one fixed zero-shot prompt three times per case and graded the outputs blind, alongside the physicians’ answers. Its median score was 92%."}],"theme":"ai-work","permuted":true,"forecast":{"claim":"Physicians with GPT-4 scored significantly higher than physicians without it.","truth":false},"chart":{"labels":["Physicians, usual resources","Physicians with GPT-4","GPT-4 alone"],"values":[74,76,92],"unit":"%","highlight":null,"note":"Median diagnostic reasoning score per case; the physicians’ 2-point difference was not statistically significant."}},{"id":"manylabs-anchoring","track":"Business","format":"forecast","concept":"Replication check","title":"A number shown first","scene":"A classic study found that a high or low number shown before a question, such as how many babies are born per day in the US or how tall Mount Everest is, pulled people’s estimates toward it. A large replication project reran it across many labs.","question":"How likely is it that the study found this?","forecast":{"claim":"Across the replication samples, the anchoring effect held up and came out at least as large as in the original study.","truth":true},"answerTitle":"Anchoring replicated, and larger than first reported","explain":"Across 36 samples with 6,344 participants, Klein and colleagues found large anchoring effects on four estimation questions, with standardized sizes of 1.27 to 2.60 against an overall 0.93 in the original study. Ten effects in the project replicated consistently; two priming effects did not.","implication":"Treat anchors as reliable: decide which number a customer or negotiating partner sees first, and test the choice before you scale it.","boundary":"General-knowledge estimation questions answered by participants in 36 samples.","sources":["manylabs14"],"study":{"design":"Multi-site replication","n":"36 samples, 6,344 participants"},"theme":"evidence","chart":{"labels":["Original study, overall","Distance to New York","Population of Chicago","Height of Mount Everest","Babies born per day"],"values":[0.93,1.27,2.05,2.45,2.6],"unit":"","highlight":4,"note":"Anchoring effect size, standardized; the original study reported one overall size.","decimals":2},"follow":[{"q":"Which effects did not replicate?","a":"Flag priming on conservatism and currency priming on system justification did not replicate; imagined contact reducing prejudice showed weak support."},{"q":"How large was each replication effect?","a":"Standardized sizes ran from 1.27 for distance to New York to 2.60 for babies born, against an overall 0.93 in the original study."},{"q":"How large was the project?","a":"36 independent samples totaling 6,344 participants."}]}],"editorialRules":["Peer-reviewed journal research only for scored conclusions.","A scenario is a pedagogical illustration, not a replication.","Do not generalize task-specific effects to all populations.","Do not use working papers as evidence.","Published research may be contested or context-dependent."],"retired":[{"id":"biz09","title":"Same outcome, different decision","sources":["frame81"],"reason":"Duplicate of judg05 framing item; concept label only."},{"id":"biz10","title":"A decision memo rewrite","sources":["frame81"],"reason":"Advice the paper did not test as a remedy."},{"id":"biz12","title":"The vivid case","sources":["anchor74"],"reason":"Concept-label question with a non-serious distractor."},{"id":"biz13","title":"The cost of not deciding","sources":["avoid03"],"reason":"Concept-label question; no measured outcome."},{"id":"biz14","title":"Keep the incumbent","sources":["avoid03"],"reason":"Concept-label question; no measured outcome."},{"id":"judg01","title":"The risky offer","sources":["loss79"],"reason":"Concept-label question."},{"id":"judg03","title":"A convincing story","sources":["anchor74"],"reason":"Concept-label question."},{"id":"judg04","title":"The first estimate","sources":["anchor74"],"reason":"Advice the paper did not test as a remedy."},{"id":"judg06","title":"The memorable failure","sources":["anchor74"],"reason":"Concept-label question."},{"id":"judg07","title":"Different baselines","sources":["loss79"],"reason":"Concept-label question."},{"id":"judg08","title":"Waiting for perfect data","sources":["avoid03"],"reason":"Concept-label question."},{"id":"ai03","title":"Who captures the upside?","sources":["bry25"],"reason":"Superseded by the rollout case (same source, sharper design)."},{"id":"ai05","title":"The jagged frontier","sources":["dell26"],"reason":"Superseded by axb14 and rollout3 with measured outcomes."},{"id":"ai06","title":"When AI help backfires","sources":["dell26"],"reason":"Superseded by rollout3 with measured outcomes."},{"id":"ai08","title":"The hidden portfolio risk","sources":["doshi24"],"reason":"Advice item without a measured outcome."},{"id":"ai13","title":"Human error, model error","sources":["diet15"],"reason":"Duplicate of ai09."},{"id":"ai14","title":"Creative homogenization","sources":["doshi24"],"reason":"Advice item without a measured outcome."},{"id":"ai15","title":"Hidden distributional returns","sources":["bry25"],"reason":"Duplicate of rollout case."},{"id":"ai16","title":"Bias in a faster funnel","sources":["resume04"],"reason":"Generic advice; replaced by axb05 and axb12 with measured outcomes."},{"id":"ai17","title":"The AI rollout norm","sources":["measure23"],"reason":"Advice item without a measured outcome."},{"id":"social02","title":"The polarized team","sources":["norms24"],"reason":"Superseded by dimant-polarizednorms-choice."},{"id":"social05","title":"The silence trap","sources":["plural93"],"reason":"Advice item without a measured outcome."},{"id":"social06","title":"One number, many norms","sources":["plural24"],"reason":"Concept-label question."},{"id":"social09","title":"One influencer or a cluster?","sources":["cent10"],"reason":"Duplicate of social08."},{"id":"social11","title":"The socially attuned team","sources":["team10"],"reason":"Duplicate of social10."},{"id":"social17","title":"Expect the worst","sources":["hate23"],"reason":"Superseded by dimant-hate-choice."},{"id":"social18","title":"Bad behavior travels","sources":["contagion19"],"reason":"Superseded by dimant-contagion-multi."},{"id":"social19","title":"The near-peer effect","sources":["contagion19"],"reason":"Superseded by dimant-contagion-multi."},{"id":"social21","title":"Beyond a single norm","sources":["measure23"],"reason":"Concept-label question."},{"id":"axe03","title":"Who decides, who coaches?","sources":["fugener22","tong21"],"reason":"Review 4: routings rested on author suggestions, and the abstracts report no effect sizes."},{"id":"social03","title":"When peers vary","sources":["norms24"],"reason":"Review 4: duplicate of social01 (same paper, same tight-versus-loose result)."},{"id":"axe02","title":"Where does the AI go?","sources":["ayers23","luo19","jia24","cui26"],"reason":"Review 5: its routings were not compared against each other in the cited studies."},{"id":"ai04","title":"A real-world baseline","sources":["bry25"],"reason":"Review 7: repeats rollout1’s headline number from the same paper."},{"id":"biz06","title":"Two types of social feedback","sources":["energy07"],"reason":"Review 8: repeats biz05 (same paper, same smiley-face result)."},{"id":"biz03","title":"The hotel-room note","sources":["hotel08"],"reason":"Review 12: keyed the original towel-sign effect that biz04 shows failed to replicate; contested findings enter only as items about the contest."}],"themes":[{"id":"ai-work","title":"AI at work","principle":"Generative AI raises average output on tasks inside its frontier and lifts weaker performers most. Outside the frontier it makes confident people wrong, and unrestricted use can erode the skill it replaces."},{"id":"ai-trust","title":"Trusting algorithms","principle":"People punish an algorithm’s visible errors more than a human’s, yet often weight algorithmic advice heavily when they cannot see it fail. Control, task type and expertise move the balance."},{"id":"fairness","title":"Fairness and bias","principle":"Bias enters through the target a model predicts, the market that delivers it and the signals evaluators see. Measured outcomes, not intentions, show whether a process is fair."},{"id":"persuasion","title":"Persuasion and misinformation","principle":"Falsehood travels on human attention. AI can personalize arguments at scale, labels change trust in ways designers do not intend, and small prompts to think about accuracy help a little."},{"id":"choice","title":"Choice architecture","principle":"Defaults, frames and anchors decide many choices before preferences do, while menu effects are contested in real plans. The design of the decision is a management decision."},{"id":"incentives","title":"Pay, incentives and work design","principle":"Money changes the meaning of behavior as well as its price. Pay comparisons, fines and flexibility have effects that the incentive alone does not predict."},{"id":"evidence","title":"Measuring what works","principle":"Observational lift, expert forecasts and famous single studies often overstate effects. Randomized tests, replications and honest uncertainty protect budgets."},{"id":"honesty","title":"Honesty and compliance","principle":"Most people lie less than they could, many lie a little, and what they believe peers do shapes both. Enforcement works through norms as much as through penalties."},{"id":"norms","title":"Norms and polarization","principle":"The average opinion hides the distribution behind it. Misread norms, polarized expectations and visible bad examples drive behavior in teams and societies, and correcting beliefs can move it."},{"id":"forecasting","title":"Forecasting and teams","principle":"Forecasts improve with training, teaming and scoring, and fail through overconfidence and planning optimism. Whether turn-taking or members’ ability drives group performance is still debated."}],"paths":[{"id":"leading-ai","title":"Leading with AI","case":true,"blurb":"Roll out an assistant, decide who gets it first, route tasks across the frontier, and protect the skills your people still need.","ids":["rollout1","rollout2","rollout3","rollout4","axb14","axb01","ai07","axb13","axe06","axf01","axf06"]},{"id":"ai-customers","title":"AI meets your customers","case":true,"blurb":"Disclose the bot or not, label AI content, personalize ads, answer patients. What customers do when AI is on the other side.","ids":["genai1","genai2","genai3","axe14","axe05","axe01","axe10","axe13"]},{"id":"trust-algo","title":"When to trust the algorithm","blurb":"Formulas against experts, models after an error, and the design choices that decide whether people accept algorithmic advice.","ids":["axb04","ai09","axb02","axb03","axb06","ai10","axb11","axb10","axe07","axf05"]},{"id":"measure","title":"Measure before you scale","blurb":"Ad lift, nudges, remote work and expert forecasts, each put to a randomized test.","ids":["bz01","bz05","bz11","bz09","bz02","bz10","accuracy-prompt","bz07","dimant-masks-forecast","dimant-requiem-forecast","civic-wallet-experts","forecast-teams-rank","manylabs-anchoring"]},{"id":"dimant-lab","title":"Norms, honesty, polarization","blurb":"Eugen Dimant’s research on how the shape of a norm, the visibility of peers and political identity change what people do.","ids":["social01","dimant-polarizednorms-choice","dimant-hate-choice","dimant-contagion-multi","dimant-proximity-estimate","dimant-enforcers-rank","dimant-notalie-causal","dimant-masks-forecast"]},{"id":"design","title":"Design the decision","blurb":"Defaults, menus, frames and anchors. Small design choices that move retirement savings, consent and estimates.","ids":["biz01","bz15","judg05","bz03","bz16","biz05","biz11"]},{"id":"people","title":"Pay, flexibility and fairness","blurb":"Remote work, pay transparency, fines and biased algorithms. What field experiments say about running people well.","ids":["bz05","bz07","bz12","bz13","bz08","axb05","axb12","social12","civic-wallet-rank"]},{"id":"truth","title":"Truth, persuasion and AI","blurb":"AI debaters, AI labels, detection and the spread of falsehood. How beliefs move when machines join the conversation.","ids":["axb08","axb15","axb07","axb09","false-news-spread","accuracy-prompt","opposing-views-bot","dimant-conspiracy-choice"]}],"unused_sources":{"avoid03":{"id":"avoid03","authors":"Anderson","year":2003,"title":"The psychology of doing nothing: Forms of decision avoidance result from reason and emotion","venue":"Psychological Bulletin","url":"https://doi.org/10.1037/0033-2909.129.1.139","doi":"10.1037/0033-2909.129.1.139","kind":"peer <script>// Scoring for every challenge format. Pure functions: no DOM, no storage.
// Loaded in the browser as a global (THVScore) and in Node tests via require().
(function (root) {
  'use strict';
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  // Every scorer returns {score: 0..1, correct: boolean, detail: {...}}.
  // `score` is partial credit; `correct` is the binary outcome used for calibration.
  function choice(c, answer) {
    const ok = answer === c.answer;
    return { score: ok ? 1 : 0, correct: ok, detail: {} };
  }

  function multi(c, answer) {
    const set = new Set(Array.isArray(answer) ? answer : []);
    const hits = c.multiAnswers.filter(i => set.has(i)).length;
    const ok = hits === c.multiAnswers.length && set.size === c.multiAnswers.length;
    return { score: hits / c.multiAnswers.length, correct: ok, detail: { hits } };
  }

  function estimate(c, value) {
    const e = c.estimate;
    const gap = Math.abs(value - e.target);
    // Full credit inside the tolerance band, then linear decay to zero at two tolerances from the target.
    const score = gap <= e.tolerance ? 1 : clamp(1 - (gap - e.tolerance) / e.tolerance, 0, 1);
    return { score, correct: gap <= e.tolerance, detail: { gap: Math.round(gap * 10) / 10 } };
  }

  // Probability forecast on a binary proposition. Brier score: 0 is perfect, 1 is worst.
  function forecast(c, p) {
    const prob = clamp(Number(p) / 100, 0, 1);
    const truth = c.forecast.truth ? 1 : 0;
    const brier = (prob - truth) ** 2;
    // Proper rule (a linear transform of Brier): 100 for a confident correct call, 50 for saying 50%,
    // and down to -100 for a confident wrong call. Unclamped, so reporting your true belief is always best.
    return { score: 1 - 2 * brier, correct: (prob > 0.5) === (truth === 1) && prob !== 0.5, detail: { brier: Math.round(brier * 1000) / 1000 } };
  }

  // Ranking: share of item pairs placed in the evidence order (Kendall agreement).
  function rank(c, order) {
    const truth = c.rankAnswer;
    if (!Array.isArray(order) || order.length !== truth.length) return { score: 0, correct: false, detail: { pairs: 0 } };
    const pos = new Map(order.map((v, i) => [v, i]));
    // Pairs the study could not tell apart (rankTies) are not scored.
    const tied = (a, b) => (c.rankTies || []).some(g => g.includes(a) && g.includes(b));
    let agree = 0, total = 0;
    for (let i = 0; i < truth.length; i++) for (let j = i + 1; j < truth.length; j++) {
      if (tied(truth[i], truth[j])) continue;
      total++; if (pos.get(truth[i]) < pos.get(truth[j])) agree++;
    }
    const score = total ? agree / total : 0;
    return { score, correct: score === 1, detail: { agree, total } };
  }

  // Allocation as a probability split over "which option worked best" (a proper rule, like the forecast score).
  // Target: equal shares on the best arm(s); score = 1 - sum of squared gaps, from -1 (all on a wrong arm) to 1.
  // Spreading points is the best strategy when you are unsure, and all-in pays only when you are sure.
  function allocate(c, shares) {
    const v = c.allocate.values, hi = Math.max(...v), best = v.map((x, i) => (c.allocate.best ? c.allocate.best.includes(i) : x === hi) ? 1 : 0), nb = best.reduce((a, b) => a + b, 0);  // allocate.best: arms the study did not separate
    const total = (shares || []).reduce((a, b) => a + Number(b || 0), 0);
    if (!total) return { score: 0, correct: false, detail: {} };
    const p = shares.map(s => Number(s || 0) / total);
    const score = 1 - p.reduce((a, x, i) => a + (x - best[i] / nb) ** 2, 0);
    const top = Math.max(...p);
    const onBest = p.reduce((a, x, i) => a + (best[i] ? x : 0), 0);
    return { score, correct: p.every((x, i) => x !== top || best[i]) && onBest >= 0.5, /* top weight on a best option and at least half the points there; a near-even split is not a call */ detail: { onBest: Math.round(100 * p.reduce((a, x, i) => a + (best[i] ? x : 0), 0)) } };
  }

  // Delegation: one routing decision per task; score = share routed as the evidence suggests.
  function delegate(c, picks) {
    const tasks = c.delegate.tasks;
    // t.also lists routes the study found equally good (no significant difference), which also count.
    const right = tasks.filter((t, i) => Array.isArray(picks) && (picks[i] === t.answer || (t.also || []).includes(picks[i]))).length;
    return { score: right / tasks.length, correct: right === tasks.length, detail: { right, total: tasks.length } };
  }

  const scorers = { choice, causal: choice, multi, estimate, forecast, rank, allocate, delegate };

  function score(c, response) {
    const fn = scorers[c.format];
    if (!fn) throw new Error('Unknown format ' + c.format);
    return fn(c, response);
  }

  // Is a response complete enough to lock?
  function ready(c, r) {
    switch (c.format) {
      case 'choice': case 'causal': return Number.isInteger(r) && r >= 0 && r < c.options.length;
      case 'multi': return Array.isArray(r) && r.length === (c.multiAnswers ? c.multiAnswers.length : c.pick || 2);
      case 'estimate': return typeof r === 'number' && isFinite(r);
      case 'forecast': return typeof r === 'number' && r >= 0 && r <= 100;
      case 'rank': return Array.isArray(r) && r.length === (c.rankAnswer ? c.rankAnswer.length : c.options.length) && new Set(r).size === r.length;
      case 'allocate': return Array.isArray(r) && r.reduce((a, b) => a + b, 0) === c.allocate.total;
      case 'delegate': return Array.isArray(r) && r.length === c.delegate.tasks.length && r.every(x => Number.isInteger(x));
      default: return false;
    }
  }

  // The probability the player assigned to "my answer is right".
  // For forecasts the stated probability is about the claim, so it is used directly.
  function statedProbability(c, response, confidence) {
    if (c.format === 'forecast') return Number(response);
    if (c.format === 'allocate') { const t = response.reduce((a, b) => a + b, 0) || 1; return 100 * Math.max(...response) / t }
    return Number(confidence);
  }

  // Reliability table and Brier score over records [{p: 0..100, outcome: 0|1}].
  function calibration(records, bins = 5) {
    const rows = Array.from({ length: bins }, (_, i) => ({ lo: i * 100 / bins, hi: (i + 1) * 100 / bins, n: 0, sumP: 0, hits: 0 }));
    let brier = 0;
    for (const r of records) {
      if (!r) continue;
      const p = clamp(r.p, 0, 100);
      const i = Math.min(bins - 1, Math.floor(p / (100 / bins)));
      rows[i].n++; rows[i].sumP += p; rows[i].hits += r.outcome;
      brier += (p / 100 - r.outcome) ** 2;
    }
    return {
      n: records.filter(Boolean).length,
      brier: records.filter(Boolean).length ? brier / records.filter(Boolean).length : null,
      bins: rows.map(b => ({ lo: b.lo, hi: b.hi, n: b.n, meanP: b.n ? b.sumP / b.n : null, hitRate: b.n ? 100 * b.hits / b.n : null })),
      overconfidence: (rs => rs.length ? rs.reduce((a, r) => a + r.p, 0) / rs.length - 100 * rs.reduce((a, r) => a + r.outcome, 0) / rs.length : null)(records.filter(Boolean))
    };
  }

  // A forecast converts to a calibration record about the claim; other formats about the answer.
  function toCalibrationRecord(c, rec) {
    // A forecast is folded to the side the player leaned to: 10% on a false claim is a 90% call that was right.
    if ((c && c.format === 'forecast') || rec.format === 'forecast') {
      const p = Number(rec.response), truth = rec.outcome ?? (c.forecast.truth ? 1 : 0);
      if (p === 50) return null;
      return { p: Math.max(p, 100 - p), outcome: (p > 50) === (truth === 1) ? 1 : 0 };
    }
    // An allocation states the chance that the top-weighted option is the best one.
    if (rec.format === 'allocate' && Array.isArray(rec.response)) {   // the event is "my top-weighted option is a best one", not the verdict's stricter rule
      // The outcome is stored on the record when it is made (topBest), because the served bank carries no answers after a reload.

// Each dot's call count goes on the first side (right, left, above, below) where it touches no dot and no other label (review 27, rule 31).
